gala – Bir Moghrein","with_country":"MR","with_country_name":"Mauritania","type":"road","location":{"city":"Amgala (Smara)","lat":26.45,"lng":-11.66},"traffic":"n/a (new inland crossing intended to divert Sahel-bound traffic from Guerguerat)","status":"operational","hours":"n/a","projects":"93 km Smara–Amgala–Tifariti road (MAD 49.7m, >95% complete Feb 2025); 3,600 m2 roadside station; Mauritania designated Bir Moghrein/Aïn Ben Tili crossings by decree (Feb 2025); inaugurated Sept 2025","notes":"Second Morocco–Mauritania crossing; lies in Western Sahara near the berm.","sources":["https://www.moroccoworldnews.com/2025/02/175158/morocco-opens-new-border-crossing-with-mauritania-at-amgala/","https://en.expresstv.ma/2025/09/morocco-and-mauritania-inaugurate-the-amgala-crossing-to-enhance-cooperation-and-connectivity-with-the-african-sahel/"]},{"id":"ma-zouj-beghal","name":"Zouj Beghal – Akid Lotfi","with_country":"DZ","with_country_name":"Algeria","type":"road","location":{"city":"Oujda","lat":34.71,"lng":-1.78},"traffic":"None; the 1,559 km land border has been closed since 1994","status":"closed","hours":"n/a","projects":"n/a","notes":"Opened only exceptionally for repatriations of bodies and returned migrants (2024-2026). Morocco–Algeria trade must move by sea or air; reopening would transform Oujda Technopole and Nador West Med hinterlands.","sources":["https://en.wikipedia.org/wiki/Algeria%E2%80%93Morocco_border","https://www.moroccoworldnews.com/2026/08/335518/algeria-returns-49-moroccan-migrants-through-oujda-border-crossing/","https://en.yabiladi.com/articles/details/173265/zouj-beghal-border-opens-return.html"]}]},"SA":{"country":{"code":"SA","name":"Saudi Arabia","region":"Gulf","capital":"Riyadh","coastline":"Red Sea (west) and Arabian Gulf (east)","summary":"Saudi Arabia is the Gulf's largest economy and the only GCC state with deep-water gateways on both the Red Sea and the Arabian Gulf, which made it the region's fallback corridor when Strait of Hormuz traffic was disrupted in 2026. Mawani (Saudi Ports Authority) ports handled 8.32m TEU in 2025 (+10.6%) with a 2030 target of 40m TEU under the National Transport and Logistics Strategy; Jeddah Islamic Port (DP World South Container Terminal and Red Sea Gateway Terminal), King Abdullah Port (privately owned by Ports Development Company) and King Abdulaziz Port Dammam (Saudi Global Ports, PIF/PSA) are the main container gateways. Mawani privatised multipurpose terminals at eight ports in June 2025 (SAR 2.2bn, 20-year concessions to Saudi Global Ports on the Gulf coast and RSGT on the Red Sea), while SAR is delivering the ~SAR 100bn Saudi Landbridge rail (Jeddah-Riyadh-Dammam) targeted for 2034 and the 672 km Saudi section of the GCC Railway. New capacity is coming from CMA CGM/RSGT's Terminal 4 at Jeddah (2.6m TEU, US$434m, signed Aug 2026), Port of NEOM's automated T1 (1.5m TEU, 2026-27), Jubail Commercial Port (2.4m TEU) and Hutchison's JCPDI port in Jazan.","key_operators":["DP World (Jeddah South Container Terminal)","Red Sea Gateway Terminal (RSGT; SISCO/PIF/COSCO Shipping Ports)","Saudi Global Ports (PIF / PSA International / Al Blagha)","Ports Development Company (King Abdullah Port)","Hutchison Ports (JCPDI Jazan)","CMA CGM (Jeddah Terminal 4 JV)","APM Terminals (37.5% of Jeddah SCT, reported 2026)","Saudi Aramco (Ras Tanura, Yanbu, SPARK)","Saudi Arabia Railways (SAR)","Mawani (Saudi Ports Authority)"],"sources":["https://container-news.com/mawani-reports-10-58-growth-in-container-throughput-in-2025/","https://www.prnewswire.com/news-releases/mawani-signs-privatization-contracts-for-multipurpose-cargo-terminals-at-eight-saudi-ports-with-over-sar-2-2-billion-in-private-sector-investments-302492392.html","https://www.arabnews.com/node/2638772/amp","https://guest.meed.com/contract-award-nears-for-saudi-landbridge-riyadh-section/","https://www.arabnews.com/node/2644172/business-economy"]},"ports":[{"id":"sa-jeddah-islamic-port","name":"Jeddah Islamic Port","type":"container","location":{"city":"Jeddah","lat":21.47,"lng":39.16},"operator":"Mawani (landlord); terminals: DP World Jeddah (South Container Terminal), Red Sea Gateway Terminal (North Container Terminal + Terminal 4 JV with CMA CGM), RSGT multipurpose terminal (2025 privatisation)","concession":"DP World: 30-year BOT for South Container Terminal (renewed 2020, modernised 2022-2025); RSGT: existing concession for North terminal, extended to Terminal 4 (definitive JV agreements with CMA CGM signed 25 Aug 2026); RSGT also awarded 20-year multipurpose cargo terminal concession (June 2025)","capacity":"Port: 130m tonnes/year, 62 berths, 12.5 km2 (Saudipedia). DP World SCT: 4m TEU (target 5m), 2,150 m quay, 18 m draft, 14 STS cranes rising to 17 (end-2025) and 22 at full build. Terminal 4: up to 2.6m TEU, 10 STS cranes (planned)","throughput":"RSGT alone 3.38m TEU (2025, up from 3.19m in 2024); Jeddah handles the majority of Saudi container traffic (Mawani system total 8.32m TEU in 2025); DP World SCT throughput not disclosed","status":"operational","opened":"1976","projects":"DP World SCT SAR 3bn (US$800m) modernisation inaugurated 7 Mar 2025; adjacent 415,000 m2 Jeddah Logistics Park due Q2 2026; RSGT/CMA CGM Terminal 4, US$434m, term sheet Oct 2025, definitive agreements Aug 2026; new short-sea services Jeddah-Salalah-Djibouti (1,730 TEU) and Red Sea Express to Ain Sokhna/Aqaba (2026)","notes":"DP WORLD ASSET (South Container Terminal). Arab News reported (Apr 2026) that APM Terminals acquired a 37.5% stake in the South Container Terminal in Feb 2026, integrating it into the Maersk network. Competitors on-site: RSGT (COSCO Shipping Ports/PIF/SISCO shareholders) and CMA CGM via Terminal 4. Western end of the 1,300 km Jeddah-Riyadh-Dammam trucking landbridge used by MSC and others to bypass Hormuz in 2026.","sources":["https://www.dpworld.com/en/news/dp-world-and-mawani-inaugurate-800-million-state-of-the-art-terminal-in-jeddah","https://www.portseurope.com/red-sea-gateway-terminal-posts-higher-teu-throughput-in-2025-cosco/","https://www.worldcargonews.com/business/2026/08/cma-cgm-rsgt-seal-us434m-jeddah-terminal-deal/","https://www.cmacgm-group.com/en/news-media/rsgt-cma-cgm-sign-term-sheet-joint-venture-development-operation-terminal-4-jeddah","https://saudipedia.com/en/saudi-ports-authority","https://www.arabnews.com/node/2638772/amp","https://trans.info/en/saudi-arabia-red-sea-478762"]},{"id":"sa-king-abdullah-port","name":"King Abdullah Port (KAEC)","type":"container","location":{"city":"King Abdullah Economic City (Rabigh)","lat":22.51,"lng":39.09},"operator":"Ports Development Company (PDC) - owner, developer and operator; first privately owned/funded commercial port in Saudi Arabia","concession":"Private ownership/development by PDC under KAEC master concession (Emaar The Economic City / PIF ecosystem); n/a for third-party terminal concessions","capacity":"Container: 6.5m TEU current design (Saudipedia; PDC site cites 5.5m current / 25m ultimate); draft 18 m; dry bulk 3m t, agri bulk 4m t, general cargo 2m t, ro-ro 200,000 CEU; 17.4 km2; ultimate plan 20m+ TEU, 1.5m CEU, 15m t bulk","throughput":"2,929,807 TEU (2023); 2.3m TEU (2018)","status":"operational","opened":"2014 (first operations); officially inaugurated 11 Feb 2019","projects":"Ongoing crane and yard expansion (28 Liebherr cranes delivered to lift capacity toward 5m TEU); planned rail connection via Saudi Landbridge (Jeddah-KAP-Riyadh line and KAP-Yanbu link); KAEC King Salman Automotive Cluster phase 1 (SAR 547m contract, May 2026) will add ro-ro/auto volumes","notes":"Ranked most efficient port in World Bank CPPI 2022; Lloyd's List rank 70 (2024). Handles MSC's largest vessels (MSC Irina, 23,500+ TEU) and is the second handover port for MSC's 2026 Europe-Red Sea-Saudi landbridge service. Competitor to DP World Jeddah for Red Sea transshipment and Western Region imports; PDC/KAEC has explored an IPO or private placement.","sources":["https://www.kingabdullahport.c uthority","status":"planned","capacity_or_traffic":"n/a","projects":"SAR design consultancy tender issued 7 May 2026 (bids 30 Jun 2026); concept-to-construction design; Kuwait side design awarded; UAE 684 km section by Etihad Rail","notes":"Would give Dammam/Jubail rail access to Jebel Ali/Khalifa Port and Kuwait; Ras Al Khair-Jubail segment already under SAR. Long-delayed (original 2018/2021 targets missed).","sources":["https://www.meed.com/saudi-arabia-tenders-gcc-rail-link-from-kuwait-to-uae-border","https://constructionreviewonline.com/15-billion-saudi-arabia-gcc-railway-project-advances-with-672km-kuwait-uae-border-tender/"]},{"id":"sa-red-sea-gulf-trucking-landbridge","name":"Red Sea - Gulf trucking landbridge (Jeddah/KAP - Riyadh - Dammam) during the 2026 Hormuz disruption","modes":["road","multimodal"],"route":"Jeddah Islamic Port / King Abdullah Port → Riyadh → Dammam (feeder to Jebel Ali, Abu Dhabi, Kuwait, Bahrain, Qatar)","countries":["SA"],"length":"~1,300 km","operator":"Mawani-coordinated logistics corridors; carriers incl. MSC (Europe-Red Sea-Saudi landbridge service launched May 2026), DSV and other road hauliers","status":"operational","capacity_or_traffic":"n/a; cross-border trucking rates escalated sharply in 2026 (fuel, war-risk surcharges, container shortages, border queues)","projects":"Mawani set up logistics corridors redirecting Eastern Region cargo to Jeddah and Red Sea ports (2026); MSC hybrid sea-land service from Antwerp/German/Italian/Spanish/Lithuanian ports via Suez to Jeddah/KAP then truck to Dammam","notes":"Demonstrates Saudi Arabia's two-coast redundancy; supports the business case for the Saudi Landbridge rail and for logistics parks at Jeddah (DP World Jeddah Logistics Park, Agility 82,000 m2 Jeddah warehouses 2026).","sources":["https://trans.info/en/msc-saudi-landbridge-472744","https://ti-insight.com/briefs/gulf-logistics-monitor-may-2026/","https://www.arabnews.com/node/2638772/amp"]},{"id":"sa-east-west-pipeline","name":" ,"notes":"n/a","sources":["https://en.wikipedia.org/wiki/Kuwait%E2%80%93Saudi_Arabia_border"]},{"id":"sa-jadidat-arar","name":"Jadidat Arar (Arar border crossing)","with_country":"IQ","with_country_name":"Iraq","type":"road","location":{"city":"Arar, Northern Borders Province","lat":31.36,"lng":41.44},"traffic":"Main Saudi-Iraq trade and pilgrim crossing; heavy Hajj-season traffic; truck volumes n/a","status":"operational","hours":"n/a","projects":"Reopened 18 Nov 2020 after 30-year closure (trial opening Oct 2019); Saudi-Iraq road and trade-zone plans linked to the crossing","notes":"Security context: ISIL attack on the checkpoint in Jan 2015; the Al Jumaimah crossing (Iraq-Saudi) is a second planned/secondary crossing but no verified source was found.","sources":["https://en.wikipedia.org/wiki/Arar_border_crossing","https://en.wikipedia.org/wiki/Iraq%E2%80%93Saudi_Arabia_border"]},{"id":"sa-al-haditha-omari","name":"Al Haditha (Al Haditha - Al Omari)","with_country":"JO","with_country_name":"Jordan","type":"road","location":{"city":"Al Haditha, Al Jouf Province","lat":31.52,"lng":37.17},"traffic":"Principal Saudi-Jordan freight crossing (Riyadh/Dammam - Amman - Levant/Turkey trucking); volumes n/a","status":"operational","hours":"n/a","projects":"Planned SAR North-South rail extension to Al Haditha; designated IMEC rail crossing point toward Jordan/Israel (US$2.09bn Jordan link, unfunded as of 2026)","notes":"One of three official Jordan-Saudi crossings (Umari, Mudawwara/Halat Ammar, Durra).","sources":["https://en.wikipedia.org/wiki/Jordan%E2%80%93Saudi_Arabia_border","https://mei.edu/backgrounder/the-india-middle-east-europe-economic-corridor/"]},{"id":"sa-durra","name":"Al Durra (Durra - Aqaba)","with_country":"JO","with_country_name":"Jordan","type":"road","location":{"city":"Haql, Tabuk Province","lat":29.35,"lng":34.98},"traffic":"Coastal crossing linking Aqaba with Haql/NEOM and the Saudi Red Sea coast road; volumes n/a","status":"operational","hours":"n/a","projects":"n/a (NEOM development raising relevance)","notes":"Southern-most of the three official Jordan-Saudi crossings; closest to Aqaba port and NEOM.","sources":["https://en.wikipedia.org/wiki/Jordan%E2%80%93Saudi_Arabia_border"]},{"id":"sa-empty-quarter-oman","name":"Empty Quarter (Rub' al Khali - Ramlat Khaliya) crossing","with_country":"OM","with_country_name":"Oman","type":"road","location":{"city":"Rub' al Khali, Eastern Province (approximate)","lat":22.6,"lng":55.2},"traffic":"Direct Saudi-Oman road (Al Ahsa - Ibri) avoiding UAE transit; volumes n/a","status":"operational","hours":"n/a","projects":"n/a","notes":"Wikipedia records the first official Saudi-Oman crossing at Ramlat Khaliya opened in 2006; the direct desert highway was formally opened in Dec 2021 (not independently verified here). Coordinates approximate.","sources":["https://en.wikipedia.org/wiki/Oman%E2%80%93Saudi_Arabia_border"]}]},"SY":{"country":{"code":"SY","name":"Syria","region":"Levant","capital":"Damascus","coastline":"Eastern Mediterranean (approx. 180 km, Latakia and Tartus governorates)","summary":"Since the December 2024 political transition and the lifting of most US sanctions in June 2025, Syria is being repositioned as a land bridge between Türkiye/Europe, the Gulf, Iraq and Lebanon. The two commercial gateways are Latakia (CMA CGM's LICT container terminal, 30-year concession amended May 2025, AD Ports 20% stake) and Tartus (DP World, 30-year BOT concession signed July 2025, USD 800m, operations from November 2025), with Baniyas serving as the oil/gas terminal that since April 2026 has been re-exporting Iraqi fuel trucked across the reopened Rabia/Yaarubiyah and Bukamal/Qaim crossings. Free zones (Adra, Damascus Airport, Latakia, Tartus) and industrial cities (Adra, Sheikh Najjar, Hasya) are refilling, Chinese, Turkish, Gulf and Qatari investors are active, and Türkiye–Syria–Jordan transit, the Hejaz railway and the Kirkuk–Baniyas pipeline are the headline corridor projects. Caveats: residual EU/UN/Caesar-related compliance checks, damaged roads and rail, unexploded ordnance, localized security incidents (north-east, south, coast) and Israeli strikes near the Lebanese border remain material risks.","key_operators":["DP World","CMA CGM / CMA Terminals","AD Ports Group","General Authority for Land and Sea Ports (GALSP)","General Establishment of Free Zones","Chemins de fer syriens (CFS)","Syrian Petroleum Company","Fidi Contracting (China)"],"sources":["https://www.dpworld.com/en/news/dp-world-to-develop-syrias-tartus-port-under-landmark-30-year-deal","https://www.adportsgroup.com/en/news-and-media/2025/11/06/ad-ports-group-signs-agreement-with-cma-cgm-group-to-acquire-minority-stake-in-latakia-terminal","https://sana.sy/en/economic/2334608/","https://www.arabnews.com/node/2641485/amp","https://sana.sy/en/syria/2318993/"]},"ports":[{"id":"sy-tartus","name":"Port of Tartus (Tartous)","type":"multipurpose","location":{"city":"Tartus","lat":34.895,"lng":35.865},"operator":"DP World (concessionaire, since November 2025); landlord: General Authority for Land and Sea Ports (GALSP)","concession":"30-year build-operate-transfer concession signed 13 July 2025 between DP World and GALSP, witnessed by President al-Sharaa; USD 800m investment over the term. DP World formally commenced operations 12 November 2025 (CEO Fahad Al Banna). Replaced the Russian Stroytransgaz management contract terminated by the interim government in early 2025.","capacity":"n/a (multipurpose: containers, general cargo, bulk, breakbulk, ro-ro; phosphate export outlet); three new mobile harbour cranes (2026) expected to raise cargo-handling capacity by ~40%","throughput":"551 vessels and ~5m tonnes in H1 2026 (3.9m t imports, 1.1m t exports; 33 container vessels)","status":"operational","opened":"n/a","projects":"USD 800m modernisation: dredging of access channel and berths, quay-wall refurbishment, replacement of handling equipment, digital port systems, expanded storage and bulk-handling systems; 3 mobile harbour cranes installed by September 2026, 9 further light-duty mobile harbour cranes due 2027–early 2028, 1 new quay crane due 2028; new 50-t bollard-pull tug 'Al Fath' commissioned 2025; DP World also exploring free zones, inland logistics hubs and transit corridors (MoU stage, 2025).","notes":"DP WORLD ASSET. Syria's second-largest port and main dry/general-cargo gateway; historic outlet for phosphate (rail link from Khneifis/Palmyra mines flagged as priority rehabilitation by transport ministry, 2025). Adjacent Russian naval facility status remains a political sensitivity. Sanctions: US sanctions largely lifted June 2025; EU sanctions eased 2025; residual designations require KYC screening.","sources":["https://www.dpworld.com/en/news/dp-world-to-develop-syrias-tartus-port-under-landmark-30-year-deal","https://www.dpworld.com/en/news/dp-world-commences-operations-at-tartus-port","https://www.enr.com/articles/63645-dp-world-installs-harbor-cranes-under-800mn-tartus-port-modernization","https://sana.sy/en/economic/2334608/","https://www.iiss.org/online-analysis/online-analysis/2025/07/tartus-port-and-syrias-new-geo-economic-strategy/"]},{"id":"sy-latakia","name":"Port of Latakia / Latakia International Container Terminal (LICT)","type":"container","location":{"city":"Latakia","lat":35.52,"lng":35.78},"operator":"CMA Terminals (CMA CGM Group) operates LICT since 2009; AD Ports Group acquiring 20% stake (agreement 6 Nov 2025, AED 81m / USD 22m); general-cargo berths under GALSP / Latakia Port General Company","concession":"Amended 30-year concession for LICT signed 1 May 2025 between CMA CGM and GALSP (original concession dates from 2009).","capacity":"250,000 TEU/year (2025); target 625,000 TEU/year by end-2026; long-term >1m TEU/year with 16 m draft after phase 2","throughput":"~171,000 TEU and 2.86m tonnes in H1 2026 (394 vessels, of which 186 container vessels); LICT handles ~95% of Syria's containerised trade","status":"operational","opened":"1950s (port); LICT concession 2009","projects":"Phase 1 EUR 30m upgrade under way (2025); phase 2 EUR 200m (~USD 231m) expansion accelerated after August 2025 Damascus meeting: new quay/deepening to 16 m, modern cargo-handling equipment, digitalised operations; MoU between Syrian Railways (CFS) and LICT (2025) to move containers by rail to inland dry ports at Adra, Homs and Aleppo.","notes":"COMPETITOR CONCESSION (CMA CGM + AD Ports). Syria's primary container gateway and the country's largest port by container volume; hinterland via M4/M1 highways to Aleppo and Homs. Coastal region saw sectarian violence in March 2025; security has since stabilised but remains a monitoring item.","sources":["https://www.porttechnology.org/news/cma-cgm-accelerates-e200-million-expansion-at-latakia-port/","https://www.adportsgroup.com/en/news-and-media/2025/11/06/ad-ports-group-signs-agreement-with-cma-cgm-group-to-acquire-minority-stake-in-latakia-terminal","https://sana.sy/en/economic/2334608/","https://sana.sy/en/syria/2318993/"]},{"id":"sy-baniyas","name":"Baniyas Oil Terminal and Refinery","type":"oil & gas","location":{"city":"Baniyas","lat":35.18,"lng":35.94},"operator":"Syrian Petroleum Company / Baniyas Refinery Company (Ministry of Energy); terminal operated with GALSP","concession":"n/a (state-owned)","capacity":"Refinery nameplate ~130,000 b/d (returned to full production May 2026 per Enab Baladi); marine terminal loads Aframax-class tankers; truck offloading ~900 tankers/day (July 2026)","throughput":"Over 2m tonnes of Iraqi petroleum products transited since January 2026 (as of August 2026); Iraqi fuel-oil contracts ~650,000 t/month (Apr–Jun 2026); first Iraqi cargo (~500,000 t) loaded 15 April 2026; three Aframax cargoes (~1.42m bbl) shipped to US Gulf by July 2026","status":"operational","opened":"1979 (refinery); terminal originally the Kirkuk–Baniyas pipeline outlet (1952)","projects":"Kirkuk–Baniyas crude pipeline revival: two MoUs signed 17–18 July 2026 (Syrian Petroleum Co.–Basra Oil Co.; and with a Chevron / UCC Holding / TI Capital consortium for technical and financial studies), witnessed by the Iraqi PM and US energy secretary; Iraq cabinet (25 July 2026) authorised Basra Oil Co. to pursue the Mediterranean pipeline. Plans to add crude and naphtha to fuel-oil re-exports (not yet commercial as of July 2026).","notes":"Syria's primary import terminal for crude and refined products; became the Mediterranean outlet for Iraqi fuel after Strait of Hormuz disruptions in early 2026, with tanker-truck queues of 30+ km on the Tartus–Baniyas highway. Consolidation pace one marine tanker every 7–10 days (July 2026). Relevant to DP World's Tartus liquid-bulk/energy-logistics ambitions.","sources":["https://english.aawsat.com/business/5262888-syria%E2%80%99s-baniyas-begins-loading-iraqi-oil-shipments-re-export","https://tanktransport.com/2026/07/iraq-syria-fuel-corridor/","https://shafaq.com/en/Economy/Energy-transit-drives-recovery-in-Syria-Iraq-trade","https://sana.sy/en/economic/2330203/","https://english.enabbaladi.net/archives/2026/05/baniyas-refinery-resumes-full-production/amp/"]},{"id":"sy-arwad","name":"Arwad Island harbour","type":"fishing","location":{"city":"Arwad (Tartus)","lat":34.856,"lng":35.858},"operator":"Tartus governorate / GALSP (small craft harbour; ferries from Tartus)","concession":"n/a","capacity":"n/a (small fishing and passenger-boat harbour; traditional wooden boat-building)","throughput":"n/a","status":"operational","opened":"n/a (ancient Phoenician port)","projects":"President al-Sharaa's first-ever presidential visit (7 June 2026) framed Arwad as part of the Tartus/Latakia coastal-investment platform; tourism and access upgrades announced for the 2026 season; a Qatari-Syrian company unveiled coastal tourism/real-estate projects (September 2026). No commercial-port project identified.","notes":"Not a commercial cargo port; included for completeness as the only inhabited Syrian island, eral Establishment of Free Zones / GALSP","area":"n/a","sectors":["logistics","light industry","commercial storage","services"],"incentives":"Free-zone tax and customs exemptions; investment plots re-tendered from 27 April 2025","tenants":"Fully occupied (September 2026), mixed industrial/commercial/service","status":"operational","opened":"n/a","projects":"Included in the April 2025 GALSP call for investors; benefits from LICT phase-2 expansion (EUR 200m).","notes":"Two components: an internal (city) zone and a port zone inside the Latakia port perimeter. Competitor-linked (CMA CGM / AD Ports terminal).","sources":["https://english.enabbaladi.net/archives/2025/04/ports-authority-launches-new-investment-opportunities-in-free-zones/","https://english.enabbaladi.net/archives/2026/09/free-zones-sign-800-contracts-expect-1000-investors-by-end-of-2026/"]},{"id":"sy-tartus-free-zone","name":"Tartus Port Free Zone","type":"port-linked zone","location":{"city":"Tartus","lat":34.9,"lng":35.87},"authority":"General Establishment of Free Zones / GALSP; DP World concession covers port operations","area":"n/a","sectors":["logistics","warehousing","trading"],"incentives":"Free-zone tax and customs exemptions; investment plots re-tendered from 27 April 2025","tenants":"n/a","status":"operational","opened":"n/a","projects":"DP World's July 2025 agreement includes exploring free zones and inland logistics hubs around Tartus; 90% of ready-built free-zone facilities nationwide occupied (2026).","notes":"DP WORLD-adjacent asset: the port free zone is the logical location for a DP World logistics/free-zone extension of the Tartus concession.","sources":["https://english.enabbaladi.net/archives/2025/04/ports-authority-launches-new-investment-opportunities-in-free-zones/","https://www.dpworld.com/en/news/dp-world-to-develop-syrias-tartus-port-under-landmark-30-year-deal"]},{"id":"sy-damascus-airport-free-zone","name":"Damascus International Airport Free Zone","type":"logistics zone","location":{"city":"Damascus","lat":33.41,"lng":36.51},"authority":"General Authority for Land and Sea Border Crossings / General Establishment of Free Zones","area":"n/a","sectors":["air cargo","transit logistics","services"],"incentives":"Free-zone exemptions; positioned as air-transit hub","tenants":"Damascus Free Zone reported at 100% occupancy (2026), service-focused","status":"operational","opened":"Reopened 26 October 2025 after 14-year suspension","projects":"Turkish consortium won tender (August 2025) to renovate and expand Damascus International Airport.","notes":"Aims to link air cargo with road transit to Iraq, Lebanon, Jordan and Türkiye.","sources":["https://english.enabbaladi.net/archives/2025/11/damascus-airport-free-zone-poised-to-become-a-regional-transit-hub/"]},{"id":"sy-deir-ezzor-industrial-city","name":"Deir ez-Zor Industrial City","type":"industrial zone","location":{"city":"Deir ez-Zor","lat":35.33,"lng":40.14},"authority":"Ministry of Economy and Industry","area":"2,850 ha","sectors":["food","textiles","engineering","chemicals","petrochemicals","energy","logistics"],"incentives":"Industrial-city customs exemptions on machinery; new free-trade zone announced for Deir ez-Zor governorate (2025)","tenants":"n/a","status":"under construction","opened":"n/a","projects":"MoU with a petrochemical/energy/logistics company (2026); planned free-trade zone in Deir ez-Zor to serve Iraq trade (North Press, 2025).","notes":"Positioned on the Euphrates corridor toward Al-Bukamal/Al-Qaim; security context (ISIS remnants in the Badia) remains a constraint.","sources":["https://sana.sy/en/economic/2339895/","https://npasyria.com/en/49649/"]}],"corridors":[{"id":"sy-turkiye-jordan-gulf-road-transit","name":"Türkiye – Syria – Jordan / Gulf road transit corridor (Bab al-Hawa – Aleppo – M5 – Damascus – Nassib)","modes":["road"],"route":"Cilvegözü/Bab al-Hawa → Aleppo → Hama → Homs → Damascus (M5) → Nassib/Jaber → Amman → Saudi Arabia/Gulf","countries":["TR","SY","JO","SA"],"length":"~500 km within Syria (Bab al-Hawa to Nassib)","operator":"Syrian General Authority for Land and Sea Border Crossings; Ministry of Transport; Turkish and Jordanian transport ministries (trilateral MoU 2025)","status":"operational","capacity_or_traffic":"Pre-2011 the corridor carried 100,000–115,000 transit trucks/year; Turkish trucks resumed transit to Jordan/Gulf in 2025; ~1,000 lorries/day at Nassib (Feb 2026)","projects":"June 2025 Türkiye–Syria road-transport agreement; trilateral Türkiye–Syria–Jordan MoU to harmonise customs, fees and visas with 'tangible progress' targeted before end-2026; Bab al-Hawa freight-yard and logistics-centre expansion (2026); Syria seeking grants for highway rehabilitation.","notes":"February 2026 Syrian ban on foreign lorries (truck-to-truck transloading at customs yards) and Jordan's reciprocal measures caused delays; roads need major rehabilitation; unexploded ordnance and localized security incidents. Turkey–Syria trade USD 3.75bn (2025).","sources":["https://sana.sy/en/syria/2318993/","https://gulfnews.com/business/markets/turkey-to-reopen-land-trade-corridor-to-jordan-gcc-through-syria-by-2026-1.500339710","https://www.thenationalnews.com/news/mena/2026/02/09/syria-jordan-transport-al-shara/","https://www.arabnews.com/node/2641485/amp"]},{"id":"sy-turkiye-rail-link","name":"Syria – Türkiye rail links (Gaziantep–Meydan Ekbez–Aleppo; Karkamış–Nusaybin border line)","modes":["rail"],"route":"Gaziantep → Karkamış / Meydan Ekbez (Midan Ikbis) & Al-Rai (Çobanbey) → Aleppo; Turkish 350-km Karkamış–Nusaybin line along the border → Qamishli","countries":["TR","SY"],"length":"~350 km (Turkish border line: 325 km Karkamış–Nusaybin + 25 km Mardin–Şenyurt); Aleppo–border sections ~60–100 km","operator":"TCDD (Türkiye) / Chemins de fer syriens (CFS)","status":"under construction","capacity_or_traffic":"n/a (no through freight since 2011–2012)","projects":"TCDD rehabilitation of Karkamış–Nusaybin line (Karkamış bridge overhaul, sleepers, ballast) targeted for reopening Q1 2026; Turkish transport minister (Aug 2025) committed to resume Gaziantep–Aleppo trains; Syrian sections via Midan Ikbis and al-Rai need reconstruction after extensive damage; Qamishli/Nusaybin rail-crossing infrastructure complete on Turkish side awaiting Syrian customs opening (Aug 2026). Syria estimates USD 5.5bn to bring its 2,800-km network (1,052 km operational) to international standard; World Bank grants of USD 65–200m sought.","notes":"Would connect Aleppo/Sheikh Najjar with the Turkish and European networks; aligns with Türkiye's Ovaköy–Nusaybin development corridor. Aleppo–Hama passenger service resumed August 2025 after 13 years.","sources":["https://www.hurriyetdailynews.com/turkiye-targets-early-2026-reopening-of-350-km-railway-along-syrian-border-216622","https://sana.sy/en/syria/2318993/","https://www.agbi.com/logistics/2025/12/syria-begins-to-rebuild-freight-rail-network/","https://english.enabbaladi.net/archives/2025/08/after-13-years-of-suspension-the-aleppo-hama-train-returns-to-service/"]},{"id":"sy-hejaz-railway-damascus-amman","name":"Hejaz Railway rehabilitation (Damascus – Daraa – Amman) and Damascus – Aleppo CFS mainline","modes":["rail"],"route":"Aleppo → Hama → Homs → Damascus (standard gauge CFS) ; Damascus → Daraa → Jaber/Nassib → Amman (narrow-gauge Hejaz line)","countries":["SY","JO","TR","SA"],"length":"Damascus–Amman ~220 km; Damascus–Aleppo ~360 km","operator":"Chemins de fer syriens (CFS) / Hejaz Railway Directorate; Jordan Hejaz Railway; trilateral Jordan–Syria–Türkiye cooperation (September 2025)","status":"planned","capacity_or_traffic":"n/a (Damascus–Amman out of service since 2011)","projects":"Trilateral agreement (Sept 2025): Türkiye supports reconstruction, Jordan provides locomotive maintenance; passenger service targeted for Q4 2026 subject to funding, freight upgrades in 3–5 years; new standard-gauge Damascus–Jordan border line with possible Saudi extension under study; Damascus–Aleppo rehabilitation under way; target freight speeds 100–120 km/h; World Bank grant of USD 65–200m sought.","notes":"Long-term vision links Istanbul–Aleppo–Damascus–Amman–Saudi Arabia/GCC; pre-2011 freight also ran Tartus–Baghdad–Umm Qasr. Financing largely unsecured as of 2026.","sources":["https://www.arabnews.com/node/2618410/business-economy","https://sana.sy/en/syria/2318993/","https://www.agbi.com/logistics/2025/12/syria-begins-to-rebuild-freight-rail-network/"]},{"id":"sy-iraq-fuel-truck-corridor","name":"Iraq – Syria overland fuel corridor (Rabia/Yaarubiyah & al-Waleed → Baniyas)","modes":["road"],"route":"Iraqi refineries/fields → Rabia–Al-Yaarubiyah and Al-Waleed–Al-Tanf crossings → M4/M20 highways → Homs → Tartus–Baniyas highway → Baniyas terminal","countries":["IQ","SY"],"length":"~700–900 km depending on crossing","operator":"Syrian Petroleum Company / Iraqi SOMO and Basra Oil Company; private tanker-truck fleets","status":"operational","capacity_or_traffic":"~900 tanker trucks/day unloading at Baniyas (July 2026); ~650,000 t/month fuel-oil contracts (Apr–Jun 2026); >2m t transited Jan–Aug 2026","projects":"Launched April 2026 as a Hormuz bypass; Rabia crossing reopened 20 April 2026 (first convoy 1 May); plans to add crude and naphtha; to be superseded by Kirkuk–Baniyas pipeline if rehabilitated.","notes":"Stopgap route, slower and costlier than pipeline; 30-km truck queues near Baniyas; ISIS activity in the eastern Badia and highway damage are risks. Generates transit fees and port charges for Damascus.","sources":["https://tanktransport.com/2026/07/iraq-syria-fuel-corridor/","https://www.thenationalnews.com/news/mena/2026/04/21/iraq-reopens-rabia-border-crossing-to-ease-fuel-shipments-through-syria/","https://shafaq.com/en/Economy/Energy-transit-drives-recovery-in-Syria-Iraq-trade"]},{"id":"sy-kirkuk-baniyas-pipeline","name":"Kirkuk – Baniyas crude oil pipeline (revival)","modes":["pipeline"],"route":"Kirkuk (Iraq) → Haditha → Syrian border → tus with GALSP before planning flows.","sources":["https://english.enabbaladi.net/archives/2024/09/after-ras-al-ain-crossing-upgrade-what-are-the-crossings-connecting-syria-to-turkey/"]},{"id":"sy-qamishli-nusaybin","name":"Qamishli / Nusaybin","with_country":"TR","with_country_name":"Türkiye","type":"road+rail","location":{"city":"Qamishli (Hasakah)","lat":37.05,"lng":41.22},"traffic":"n/a","status":"planned","hours":"n/a","projects":"All Turkish-side infrastructure and superstructure completed (Aug 2026), awaiting opening of Syrian customs post in Qamishli; connects to the rehabilitated Karkamış–Nusaybin railway","notes":"Would be the only rail-capable Syria–Türkiye crossing in the north-east; timing depends on Damascus–SDF integration in Hasakah.","sources":["https://english.enabbaladi.net/archives/2026/08/turkey-continues-upgrading-syria-border-crossings/","https://www.hurriyetdailynews.com/turkiye-targets-early-2026-reopening-of-350-km-railway-along-syrian-border-216622"]},{"id":"sy-nassib","name":"Nassib / Jaber","with_country":"JO","with_country_name":"Jordan","type":"road","location":{"city":"Nassib (Daraa)","lat":32.545,"lng":36.2},"traffic":"~1,000 lorries/day (Feb 2026); Syria–Jordan trade USD 432m Jan–Nov 2025 (nearly double 2024)","status":"operational","hours":"24/7 (announced 2025)","projects":"Trilateral Türkiye–Syria–Jordan customs-harmonisation MoU (2025); Jordan resumed truck-to-truck exports (2025)","notes":"Only open Syria–Jordan crossing and the sole gateway to the Gulf overland. February 2026 Syrian ban on foreign lorries (mandatory transloading) and reciprocal Jordanian measures stranded hundreds of trucks; watch for policy volatility. Nassib free zone exists on the Syrian side.","sources":["https://www.thenationalnews.com/news/mena/2026/02/09/syria-jordan-transport-al-shara/","https://jordantimes.com/news/local/jordan-resume-truck-truck-exports-syria-through-jaber-nasib-crossing-minister"]},{"id":"sy-al-bukamal","name":"Al-Bukamal / Al-Qaim","with_country":"IQ","with_country_name":"Iraq","type":"road","location":{"city":"Al-Bukamal (Deir ez-Zor)","lat":34.42,"lng":40.95},"traffic":"Cargo trucks and passengers; Syrian exports to Iraq USD 62m (2025)","status":"operational","hours":"n/a","projects":"Deir ez-Zor–Al-Bukamal rail rehabilitation listed as priority (2025); planned Deir ez-Zor free-trade zone","notes":"Reopened for commercial and passenger traffic 14 June 2025 after joint security assessments; Euphrates corridor to Baghdad. Security: ISIS remnants in the Badia; former Iranian-militia transit hub.","sources":["https://www.middleeastmonitor.com/20250614-iraq-reopens-syria-crossing-for-trade-and-passenger-traffic/","https://shafaq.com/en/Economy/Energy-transit-drives-recovery-in-Syria-Iraq-trade"]},{"id":"sy-al-yaarubiyah","name":"Al-Yaarubiyah / Rabia","with_country":"IQ","with_country_name":"Iraq","type":"road","location":{"city":"Al-Yaarubiyah (Hasakah)","lat":36.8,"lng":42.06},"traffic":"Primary entry for Iraqi fuel-oil tanker convoys to Baniyas (share of ~900 trucks/day nationally, 2026)","status":"operational","hours":"n/a","projects":"Iraq prepared reopening of Rabia and al-Waleed in Feb 2026; Yaarubiyah free zone plots offered by GALSP","notes":"Reopened 20 April 2026 after 10+ years (first convoy 1 May 2026) specifically to support fuel exports during the Hormuz disruption; north-east security and Damascus–SDF integration remain caveats.","sources":["https://www.thenationalnews.com/news/mena/2026/04/21/iraq-reopens-rabia-border-crossing-to-ease-fuel-shipments-through-syria/","https://tanktransport.com/2026/07/iraq-syria-fuel-corridor/","https://english.enabbaladi.net/archives/2026/02/al-waleed-and-rabia-border/"]},{"id":"sy-al-tanf-al-waleed","name":"Al-Tanf / Al-Waleed","with_country":"IQ","with_country_name":"Iraq","type":"road","location":{"city":"Al-Tanf (Homs)","lat":33.49,"lng":38.66},"traffic":"Iraqi fuel convoys (2026); Baghdad–Damascus highway route","status":"operational","hours":"n/a","projects":"Iraq prepared reopening in Feb 2026","notes":"Historic Baghdad–Damascus highway crossing; area of former US/coalition base; desert route with ISIS risk.","sources":["https://english.enabbaladi.net/archives/2026/02/al-waleed-and-rabia-border/","https://tanktransport.com/2026/07/iraq-syria-fuel-corridor/","https://www.arabnews.com/node/2641485/amp"]},{"id":"sy-jdeidet-yabous","name":"Jdeidet Yabous / Masnaa","with_country":"LB","with_country_name":"Lebanon","type":"road","location":{"city":"Jdeidet Yabous (Rif Dimashq)","lat":33.65,"lng":35.98},"traffic":"Only operating commercial Syria–Lebanon crossing (2026); Beirut–Damascus highway","status":"operational","hours":"24/7","projects":"Simplified procedures and accelerated inspections (2026)","notes":"Resumed operations March 2026 after closure; briefly shut 4 April 2026 after an Israeli evacuation warning targeting Masnaa (strike averted after US/Syrian intervention). High exposure to Israel–Lebanon conflict.","sources":["https://qna.org.qa/en/News-Area/News/2026-3/4/syrias-jdeidet-yabous-border-crossing-with-lebanon-resumes-operations","https://english.aawsat.com/arab-world/5259847-israeli-threats-shut-masnaa-crossing-partly-isolate-lebanon-syria","https://english.enabbaladi.net/archives/2026/07/al-dabousiyah-crossing-between-syria-and-lebanon-to-open-in-early-september/"]},{"id":"sy-arida","name":"Al-Arida / Arida","with_country":"LB","with_country_name":"Lebanon","type":"road","location":{"city":"Arida (Tartus)","lat":34.63,"lng":35.98},"traffic":"Coastal route Tartus–Tripoli; mainly passenger with limited freight","status":"operational","hours":"n/a","projects":"Bridge rehabilitation agreed in September 2025 Syria–Lebanon accord","notes":"Closest Lebanese crossing to Tartus port (~30 km); bridge damaged by Israeli strikes in 2024.","sources":["https://english.enabbaladi.net/archives/2026/07/al-dabousiyah-crossing-between-syria-and-lebanon-to-open-in-early-september/"]},{"id":"sy-dabousieh","name":"Al-Dabousieh / Abboudieh","with_country":"LB","with_country_name":"Lebanon","type":"road","location":{"city":"Dabousieh (Homs)","lat":34.6,"lng":36.06},"traffic":"Main overland route from Lebanon's Port of Tripoli to Homs and northern Syria","status":"under construction","hours":"n/a","projects":"Bridge rebuilt after Israeli bombardment; reopening scheduled early September 2026 using existing facilities; phase-two comprehensive expansion (~1.5 years)","notes":"Reopening intended to relieve pressure on Jdeidet Yabous; competes with Tartus for Homs-bound cargo via Tripoli.","sources":["https://english.enabbaladi.net/archives/2026/07/al-dabousiyah-crossing-between-syria-and-lebanon-to-open-in-early-september/"]}]}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
  const CODE_HASH = "ebd4f13a003af66d489812a0e6866ffe7af4e4798a34fb8cddcd6f547c07db92";
  const CATS = [
    {key:'ports', label:'Ports'},
    {key:'zones', label:'Free & industrial zones'},
    {key:'corridors', label:'Logistics corridors'},
    {key:'border_crossings', label:'Border crossings'}
  ];
  const REGION_ORDER = ['North Africa','West Africa','Central Africa','East Africa','Southern Africa','Gulf','Levant'];
  // Countries in scope but not yet researched (greyed out) — extended in later waves
  const SOON = {"North Africa":["Algeria","Tunisia","Libya","Mauritania","Sudan"],"West Africa":["Nigeria","Ghana","Côte d'Ivoire","Senegal","Togo","Benin","Guinea","Sierra Leone","Liberia","Mali","Burkina Faso","Niger","Gambia","Guinea-Bissau","Cabo Verde"],"Central Africa":["Gabon","Republic of the Congo","Chad","Central African Republic","Equatorial Guinea","São Tomé and Príncipe"],"East Africa":["Tanzania","Ethiopia","Djibouti","Somalia","Uganda","Rwanda","Burundi","South Sudan","Eritrea"],"Southern Africa":["South Africa","Mozambique","Namibia","Zambia","Zimbabwe","Botswana","Madagascar","Mauritius","Malawi","Eswatini","Lesotho","Comoros","Seychelles"],"Gulf":["Qatar","Kuwait","Bahrain","Oman","Yemen","Iran"],"Levant":["Jordan","Lebanon","Israel","Palestine","Türkiye"]};

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isNA = v => v==null || String(v).trim()==='' || /^n\/a\b/i.test(String(v).trim());
  const stClass = s => ({'operational':'operational','under construction':'construction','planned':'planned','suspended':'suspended','closed':'closed'}[s]||'planned');
  const isDPW = r => {
    if(/dp world/i.test(r.operator||'')) return true;
    const c=[r.concession,r.authority].filter(Boolean).join(' ');
    return /dp world/i.test(c) && !/\b(no|not|without|competitor|rival|suspended|earmarked|terminated|former|withdr\w*|cancel\w*)\b/i.test(c);
  };

  let state = {code: null, cat: 'ports', q: '', status: '', dpw: false};

  // ---- gate ----
  async function sha256(s){
    const b = new TextEncoder().encode(s);
    if(window.crypto && crypto.subtle){ const h = await crypto.subtle.digest('SHA-256', b); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    return sha256js(b);
  }
  // Compact SHA-256 fallback for non-secure contexts (previews); the published page uses crypto.subtle.
  function sha256js(msg){
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l=msg.length, ml=l*8, pad=((l+9+63)>>6)<<6, m=new Uint8Array(pad); m.set(msg); m[l]=0x80;
    const dv=new DataView(m.buffer); dv.setUint32(pad-4, ml>>>0); dv.setUint32(pad-8, Math.floor(ml/4294967296));
    const w=new Uint32Array(64), rotr=(x,n)=>(x>>>n)|(x<<(32-n));
    for(let i=0;i<pad;i+=64){
      for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
      for(let t=16;t<64;t++){ const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3), s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0; }
      let [a,b,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){ const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])>>>0, S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0; h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0; }
      H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
    }
    return H.map(x=>x.toString(16).padStart(8,'0')).join('');
  }
  function unlocked(){ try { return sessionStorage.getItem('hl-atlas-ok')==='1'; } catch(e){ return false; } }
  function openGate(){
    const g = $('#gate'); g.hidden = false; $('#app').setAttribute('aria-hidden','true');
    $('#gateForm').addEventListener('submit', async e => {
      e.preventDefault();
      const v = $('#code').value.trim();
      const ok = (await sha256(v)) === CODE_HASH;
      if(ok){ try{ sessionStorage.setItem('hl-atlas-ok','1'); }catch(e){} g.hidden = true; $('#app').removeAttribute('aria-hidden'); }
      else { $('#gateErr').textContent = 'Incorrect code.'; $('#code').select(); }
    });
    setTimeout(()=>$('#code').focus(), 50);
  }

  // ---- sidebar ----
  function buildSidebar(){
    const byRegion = {};
    Object.values(DATA).forEach(d => { (byRegion[d.country.region] = byRegion[d.country.region]||[]).push(d.country); });
    let html = ''; let opts = ''; let total = 0;
    REGION_ORDER.forEach(r => {
      const have = (byRegion[r]||[]).sort((a,b)=>a.name.localeCompare(b.name));
      if(!have.length) return;
      html += `<h3>${esc(r)}</h3>`;
      have.forEach(c => {
        const n = CATS.reduce((s,k)=>s+DATA[c.code][k.key].length,0); total += n;
        html += `<button class="cbtn" data-code="${c.code}"><span>${esc(c.name)}</span><span class="n">${n}</span></button>`;
        opts += `<option value="${c.code}">${esc(c.name)}</option>`;
      });
    });
    const soonAll = REGION_ORDER.flatMap(r => (SOON[r]||[]).filter(n => !(byRegion[r]||[]).some(c=>c.name===n)));
    html += `<h3>Coming in later waves · ${soonAll.length}</h3><div class="soonlist">${soonAll.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div>`;
    $('#clist').innerHTML = html;
    $('#msel').innerHTML = opts;
    $('#meta').textContent = `${Object.keys(DATA).length} countries · ${total} infrastructures · updated Sep 2026`;
    $('#clist').addEventListener('click', e => { const b = e.target.closest('.cbtn[data-code]'); if(b) selectCountry(b.dataset.code); });
    $('#msel').addEventListener('change', e => selectCountry(e.target.value));
  }

  function selectCountry(code){
    state.code = code; state.q=''; $('#q').value='';
    document.querySelectorAll('.cbtn').forEach(b => b.classList.toggle('active', b.dataset.code===code));
    $('#msel').value = code;
    renderHead(); renderList();
    try{ localStorage.setItem('hl-atlas-country', code); }catch(e){}
  }

  function renderHead(){
    const c = DATA[state.code].country;
    const ops = (c.key_operators||[]).map(o => `<span class="chip${/dp world/i.test(o)?' dpw':''}">${esc(o)}</span>`).join('');
    const tabs = CATS.map(k => `<button class="tab${state.cat===k.key?' active':''}" data-cat="${k.key}">${k.label}<span class="cnt">${DATA[state.code][k.key].length}</span></button>`).join('');
    $('#chead').innerHTML = `<div class="region">${esc(c.region)} · ${esc(c.capital||'')}${c.coastline?' · '+esc(c.coastline):''}</div>
      <h2>${esc(c.name)}</h2><p class="summary">${esc(c.summary||'')}</p><div class="ops">${ops}</div><div class="tabs">${tabs}</div>`;
    $('#chead .tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if(!t) return; state.cat = t.dataset.cat; renderHead(); renderList(); });
  }

  function subtitle(r){
    switch(state.cat){
      case 'ports': return [r.type, r.location&&r.location.city, r.operator].filter(x=>!isNA(x)).join(' · ');
      case 'zones': return [r.type, r.location&&r.location.city, r.area].filter(x=>!isNA(x)).join(' · ');
      case 'corridors': return [(r.modes||[]).join('/'), r.length, r.operator].filter(x=>!isNA(x)).join(' · ');
      case 'border_crossings': return ['with '+(r.with_country_name||r.with_country||''), r.type, r.location&&r.location.city].filter(x=>!isNA(x)).join(' · ');
    }
  }
  function blurb(r){
    switch(state.cat){
      case 'ports': return [r.throughput, r.capacity].filter(x=>!isNA(x))[0] || r.projects || r.notes || '';
      case 'zones': return (r.sectors&&r.sectors.length? r.sectors.join(', ')+'. ' : '') + (isNA(r.tenants)?'':r.tenants);
      case 'corridors': return r.route || r.projects || '';
      case 'border_crossings': return r.traffic || r.projects || r.notes || '';
    }
  }

  function renderList(){
    const rows = DATA[state.code][state.cat];
    const q = state.q.toLowerCase();
    const out = rows.filter(r => {
      if(state.status){ if(state.status==='suspended' ? !(r.status==='suspended'||r.status==='closed') : r.status!==state.status) return false; }
      if(state.dpw && !isDPW(r)) return false;
      if(q){ const hay = JSON.stringify(r).toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
    $('#count').textContent = `${out.length} of ${rows.length}`;
    if(!out.length){ $('#list').innerHTML = `<div class="empty">No ${CATS.find(k=>k.key===state.cat).label.toLowerCase()} match.</div>`; return; }
    $('#list').innerHTML = out.map(r => `
      <button class="card" data-id="${esc(r.id)}">
        <div class="row"><span class="st ${stClass(r.status)}">${esc(r.status)}</span>${isDPW(r)?'<span class="st dpw">▲ DP World</span>':''}</div>
        <div class="t">${esc(r.name)}</div>
        <div class="l">${esc(subtitle(r))}</div>
        <div class="d">${esc(blurb(r))}</div>
      </button>`).join('');
  }
  $('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if(c) openDetail(c.dataset.id); });
  $('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
  $('#fstatus').addEventListener('change', e => { state.status = e.target.value; renderList(); });
  $('#fdpw').addEventListener('change', e => { state.dpw = e.target.checked; renderList(); });

  // ---- detail ----
  const LABELS = {type:'Type',operator:'Operator',concession:'Concession',capacity:'Capacity',throughput:'Throughput',opened:'Opened',projects:'Projects',notes:'Notes',authority:'Authority / developer',area:'Area',sectors:'Sectors',incentives:'Incentives',tenants:'Tenants',modes:'Modes',route:'Route',countries:'Countries',length:'Length',capacity_or_traffic:'Capacity / traffic',with_country_name:'Neighbour',traffic:'Traffic',hours:'Hours'};
  const ORDER = {ports:['type','operator','concession','capacity','throughput','opened','projects','notes'],zones:['type','authority','area','sectors','incentives','tenants','opened','projects','notes'],corridors:['modes','route','countries','length','operator','capacity_or_traffic','projects','notes'],border_crossings:['with_country_name','type','traffic','hours','projects','notes']};
  function openDetail(id){
    const r = DATA[state.code][state.cat].find(x=>x.id===id); if(!r) return;
    const loc = r.location||{};
    const rows = ORDER[state.cat].map(k => { let v = r[k]; if(Array.isArray(v)) v = v.join(', '); const na = isNA(v); return `<dt>${LABELS[k]||k}</dt><dd class="${na?'na':''}">${na?'n/a':esc(v)}</dd>`; }).join('');
    const map = (typeof loc.lat==='number') ? `<a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}">Open in Google Maps (${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)})</a>` : '';
    const src = (r.sources||[]).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,''))}</a>`).join('');
    const el = document.createElement('div'); el.id='dwrap';
    el.innerHTML = `<div class="scrim" data-close></div>
      <aside class="detail" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
        <div class="dhead"><div>
          <div class="row"><span class="st ${stClass(r.status)}">${esc(r.status)}</span>${isDPW(r)?'<span class="st dpw">▲ DP World</span>':''}<span class="type">${esc(CATS.find(k=>k.key===state.cat).label)} · ${esc(DATA[state.code].country.name)}</span></div>
          <h3>${esc(r.name)}</h3>
          <div class="l" style="color:var(--ink-3);font-size:13px">${esc([loc.city].filter(x=>!isNA(x)).join(''))}</div>${map}
        </div><button class="close" data-close aria-label="Close">×</button></div>
        <div class="dbody"><dl class="kv">${rows}</dl><h4>Sources</h4><div class="src">${src||'<span style="color:var(--ink-3)">none recorded</span>'}</div></div>
      </aside>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeDetail(); });
    document.addEventListener('keydown', escClose);
    el.querySelector('.close').focus();
  }
  function escClose(e){ if(e.key==='Escape') closeDetail(); }
  function closeDetail(){ const el = document.getElementById('dwrap'); if(el) el.remove(); document.removeEventListener('keydown', escClose); }

  // ---- boot ----
  buildSidebar();
  let first = Object.keys(DATA).sort()[0];
  try{ const s = localStorage.getItem('hl-atlas-country'); if(s && DATA[s]) first = s; }catch(e){}
  selectCountry(first);
  if(CODE_HASH && !unlocked()) openGate();
})();
</script>
</body></html>
