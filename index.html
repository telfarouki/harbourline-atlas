estion du Fret Multimodal) with Yellowstone Consortium (South Africa)","area":"c. 60 ha","sectors":["logistics","customs/transit","trucking"],"incentives":"n/a","tenants":"n/a","status":"planned","opened":"n/a","projects":"USD 600m, 23-year build-operate-transfer concession signed 1 December 2025; construction to start January 2027; capacity 1,250+ trucks and up to 11m tonnes/yr; c. 800 permanent jobs","notes":"Aims to decongest the Kasumbalesa border, the DRC's busiest trade gateway.","sources":["https://www.xtrafrica.com/news/drc-600-million-kasumbalesa-dry-port-cross-border-trade"]}],"corridors":[{"id":"cd-lobito-corridor","name":"Lobito Corridor – DRC leg (Dilolo–Kolwezi–Lubumbashi–Sakania railway)","modes":["rail","road","multimodal"],"route":"Lobito (Angola) → Luau/Dilolo border → Kolwezi → Tenke → Likasi → Lubumbashi → Sakania (Zambia border)","countries":["AO","CD","ZM"],"length":"c. 1,037 km in the DRC (Dilolo–Sakania); c. 1,300 km Angolan section operated by Lobito Atlantic Railway","operator":"SNCC (current); Mota-Engil Africa 30-year concession (signed 26 Aug 2026); Lobito Atlantic Railway (Mota-Engil, Trafigura, Vecturis) in Angola","status":"operational","capacity_or_traffic":"Dilolo–Kolwezi section operating at 10–15 km/h and <5% of capacity (IPIS); Kamoa-Kakula copper shipments started 2023, up to 240,000 t/yr from 2025; target 13.7m t/yr after modernisation; first-year forecast 1m t exports / 0.5m t imports","projects":"USD 1.8bn Mota-Engil PPP (cabinet approval July 2026, concession signed Aug 2026), most works in first 7 years; financing lines: US DFC up to USD 1bn (LoI Dec 2025), EIB EUR 500m, World Bank USD 500m for Dilolo–Kolwezi; AFC USD 150m Kolwezi–Kamoa-Kakula extension; DRC export quotas of 50% copper, 30% cobalt, 90% zinc via Lobito over five years","notes":"Transit to Lobito 5–8 days vs c. 25 days to Durban. Strategic US/EU Global Gateway project. Trafigura is a partner in the Angolan concession.","sources":["https://logistafrica.com/en/logistic/drc-mota-engil-secures-a-30-year-concession-to-modernize-the-lobito-corridor-railway/","https://www.ecofinagency.com/news-infrastructures/1112-51308-mota-engil-poised-for-drc-rail-concession-as-us-and-kinshasa-cement-lobito-strategy","https://ipisresearch.be/weekly-briefing/infrastructure-extraction-and-accountability-around-the-lobito-corridor-in-southern-drc/","https://www.railwaysafrica.com/news/drc-cabinet-approves-mota-engil-ppp-for-dilolo-kolwezi-lubumbashi-sakania-railway-line"]},{"id":"cd-matadi-kinshasa","name":"Matadi – Kinshasa road and rail corridor","modes":["rail","road","inland waterway"],"route":"Banana/Boma → Matadi → Mbanza-Ngungu → Kinshasa (Gare de l'Est / river port)","countries":["CD"],"length":"366 km rail (CFMK); c. 350 km N1 road","operator":"SCTP (railway and public ports); road: Office des Routes","status":"operational","capacity_or_traffic":"Rail: only 2 trains, c. 250 wagons and 4 locomotives in service, several departures per week (Logistics Cluster); most container traffic moves by truck","projects":"ARMP integrated concession of Boma/Matadi/Kinshasa ports plus the railway; MGT-funded 2.65 km port access road at Matadi (2024–25); DP World's Banana port (2027) will add a deep-water origin to the corridor","notes":"Sole domestic link from the sea to the capital. Track rehabilitated but rolling stock degraded.","sources":["https://lca.logcluster.org/democratic-republic-congo-24-democratic-republic-congo-railway-assessment","https://www.armp-rdc.org/index.php/fr/19-ami-prestations-intellectuelles/1876-mise-en-concession-integree-des-ports-de-boma-de-matadi-de-kinshasa-et-du-chemin-de-fer-matadi-kinshasa","https://www.ictsi.com/press-releases/matadi-gateway-terminal-enhances-infrastructure-capacity"]},{"id":"cd-north-south-corridor","name":"North-South Corridor (Durban / Beira – Zambia – Kasumbalesa – Lubumbashi/Kolwezi)","modes":["road","rail","multimodal"],"route":"Durban or Beira → Zimbabwe/Mozambique → Lusaka → Ndola/Kitwe → Kasumbalesa (or Sakania/Mokambo) → Lubumbashi → Likasi → Kolwezi","countries":["ZA","MZ","ZW","ZM","CD"],"length":"c. 2,500 km Durban–Lubumbashi by road","operator":"Road hauliers; SADC/COMESA corridor coordination","status":"operational","capacity_or_traffic":"Main outlet for DRC copper/cobalt and inbound fuel, sulphur and consumer goods; Kasumbalesa vehicle trade c. USD 10m/day (ECDPM, 2026); truck queues of 25 km and up to c. 5 days (2025–26)","projects":"SADC inter-ministerial task force on Kasumbalesa (Feb/Apr 2025); Zambia diversion of traffic to Sakania and Mokambo (SI 36 of 2022); USD 600m Kasumbalesa dry port (2027 start)","notes":"Transit to Durban c. 25 days vs 5–8 days to Lobito; chronic congestion drives interest in Lobito, Walvis Bay and Dar es Salaam alternatives.","sources":["https://www.sadc.int/latest-news/sadc-member-states-meet-harare-find-lasting-solution-persistent-problems-kasumbalesa","https://ecdpm.org/work/notes-kasumbalesa-where-25km-trucks-meet-bikes-lobito-corridor","https://www.zra.org.zm/government-formalises-sakania-border-for-export-and-transit-exit/"]},{"id":"cd-walvis-bay-ndola-lubumbashi","name":"Walvis Bay – Ndola – Lubumbashi Development Road (ex Trans-Caprivi)","modes":["road"],"route":"Walvis Bay → Katima Mulilo (Namibia/Zambia bridge) → Lusaka → Ndola → Kasumbalesa → Lubumbashi","countries":["NA","ZM","CD"],"length":"c. 2,700 km","operator":"Walvis Bay Corridor Group (WBCG)","status":"operational","capacity_or_traffic":"Growing copper volumes via Walvis Bay; DRC produces nearly 3m t copper/yr (2025)","projects":"New 'North-Western' route Kolwezi → Solwezi → Mongu → Katima Mulilo → Walvis Bay, c. 235 km shorter with a new DRC–Zambia border crossing; concession signed and construction under way (2025)","notes":"Atlantic alternative to Durban for Katanga exports; competes with Lobito.","sources":["https://en.wikipedia.org/wiki/Walvis_Bay-Ndola-Lubumbashi_Development_Road","https://www.observer24.com.na/new-corridor-cuts-time-for-drc-copper/"]},{"id":"cd-central-corridor","name":"Central Corridor (Dar es Salaam – Kigoma – Lake Tanganyika – Kalemie/Uvira)","modes":["rail","road","inland waterway","multimodal"],"route":"Dar es Salaam → Dodoma → Tabora → Kigoma (rail/road) → Lake Tanganyika → Kalemie / Uvira (DRC) → Lubumbashi by SNCC rail or road","countries":["TZ","CD","BI"],"length":"c. 1,400 km Dar es Salaam–Kigoma plus lake crossing","operator":"Central Corridor Transit Transport Facilitation Agency (CCTTFA); Tanzania Ports Authority (Kigoma); SNCC (Kalemie); private lake shipping (e.g. Zijin vessels, 2026)","status":"operational","capacity_or_traffic":"n/a (lake-borne; growing mineral flows incl. Zijin's four ships serving DRC mines inaugurated 2026)","projects":"Tanzania–DRC infrastructure programme (2022–): Kigoma port upgrade and 5,000 t slipway, new lake vessels, 60 ha dry-port land in each country, USD 70m Kalemie industrial port (2026), Tanzania SGR to Kigoma; Kalemie–Nyunzu–Manono road (468 km)","notes":"Shortest sea route for eastern DRC and Manono lithium; TPA has a country office in Lubumbashi.","sources":["https://centralcorridor-ttfa.org/tanzania-and-drc-strengthen-bilateral-ties-with-transport-infrastructure-development-program/","https://thechanzo.com/2026/07/21/zijin-mining-inaugurates-four-ships-serving-dr-congo-mines-as-china-reinforces-eastern-southern-africa-critical-mineral-supply-route-through-tanzania/","https://www.ttcanc.org/northern-corridor-transport-network"]},{"id":"cd-northern-corridor","name":"Northern Corridor (Mombasa – Kampala – Kasindi/Beni – Goma)","modes":["road","rail","multimodal"],"route":"Mombasa → Nairobi → Kampala → Mbarara → Kasese → Mpondwe/Kasindi → Beni → Butembo (branch: Kabale → Bunagana/Goma; Kigali → Gisenyi/Goma)","countries":["KE","UG","RW","CD"],"length":"c. 1,700 km Mombasa–Kasindi","operator":"Northern Corridor Transit and Transport Coordination Authority (NCTTCA); road hauliers","status":"operational","capacity_or_traffic":"Main import route for North Kivu and Ituri consumer goods and fuel; volumes disrupted by M23 conflict (2025–26)","projects":"Uganda-funded 223 km Kasindi–Beni–Butembo road (DOTT Services): Kasindi–Beni 80 km at 61% (March 2026), Beni–Butembo 54 km at 5%; Mpondwe/Kasindi bridge substantially complete","notes":"Security (ADF, M23) and border closures are the key risks; Uganda reopened Bunagana in July 2025 into M23-held territory.","sources":["https://www.newvision.co.ug/category/news/kasindi-beni-cross-border-road-project-at-61-NV_229203_082026","https://www.ttcanc.org/northern-corridor-transport-network","https://www.africanews.com/2025/07/12/uganda-reopens-border-with-m23-held-eastern-drc/"]},{"id":"cd-congo-river","name":"Congo River inland waterway (Kinshasa – Mbandaka – Kisangani; Kasai to Ilebo)","modes":["inland waterway"],"route":"Kinshasa → Mbandaka → Bumba → Kisangani (c. 1,700 km); Kwa/Kasai branch Kinshasa → Ilebo","countries":["CD","CG","CF"],"length":"c. 1,700 km Kinshasa–Kisangani","operator":"SCTP (state); many private barge operators; CICOS regulates the shared basin","status":"operational","capacity_or_traffic":"n/a (seasonal drafts 2.5–6 m at Kisangani)","projects":"Kinshasa–Brazzaville road-rail bridge PPP (1,575–1,757 m, c. USD 700m phase 1, call for concession proposals launched May 2026); Port of Kinshasa modernisation with Port of Brussels","notes":"Backbone of domestic logistics for the north and centre; poor navigation aids, dredging deficit.","sources":["https://lca.logcluster.org/democratic-republic-congo-218-democratic-republic-congo-port-kisangani","https://fr.wikipedia.org/wiki/Port_de_Kinshasa","https://www.ecofinagency.com/news-infrastructures/0106-56046-congo-river-bridge-project-advances-as-kinshasa-and-brazzaville-launch-concession-search"]}],"border_crossings":[{"id":"cd-kasumbalesa","name":"Kasumbalesa","with_country":"ZM","with_country_name":"Zambia","type":"road","location":{"city":"Kasumbalesa, Haut-Katanga","lat":-12.25,"lng":27.8},"traffic":"Busiest DRC land border: vehicle-based trade c. USD 10m/day plus c. USD 2.5m/day pedestrian/bicycle trade (ECDPM, Feb 2026); queues up to 25 km and c. 5 days","status":"operational","hours":"Extended opening hours introduced 2025 (Zambian side listed 24h)","projects":"USD 600m, 60 ha dry port (Yellowstone/OGEFREM, BOT concession Dec 2025, works from Jan 2027); SADC task-force action matrix (2025); electronic seal clearance system rolled out 2025","notes":"Recurrent congestion and closures; traffic diverted to Sakania and Mokambo. Gateway for copper/cobalt exports and fuel/sulphur imports.","sources":["https://ecdpm.org/work/notes-kasumbalesa-where-25km-trucks-meet-bikes-lobito-corridor","https://www.sadc.int/latest-news/sadc-member-states-meet-harare-find-lasting-solution-persistent-problems-kasumbalesa","https://www.xtrafrica.com/news/drc-600-million-kasumbalesa-dry-port-cross-border-trade","https://tracks4africa.co.za/listings/item/w149026/kasumbalesa-border-post-zamdrc-06h00-18h00/"]},{"id":"cd-sakania","name":"Sakania","with_country":"ZM","with_country_name":"Zambia","type":"road+rail","location":{"city":"Sakania, Haut-Katanga","lat":-12.75,"lng":28.55},"traffic":"Overflow route for northbound trucks (c. 130 km SE of Kasumbalesa); rail crossing point of the SNCC–Zambia Railways network","status":"operational","hours":"n/a","projects":"Zambia formalised Sakania as an export/transit exit (SI 36 of 2022) and is upgrading access roads; terminus of the Mota-Engil Dilolo–Sakania rail concession (2026)","notes":"Hauliers report USD 150 fees (2022) and poor roads; rail link mostly dormant pending Lobito corridor rehabilitation.","sources":["https://www.zra.org.zm/government-formalises-sakania-border-for-export-and-transit-exit/","https://www.freightnews.co.za/article/drc-zambia-cross-border-freight-is-a-costly-business","https://lca.logcluster.org/2320-zambia-border-crossing-sakanya"]},{"id":"cd-mokambo","name":"Mokambo","with_country":"ZM","with_country_name":"Zambia","type":"road","location":{"city":"Mokambo, Haut-Katanga","lat":-12.4,"lng":28.35},"traffic":"Alternative southbound crossing used to relieve Kasumbalesa","status":"operational","hours":"n/a","projects":"Included in Zambia's three-crossing decongestion plan (2022)","notes":"Hauliers cite USD 100 crossing fees and poor road access (2022).","sources":["https://www.freightnews.co.za/article/drc-zambia-cross-border-freight-is-a-costly-business","https://www.zra.org.zm/government-formalises-sakania-border-for-export-and-transit-exit/"]},{"id":"cd-dilolo","name":"Dilolo / Luau","with_country":"AO","with_country_name":"Angola","type":"road+rail","location":{"city":"Dilolo, Lualaba","lat":-10.68,"lng":22.35},"traffic":"Rail gateway of the Lobito corridor; Kamoa-Kakula copper trains since 2023 (up to 240,000 t/yr from 2025)","status":"operational","hours":"n/a","projects":"Mota-Engil 30-year, USD 1.8bn Dilolo–Sakania rail concession (Aug 2026); World Bank USD 500m Dilolo–Kolwezi rehabilitation request (Oct 2025)","notes":"Rail line on the DRC side degraded (10–15 km/h). Volumes expected to scale with export quotas directing 50% of copper via Lobito.","sources":["https://ipisresearch.be/weekly-briefing/infrastructure-extraction-and-accountability-around-the-lobito-corridor-in-southern-drc/","https://logistafrica.com/en/logistic/drc-mota-engil-secures-a-30-year-concession-to-modernize-the-lobito-corridor-railway/"]},{"id":"cd-kasindi","name":"Kasindi / Mpondwe","with_country":"UG","with_country_name":"Uganda","type":"road","location":{"city":"Kasindi, North Kivu","lat":0.05,"lng":29.72},"traffic":"Main formal trade gateway between Uganda and eastern DRC (Beni–Butembo market)","status":"operational","hours":"n/a","projects":"Uganda-funded Mpondwe/Kasindi bridge (substantially complete, 2026) and 80 km Kasindi–Beni road (61% complete, March 2026) by DOTT Services","notes":"ADF insecurity, weather and land-acquisition delays; part of Uganda's 223 km cross-border road programme launched June 2021.","sources":["https://www.newvision.co.ug/category/news/kasindi-beni-cross-border-road-project-at-61-NV_229203_082026","https://www.monitor.co.ug/uganda/news/national/mpondwe-beni-roadworks-security-boosting-business-4458264"]},{"id":"cd-goma-grande-barriere","name":"Goma – Gisenyi (Grande Barrière)","with_country":"RW","with_country_name":"Rwanda","type":"road","location":{"city":"Goma, North Kivu","lat":-1.68,"lng":29.24},"traffic":"Busiest Rwanda–DRC crossing (trade and humanitarian traffic into Goma)","status":"operational","hours":"06:00–24:00 (as reopened 19 September 2025)","projects":"n/a","notes":"Goma under M23/AFC control since January 2025; crossing reopened by the M23-aligned administration on 19 Sep 2025. Formal customs revenue to Kinshasa suspended; high political and sanctions risk.","sources":["https://nilepost.co.ug/index.php/news/288280/m23-reopens-goma-rwanda-border-post","https://www.aljazeera.com/features/2026/1/29/banks-shut-futures-uncertain-one-year-after-m23-rebels-seized-drcs-goma"]},{"id":"cd-bunagana","name":"Bunagana","with_country":"UG","with_country_name":"Uganda","type":"road","location":{"city":"Bunagana, North Kivu","lat":-1.29,"lng":29.6},"traffic":"Secondary Uganda–DRC crossing (Kisoro–Rutshuru–Goma); trade stalled despite reopening (Feb 2026 reports)","status":"operational","hours":"n/a","projects":"n/a","notes":"Held by M23 since 2022; Uganda reopened Bunagana and Ishasha in July 2025 after six months' closure following the Washington peace agreement. Customs collected by M23 administration, not Kinshasa.","sources":["https://www.africanews.com/2025/07/12/uganda-reopens-border-with-m23-held-eastern-drc/","https://www.monitor.co.ug/uganda/news/national/uganda-drc-border-trade-remains-stalled-despite-bunagana-reopening-5142662"]},{"id":"cd-kavimvira","name":"Kavimvira (Uvira) – Gatumba","with_country":"BI","with_country_name":"Burundi","type":"road","location":{"city":"Uvira, South Kivu","lat":-3.32,"lng":29.24},"traffic":"Main DRC–Burundi crossing; links Uvira to Bujumbura port on Lake Tanganyika","status":"operational","hours":"n/a","projects":"n/a","notes":"Closed c. two months after the AFC/M23 takeover of Uvira; reopened 23 February 2026. Informal cross-border trade dominates.","sources":["https://www.africanews.com/2026/02/23/trade-and-hope-return-to-uvira-after-drc-burundi-border-reopens/","https://www.france24.com/en/africa/20260223-dr-congo-border-crossing-with-burundi-reopens-after-afc-m23-offensive"]},{"id":"cd-beach-ngobila","name":"Beach Ngobila (Kinshasa – Brazzaville ferry)","with_country":"CG","with_country_name":"Republic of the Congo","type":"ferry","location":{"city":"Kinshasa","lat":-4.3,"lng":15.3},"traffic":"Passenger and small-cargo ferries between the two capitals across the Congo River (Pool Malebo)","status":"operational","hours":"n/a","projects":"Kinshasa–Brazzaville road-rail bridge (1,575–1,757 m, c. USD 700m phase 1, Maluku–Maloukou Tréchot) with AfDB and Africa50; concession call for proposals launched May 2026, c. 5-year build; planned capacity 5m passengers and c. 3m t cargo/yr","notes":"Only fixed-link alternative is the future bridge; ferry crossing is slow and informal-trade heavy.","sources":["https://fr.wikipedia.org/wiki/Port_de_Kinshasa","https://www.ecofinagency.com/news-infrastructures/0106-56046-congo-river-bridge-project-advances-as-kinshasa-and-brazzaville-launch-concession-search","https://en.wikipedia.org/wiki/Brazzaville%E2%80%93Kinshasa_Bridge"]}]},"CM":{"country":{"code":"CM","name":"Cameroon","region":"Central Africa","capital":"Yaoundé","coastline":"Atlantic (Gulf of Guinea / Bight of Biafra)","summary":"Cameroon is the maritime gateway of the CEMAC hinterland: roughly 80% of Central Africa's transit traffic moves on the two rail/road corridors from Douala to N'Djamena (Chad) and Bangui (CAR), and about 79% of Chad's imports enter through Douala. National port traffic was 26.9m tonnes in 2024, split mainly between the historic river port of Douala (12.9m t, container terminal run by the state-owned RTC since Bolloré/APM Terminals' DIT concession ended in 2020) and the Chinese-built deep-sea port of Kribi (12.7m t, 16 m draft), whose second container terminal opened in May 2025 and lifted capacity to about 1m TEU under an AGL/CMA CGM/CHEC concession. Headline projects are the 4,000 ha Kribi Port Industrial Zone (EUR 795m, AGL/Arise IIP/Belmont, launched Feb 2026), the World Bank-financed Cameroon–Chad corridor programme (Douala–Yaoundé rail rehabilitation, Ngaoundéré intermodal platform), phase 2 of the Yaoundé–Douala motorway, the Kribi–Lolabé motorway and a still-unfunded Limbe deep-sea port for which MSC's TIL opened talks in July 2026. DP World has no asset in Cameroon; the market is dominated by AGL (MSC), CMA CGM, CHEC and ICTSI, with state-run RTC at Douala.","key_operators":["Port Autonome de Douala (PAD) / RTC","Port Autonome de Kribi (PAK)","Africa Global Logistics (AGL, MSC group)","CMA CGM","China Harbour Engineering Company (CHEC)","ICTSI","Camrail (AGL)","Terminal Investment Limited (TIL, MSC) – prospective"],"sources":["https://www.investiraucameroun.com/gestion-publique/1311-22739-port-de-douala-12-9-millions-de-tonnes-traitees-en-2024-malgre-un-leger-recul-du-trafic-national","https://documents1.worldbank.org/curated/en/493301633812350826/txt/Concept-Project-Information-Document-Integrated-Safeguards-Data-Sheet-Cameroon-Chad-Transport-Corridor-P167798.txt","https://www.ecofinagency.com/news-infrastructures/1305-46793-cameroon-s-kribi-port-triples-capacity-with-launch-of-second-container-terminal","https://www.agenceecofin.com/actualites/2702-136202-cameroun-lancement-officiel-de-la-zone-industrielle-du-port-de-kribi","https://www.businessincameroon.com/public-management/1807-16484-cameroon-swiss-terminal-operator-explore-options-for-limbe-deep-seaport"]},"ports":[{"id":"cm-douala","name":"Port of Douala-Bonabéri","type":"multipurpose","location":{"city":"Douala","lat":4.05,"lng":9.69},"operator":"Port Autonome de Douala (PAD, state landlord); container terminal: Régie du Terminal à Conteneurs (RTC, PAD-owned, since 1 Jan 2020); timber yard: Bolloré/AGL group; security: Douala Port Security (DPS/PortSec SA)","concession":"Container terminal was concessioned in 2005 for 15 years to Douala International Terminal (DIT, Bolloré + APM Terminals), which invested CFA 43.4bn; the state refused renewal and evicted DIT in Dec 2020, handing operations to the in-house RTC. DIT won ICC arbitration and a Paris Court of Appeal ruling (Jan 2023) against PAD over the eviction.","capacity":"River port on the Wouri estuary; ~8 m alongside depth, max ~200 m LOA (tidal/dredging constrained); container terminal 660 m of quay, 3 berths; RTC targets 1m TEU/year capacity by 2026 after extension","throughput":"12.92m tonnes (2024, +6% vs 12.19m t in 2023); container TEU figure n/a (RTC handled ~3,000 boxes/week in 2024); transit traffic passed 500,000 t in Q1 2026","status":"operational","opened":"n/a (colonial-era port; PAD created 1999)","projects":"RTC container-terminal extension awarded Dec 2022 to Negri (CFA 47.2bn): +250 m quay, 7.9 ha backfill, 1,200 m roadways, target ≥1,000 m linear quay; 8 RTG cranes (CFA 12bn) delivered from Nov 2023; RTC invested >CFA 44bn 2020-23; Navis N4 TOS. World Bank Cameroon-Chad corridor project (approved Feb 2022) rehabilitates the Douala–Yaoundé rail link and Bessengue rail platform serving the port.","notes":"Cameroon's main gateway and the historic entry point for Chad and CAR transit; industrial land in the port is reported at 100% occupancy. Draft limits container-ship size, so Kribi increasingly relays boxes to Douala by feeder (about 30% of Kribi's transshipment flows to/from Douala). Competitor context: former Bolloré/APMT concession renationalised; no DP World presence.","sources":["https://www.businessincameroon.com/public-management/1607-14018-douala-ports-rtc-aims-for-one-million-container-handling-capacity-by-2026","https://www.investiraucameroun.com/gestion-publique/1311-22739-port-de-douala-12-9-millions-de-tonnes-traitees-en-2024-malgre-un-leger-recul-du-trafic-national","https://rtcdouala.cm/a-propos-du-terminal-a-conteneurs/","https://www.theafricareport.com/187112/cameroon-an-air-of-renationalisation-hangs-over-the-douala-port/","https://jusmundi.com/en/document/decision/en-douala-international-terminal-dit-v-port-autonome-de-douala-judgment-of-the-paris-court-of-appeal-tuesday-10th-january-2023","https://www.pad.cm/performance/performances-commerciales-operationnelles-et-economiques/","https://www.marineinsight.com/know-more/10-major-ports-and-terminals-in-cameroon/"]},{"id":"cm-kribi","name":"Kribi Deep-Sea Port (Port Autonome de Kribi)","type":"container","location":{"city":"Kribi (Mboro/Lolabé)","lat":2.719,"lng":9.864},"operator":"Port Autonome de Kribi (PAK, landlord); Kribi Conteneurs Terminal (KCT: Africa Global Logistics/ex-Bolloré lead, CMA CGM, CHEC, Cameroonian investors incl. Belmont/Colin Mukete); Kribi Multipurpose Terminal (KMT: ICTSI-led consortium)","concession":"KCT container concession (Bolloré/CMA CGM/CHEC) operating since March 2018, phase-2 amendment signed 26 Sep 2022; KMT multipurpose concession (ICTSI) in commercial operation since Oct 2020; terms n/a","capacity":"Draft 16 m; terminal 1: 350 m quay, ~300,000 TEU/yr; terminal 2 (opened 9 May 2025): 715 m quay, 30-33 ha yard, 5 STS cranes (65 t), 15 yard cranes — total container capacity ~1m TEU/yr (PAK cites 1.2m TEU); breakwater extended by 675 m; can receive 400 m 'megamax' ships (MSC Turkiye, May 2025)","throughput":"12.7m tonnes (2024, vs 10.7m t in 2023); KCT ~750,000 TEU in first 12 months after terminal 2 opening (May 2025-May 2026, +82%), ~74,000 TEU in March 2025, ~70% transshipment; PAK revenue CFA 35.3bn (2024, +24%), net profit CFA 4bn (2025)","status":"operational","opened":"2018 (commercial container operations, March 2018; first ships 2014)","projects":"Phase 2 (CFA 400bn, 75% China Eximbank, built by CHEC) delivered 2025; KCT invested CFA 70bn in terminal-2 equipment (2024); KCT preparing an 8 ha yard extension to reach 1.2m TEU/yr and discussing phase 3 (quay extension); PAK plans a mineral (iron ore/bauxite) terminal from 2027 and a hydrocarbons/LNG terminal from 2028; 26,000 ha master plan to 2040 (CFA 6,500bn); standard-gauge railway from Mbalam/Nabeba iron ore mines under construction (2025)","notes":"Only deep-water port in the CEMAC zone; positioned by MSC/AGL as the Gulf of Guinea transshipment hub on the Asia–West Africa 'Africa Express' loop (80% of flows via Singapore). Competitor concession: AGL (MSC) + CMA CGM + CHEC at KCT, ICTSI at KMT. Adjacent Kome-Kribi 1 FSO is the marine outlet of the Chad–Cameroon oil pipeline (since 2003). No DP World presence.","sources":["https://www.ecofinagency.com/news-infrastructures/1305-46793-cameroon-s-kribi-port-triples-capacity-with-launch-of-second-container-terminal","https://www.investiraucameroun.com/gestion-publique/3006-22189-port-de-kribi-la-hausse-du-trafic-a-12-7-millions-de-tonnes-en-2024-genere-un-chiffre-d-affaires-de-35-3-milliards-24","https://fr.allafrica.com/stories/202605150402.html","https://www.investiraucameroun.com/travaux-publics/2410-21344-port-de-kribi-70-milliards-de-fcfa-d-investissements-pour-exploiter-le-2e-terminal-a-conteneurs","https://portsetcorridors.com/2022/la-phase-2-du-terminal-de-kribi-signe-entre-bollore-ports-et-le-port-autonome-de-kribi/","https://www.ictsi.com/our-offering/our-terminals/kribi-multipurpose-terminal","https://pak.cm/en/service/port-industrial-zone/","https://china.aiddata.org/projects/53396/","https://en.wikipedia.org/wiki/Kribi_Deepwater_Port","https://leconomie.info/article/le-benefice-net-du-port-de-kribi-progresse-de-16-a-4-milliards-de-fcfa-en-2025"]},{"id":"cm-limbe","name":"Port of Limbe (existing port and Limbe Deep Seaport project)","type":"oil & gas","location":{"city":"Limbe","lat":4.015,"lng":9.207},"operator":"Port Autonome de Limbe / Limbe Port Authority (state); existing traffic dominated by SONARA refinery hydrocarbons (Limboh terminal) and an oil-services yard","concession":"n/a — government held a first working session with Terminal Investment Limited (TIL, MSC group) on 15 July 2026 to explore a PPP to develop, modernise and operate the future deep seaport; a July 2025 MoU with Turkish contractor Yenigün was announced then postponed","capacity":"Existing: ~750 m of berthing, 5 warehouses, petroleum products/timber/cement; deep-seaport project budgeted at ~CFA 400bn (~USD 667m) in government programming documents","throughput":"Limbe traffic fell 957,162 t (-23%) in 2024 (national port statistics); absolute figure n/a","status":"operational","opened":"n/a","projects":"Limbe Deep Seaport: feasibility studies 2009 (updated since), dedicated port authority created, project delayed for over a decade; TIL/MSC exploratory talks July 2026; Idenau and Tiko incorporated in the Limbe port authority's remit; MAGZI plans a 1,000 ha industrial zone at Limbe by 2035","notes":"South-West region port 15 nautical miles from Douala, oriented to Nigeria trade and oil services; existing traffic is largely SONARA-related and has been hit by the refinery's 2019 fire and Anglophone-region insecurity. Prospective competitor concession: TIL (MSC). Opportunity: no terminal operator selected yet.","sources":["https://www.businessincameroon.com/public-management/1807-16484-cameroon-swiss-terminal-operator-explore-options-for-limbe-deep-seaport","https://www.capmad.com/post/limbe-cameroon-turns-to-swiss-group-til-to-frame-its-future-deep-seaport","https://www.investiraucameroun.com/gestion-publique/1311-22739-port-de-douala-12-9-millions-de-tonnes-traitees-en-2024-malgre-un-leger-recul-du-trafic-national","https://thesunnewspaper.cm/idenau-tiko-now-officially-part-of-limbe-deep-seaport/","https://www.marineinsight.com/know-more/10-major-ports-and-terminals-in-cameroon/"]},{"id":"cm-tiko"," iards-de-f","https://www.marineinsight.com/know-more/10-major-ports-and-terminals-in-cameroon/"]},{"id":"cm-kome-kribi-oil-terminal","name":"Kome-Kribi 1 marine terminal (Chad–Cameroon pipeline FSO)","type":"oil & gas","location":{"city":"Offshore Kribi","lat":2.95,"lng":9.75},"operator":"COTCO (Cameroon Oil Transportation Company) – Chad–Cameroon pipeline consortium","concession":"n/a","capacity":"Offshore FSO loading tankers above 300,000 DWT","throughput":"n/a","status":"operational","opened":"2003","projects":"n/a","notes":"Export outlet of the 1,070 km Chad–Cameroon pipeline (Doba fields); other oil terminals: Limboh (SONARA, Limbe), Kole, Ebome (Perenco), Moudi.","sources":["https://en.wikipedia.org/wiki/Kribi_Deepwater_Port","https://www.marineinsight.com/know-more/10-major-ports-and-terminals-in-cameroon/"]}],"zones":[{"id":"cm-kribi-port-industrial-zone","name":"Kribi Port Industrial Zone (KPIZ)","type":"special economic zone","location":{"city":"Kribi","lat":2.75,"lng":9.87},"authority":"Port Autonome de Kribi (PAK) with consortium Africa Global Logistics (MSC), Arise Integrated Industrial Platforms and Belmont Investments (Colin Mukete); financiers AfDB, EU Global Gateway, IFC","area":"4,000 ha (MAGZI separately projects 5,000 ha of industrial land at Kribi by 2035)","sectors":["agro-industry","textiles","metallurgy","timber processing","construction materials","fisheries","consumer goods","logistics"],"incentives":"Cameroon economic-zone / industrial free-zone regime (details n/a); phased sectoral clusters (heavy/medium industry, food processing, R&D)","tenants":"~CFA 400bn already invested 2018-2025 by industrial operators in cocoa processing, cement, flour milling and logistics","status":"under construction","opened":"2026 (official launch 26 Feb 2026; originally planned July 2025)","projects":"Total EUR 795m (~CFA 521bn); first phase EUR 400m; Tanger Med Special Agency withdrew from the consortium before launch","notes":"Flagship port-linked SEZ of Central Africa; developer consortium led by MSC's AGL and Arise IIP (Gabon GSEZ model) — a direct competitor platform to DP World's economic-zone offering.","sources":["https://www.agenceecofin.com/actualites/2702-136202-cameroun-lancement-officiel-de-la-zone-industrielle-du-port-de-kribi","https://www.investiraucameroun.com/gestion-publique/2002-23123-port-de-kribi-agl-arise-iip-et-belmont-s-allient-au-pak-pour-une-zone-industrielle-de-521-milliards-fcfa-sur-15-000-ha","https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035"]},{"id":"cm-kribi-port-logistics-zone","name":"Kribi port logistics and industrial zone (PAK port domain)","type":"port-linked zone","location":{"city":"Kribi (Mboro)","lat":2.73,"lng":9.88},"authority":"Port Autonome de Kribi (PAK)","area":"1,200 ha under phased development to 2027; +30 ha storage yard added in phase II","sectors":["logistics","container/multipurpose terminals","aluminium & bauxite","hydrocarbons & LNG"],"incentives":"n/a","tenants":"KCT (AGL/CMA CGM/CHEC), KMT (ICTSI) one-stop service centre, logistics operators","status":"operational","opened":"2018","projects":"Specialised aluminium, bauxite, hydrocarbon and LNG terminals planned; mineral terminal construction from 2027, hydrocarbons terminal 2028","notes":"Inside the 26,000 ha Kribi port complex master plan; feeds the wider KPIZ.","sources":["https://pak.cm/en/service/port-industrial-zone/","https://www.ecofinagency.com/news-infrastructures/1305-46793-cameroon-s-kribi-port-triples-capacity-with-launch-of-second-container-terminal"]},{"id":"cm-douala-bassa-industrial-zone","name":"Douala-Bassa Industrial Zone (MAGZI)","type":"industrial zone","location":{"city":"Douala","lat":4.03,"lng":9.75},"authority":"MAGZI (Mission d'Aménagement et de Gestion des Zones Industrielles, state)","area":"192 ha","sectors":["milling","brewing","soap/consumer goods","metallurgy","packaging","petroleum products","agri-business"],"incentives":"Serviced industrial land leased by MAGZI; general Cameroon investment-incentive law (2013) applies","tenants":"89 industrial units (about 25% of Douala's industrial output); Douala's two MAGZI zones host ~160 firms","status":"operational","opened":"n/a (1970s MAGZI zone)","projects":"MAGZI plans 300 ha at Yassa (Douala east) and 500 ha at Dibombari by 2035","notes":"Saturated legacy zone next to the port and Camrail's Bassa workshops; land disputes and expulsions of non-compliant tenants reported. MAGZI's 11 zones total 1,293 ha with 405 firms nationally.","sources":["https://fr.wikipedia.org/wiki/Zone_industrielle_de_Douala-Bassa","https://magzicameroun.com/produit/zone-industrielle-douala-bassa/","https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035"]},{"id":"cm-douala-bonaberi-industrial-zone","name":"Douala-Bonabéri Industrial Zone (MAGZI)","type":"industrial zone","location":{"city":"Douala (Bonabéri)","lat":4.08,"lng":9.66},"authority":"MAGZI","area":"n/a","sectors":["agri-business","chemicals","metal","logistics"],"incentives":"MAGZI serviced land lease; national investment-incentive regime","tenants":"n/a (part of ~160 firms across Douala's two MAGZI zones)","status":"operational","opened":"n/a","projects":"n/a","notes":"West-bank zone adjacent to the Bonabéri port sector and the Wouri bridge; road access to the North-West/West regions.","sources":["https://magzicameroun.com/produit/zone-industrielle-douala-bonaberi/","https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035"]},{"id":"cm-ngaoundere-dry-port","name":"Ngaoundéré rail/road platform and dry port","type":"logistics zone","location":{"city":"Ngaoundéré","lat":7.32,"lng":13.58},"authority":"Camrail terminal operated by SMN (Société de Manutention de Ngaoundéré); dry-port project led by Ministry of Transport","area":"Dry port: ~200 ha allocated at Beka Matari; existing Camrail container terminal capacity 1,350 TEU","sectors":["transit logistics (Chad, northern Cameroon)","container handling","rail–road transfer"],"incentives":"n/a","tenants":"SMN, Chadian forwarders/transporters","status":"planned","opened":"n/a (rail terminal operational since railway completion in 1974)","projects":"Dry-port project (announced 2022, budget ~CFA 1.4bn, studies and tender) still without a firm start date; rehabilitation of the Ngaoundéré rail/road platform is a component of the World Bank Cameroon-Chad corridor project (2026 work plan)","notes":"Rail-head of the Douala–N'Djamena corridor where rail freight (roughly 39% modal share Douala–Ngaoundéré, 90% for fuel) shifts to trucks for Chad; a Chad-owned dry port on 10 ha downstream of Douala port (GPM/Genesis) has also been mooted.","sources":["https://www.investiraucameroun.com/economie/0404-17734-un-port-sec-d-environ-1-4-milliard-de-fcfa-en-gestation-a-ngaoundere-dans-la-partie-septentrionale-du-cameroun","https://camrail.cm/en/logistics-platforms/","https://ecomatin.net/cameroun-toujours-pas-de-visibilite-sur-le-demarrage-du-projet-de-port-sec-de-ngaoundere-annonce-depuis-50-ans","https://logistafrica.com/en/highlights/transport-and-transit-in-central-africa-the-douala-ndjamena-corridor-shifts-into-high-gear/"]},{"id":"cm-edea-industrial-zone","name":"Edéa industrial zone","type":"industrial zone","location":{"city":"Edéa","lat":3.8,"lng":10.13},"authority":"MAGZI (planned extension); existing industry anchored by Alucam smelter and the Edéa hydropower plant","area":"300 ha planned by 2035","sectors":["aluminium","energy-intensive industry","agri-business"],"incentives":"n/a","tenants":"Alucam aluminium smelter and related industries (existing, outside MAGZI perimeter)","status":"planned","opened":"n/a","projects":"Part of MAGZI's 9,101 ha programme to 2035; Edéa sits at the junction of the Douala–Yaoundé motorway phase 2 (Edéa Est–Edéa Ouest section) and the Edéa–Kribi motorway","notes":"Strategic node between Douala, Yaoundé and Kribi; financing of MAGZI zones is the main constraint (only CFA 20bn mobilised in ~50 years).","sources":["https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035","https://www.agenceecofin.com/transports/1210-122386-cameroun-la-phase-2-de-l-autoroute-yaounde-douala-est-en-cours"]},{"id":"cm-garoua-boulai-logistics-hub","name":"Garoua-Boulaï truck logistics hub (CNCC)","type":"logistics zone","location":{"city":"Garoua-Boulaï","lat":5.883,"lng":14.55},"authority":"Conseil National des Chargeurs du Cameroun (CNCC)","area":"2+ ha; parking for 200 trucks, accommodation, restaurant, admin block, borehole and generator","sectors":["transit trucking (Douala/Kribi–Bangui corridor)"],"incentives":"n/a","tenants":"Cross-border truckers","status":"operational","opened":"2025 (inaugurated 5 Sep 2025 after two-year delay)","projects":"Fourth CNCC logistics base under construction at Kousséri (Chad border); earlier bases at Dibamba (Douala) and Ngoulentang","notes":"Secures the border staging area for CAR-bound convoys; customs values goods transiting this route at ~CFA 55bn/year.","sources":["https://www.businessincameroon.com/public-management/0809-14977-douala-bangui-corridor-cameroon-opens-garoua-boulai-logistics-hub-to-boost-security-and-trade"]},{"id":"cm-ombe-industrial-zone","name":"Ombé industrial zone (Limbe/Tiko) and planned Limbe 1,000 ha zone","type":"industrial zone","location":{"city":"Ombé (Limbe–Tiko)","lat":4.05,"lng":9.28},"authority":"MAGZI","area":"n/a (existing Ombé zone); 1,000 ha new zone at Limbe planned by 2035","sectors":["agro-processing","petroleum services","construction materials"],"incentives":"n/a","tenants":"n/a","status":"operational","opened":"n/a","projects":"1,000 ha Limbe industrial zone tied to the Limbe deep-seaport project","notes":"Only MAGZI zone in the South-West region; activity constrained by the Anglophone crisis since 2017.","sources":["https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035"]}],"corridors":[{"id":"cm-douala-ndjamena-corridor","name":"Douala – Yaoundé – Ngaoundéré – Kousséri – N'Djamena corridor (Cameroon–Chad)","modes":["rail","road","multimodal"],"route":"Port of Douala → Yaoundé → Bélabo → Ngaoundéré (rail, ~900 km) → Garoua → Maroua → Kousséri/Nguéli bridge → N'Djamena (road); road-only variant via Ngaoundéré–Garoua–Kousséri","countries":["CM","TD"],"length":"~1,800 km Douala–N'Djamena (rail ~885 km to Ngaoundéré + ~900 km road)","operator":"Camrail (AGL) for rail; road trucking mainly by Chadian/Cameroonian hauliers; CNCC/BGFT corridor management","status":"operational","capacity_or_traffic":"~79% of Chad's imports transit via Douala; ~CFA 340-350bn of Chadian goods per year; Camrail carried 1.8m t of freight in 2014 (>2/3 of Chad's imports by rail then); rail modal share Douala–Ngaoundéré ~39% (90% for petroleum)","projects":"World Bank Cameroon-Chad Transport Corridor project (P167798, approved 15 Feb 2022, ~USD 495-816m incl. IDA USD 345m; effective June 2024): Douala–Yaoundé rail rehabilitation and signalling (USD 368m), Ngaoundéré rail/road platform, N'Djamena–Moundou road, trade facilitation; 2026 rail budget CFA 11.12bn. EU/EIB Global Gateway: rehabilitation of 229 km of the 596 km N'Djamena–Koutéré–Moundou road (works from Q2 2024). Yagoua–Bongor Logone bridge (CFA 74bn, AfDB + EU EUR 40m) opened 28 Apr 2025. AfDB Transport Facilitation Programme (2007, UA 454m) built Garoua-Boulaï–Ngaoundéré and Kousséri sections.","notes":"Backbone of Central African transit (with Douala–Bangui, ~80% of the sub-region's transit traffic); insecurity in the Far North (Boko Haram) and truck convoys add time/cost; Kribi increasingly competes for Chad-bound containers via Douala feeders and road. Camrail concession (AGL) is the key competitor asset on the rail leg.","sources":["https://documents1.worldbank.org/curated/en/493301633812350826/txt/Concept-Project-Information-Document-Integrated-Safeguards-Data-Sheet-Cameroon-Chad-Transport-Corridor-P167798.txt","https://documents1.worldbank.org/curated/en/099052125064036902/pdf/P167798-545747b6-126c-4af9-9075-7258430d9bac.pdf","https://logistafrica.com/en/highlights/transport-and-transit-in-central-africa-the-douala-ndjamena-corridor-shifts-into-high-gear/","https://international-partnerships.ec.europa.eu/policies/global-gateway/modernisation-ndjamena-douala-corridor-and-construction-bridge-chad_en","https://www.businessincameroon.com/construction/2404-14617-cameroon-and-chad-to-inaugurate-cfa74bn-cross-border-bridge-on-april-28","https://www.afdb.org/en/documents/document/cameroon-car-chad-transport-facilitation-program-on-the-douala-bangui-and-douala-ndjamena-corridors-esia-summary-12859","https://map.au-pida.org/projects/show/9800001"]},{"id":"cm-douala-bangui-corridor","name":"Douala – Yaoundé – Bertoua – Garoua-Boulaï/Béloko – Bangui corridor (Cameroon–CAR)","modes":["road","rail","multimodal"],"route":"Port of Douala (or Kribi) → Yaoundé → Bertoua (or rail to Bélabo) → Garoua-Boulaï → Béloko (CAR) → Bouar → Bangui","countries":["CM","CF"],"length":"~1,300-1,450 km (Béloko is 578 km from Bangui)","operator":"Road hauliers under CNCC/BGFT corridor management; Camrail to Bélabo timber terminal (SOMAC)","status":"operational","capacity_or_traffic":"~80% of CAR's imports; Cameroon customs values transit on the route at ~CFA 55bn/year; transit delays of several weeks reported","projects":"CAR moved its transit customs window from Douala to the Béloko dry port (finalised 6 Apr 2026); CNCC Garoua-Boulaï truck hub opened Sep 2025; AfDB Transport Facilitation Programme (2007) asphalted Garoua-Boulaï–Bouar (154 km) and Ngaoundéré–Garoua-Boulaï (260 km) and financed joint border checkpoints","notes":"Security-driven: convoys escorted by MINUSCA/FACA inside CAR; the Kribi–Bangui variant is promoted by PAK. Kentzou–Gamboula is the secondary crossing.","sources":["https://ecomatin.net/corridor-cameroun-centrafrique-bangui-delocalise-son-guichet-de-transit-de-douala-a-beloko","https://www.businessincameroon.com/public-management/0809-14977-douala-bangui-corridor-cameroon-opens-garoua-boulai-logistics-hub-to-boost-security-and-trade","https://www.afdb.org/en/documents/document/cameroon-car-chad-transport-facilitation-program-on-the-douala-bangui-and-douala-ndjamena-corridors-esia-summary-12859","https://lca.logcluster.org/23-central-african-republic-reseau-routier"]},{"id":"cm-camrail-douala-ngaoundere","name":"Camrail Douala – Yaoundé – Bélabo – Ngaoundéré railway (Transcamerounais)","modes":["rail"],"route":"Douala (Bessengue/port) → Eséka → Yaoundé → Bélabo → Ngaoundéré; branches Douala–Nkongsamba and Mbanga–Kumba","countries":["CM"],"length":"~1,000 km network (Douala–Yaoundé 265 km; Yaoundé–Bélabo 293 km; Bélabo–Ngaoundéré 329 km); metre gauge","operator":"Camrail (concession signed 19 Jan 1999, operations from 1 Apr 1999; reference shareholder Africa Global Logistics/ex-Bolloré; State minority)","status":"operational","capacity_or_traffic":"1.8m t freight and 1.7m passengers (2014); recent tonnage n/a; Ngaoundéré terminal 1,350 TEU capacity","projects":"World Bank-financed rehabilitation and signalling of the Douala–Yaoundé line (USD 368m component; preliminary design studies delayed, bidding expected 2025); Ngaoundéré platform rehabilitation; PIDA-listed Douala–Ngaoundéré–N'Djamena rail extension to Chad (studies)","notes":"Competitor asset: AGL (MSC group) controls Camrail as well as KCT and the Douala timber yard, giving MSC an integrated port-rail chain to Chad. Eséka derailment (2016) and ageing track constrain speed/capacity.","sources":["https://camrail.cm/en/about-us/","https://camrail.cm/en/logistics-platforms/","https://documents1.worldbank.org/curated/en/099052125064036902/pdf/P167798-545747b6-126c-4af9-9075-7258430d9bac.pdf","https://map.au-pida.org/projects/show/9800001"]},{"id":"cm-yaounde-douala-motorway","name":"Yaoundé – Douala motorway (phases 1 and 2)","modes":["road"],"route":"Yaoundé (Nkolbisson) → Bibodi → Bodmon → Edéa → Pitti → Douala (Massoumbou)","countries":["CM"],"length":"Phase 1: 60 km (Yaoundé–Bibodi); phase 2: 141.1 km in 5 sections (Bibodi–Bodmon 39.5 km, Bodmon–Edéa Est 34 km, Edéa Est–Ouest 30 km, Edéa Ouest–Pitti 18 km, Pitti–Massoumbou 19.5 km)","operator":"Ministry of Public Works; contractor China First Highway Engineering Corporation (CFHEC)","status":"under construction","capacity_or_traffic":"n/a (parallels the congested N3 that carries most Douala port hinterland traffic)","projects":"Phase 1 (~CFA 350bn, works 2014-2022) open; phase 2 (~CFA 880bn / ~USD 1.5bn, Chinese financing sought at FOCAC 2024) launched Oct 2024 with 36-month schedule, government target 2028","notes":"Critical for Douala–Yaoundé truck flows to Chad/CAR corridors; phase 2 also links to the Edéa–Kribi motorway at Edéa.","sources":["https://www.agenceecofin.com/transports/1210-122386-cameroun-la-phase-2-de-l-autoroute-yaounde-douala-est-en-cours","https://fr.allafrica.com/stories/202504160355.html","https://caa.cm/en/projet-de-la-2nde-phase-de-lautoroute-yaounde-douala/"]},{"id":"cm-kribi-lolabe-edea-motorway","name":"Kribi – Lolabé motorway and Edéa – Kribi motorway","modes":["road"],"route":"Kribi port (Mboro/Lolabé) → Kribi → Edéa (junction with Douala–Yaoundé motorway)","countries":["CM"],"length":"Kribi–Lolabé 38.5 km (+4 km port access), open since 2022; Edéa–Kribi ~92 km planned (total 108 km, 2x3 lanes, 110 km/h)","operator":"Ministry of Public Works; contractor China Harbour Engineering Company (CHEC); PPP with Chinese partner for operation/tolling","status":"under construction","capacity_or_traffic":"n/a","projects":"Edéa–Kribi section "TD","with_country_name":"Chad","type":"road","location":{"city":"Yagoua","lat":10.34,"lng":15.24},"traffic":"New second road link Cameroon–Chad; crossing time cut from ~45-60 min (ferry) to minutes; volumes n/a","status":"operational","hours":"n/a","projects":"620 m bridge (CFA 74bn; total programme ~CFA 92bn with 14.2 km access roads, customs posts) financed by AfDB loan + EUR 40m EU grant, built by Razel/Sotcocog, works from Feb 2020, inaugurated 28 Apr 2025","notes":"Opens a southern alternative to Kousséri for the Douala–N'Djamena corridor via Maroua/Yagoua–Bongor–N'Djamena.","sources":["https://www.businessincameroon.com/construction/2404-14617-cameroon-and-chad-to-inaugurate-cfa74bn-cross-border-bridge-on-april-28","https://www.afdb.org/en/success-stories/bridge-over-logone-river-great-leap-forward-millions-people-central-africa-79156"]},{"id":"cm-garoua-boulai-beloko","name":"Garoua-Boulaï – Béloko","with_country":"CF","with_country_name":"Central African Republic","type":"road","location":{"city":"Garoua-Boulaï","lat":5.883,"lng":14.55},"traffic":"Main gateway for CAR (~80% of CAR imports); goods valued ~CFA 55bn/year by Cameroon customs","status":"operational","hours":"n/a","projects":"CNCC 200-truck logistics hub opened 5 Sep 2025; CAR transit customs window relocated from Douala to Béloko dry port (Apr 2026); AfDB-financed joint checkpoint and asphalting of Garoua-Boulaï–Bouar","notes":"Convoys escorted inside CAR; periodic closures during CAR crises (2014); refugee pressure in the East region.","sources":["https://www.businessincameroon.com/public-management/0809-14977-douala-bangui-corridor-cameroon-opens-garoua-boulai-logistics-hub-to-boost-security-and-trade","https://ecomatin.net/corridor-cameroun-centrafrique-bangui-delocalise-son-guichet-de-transit-de-douala-a-beloko","https://en.wikipedia.org/wiki/Garoua-Boula%C3%AF"]},{"id":"cm-kye-ossi","name":"Kye-Ossi (tri-border with Gabon and Equatorial Guinea)","with_country":"GA","with_country_name":"Gabon (Bitam) and Equatorial Guinea (Ebibeyin)","type":"road","location":{"city":"Kye-Ossi","lat":2.175,"lng":11.341},"traffic":"Largest CEMAC land-trade hub for food exports to Gabon/Equatorial Guinea; heavily informal; three customs crossing points connected to CAMCIS","status":"operational","hours":"n/a","projects":"MAGZI plans a 150 ha industrial zone at Kyé-Ossi by 2035","notes":"UNECA survey (Mar 2026): high clearance costs, unreceipted charges (83% of traders), delays (78%), informal payments (56%); Equatorial Guinea periodically closes its side; border closed Aug-Sep 2016 during Gabon's election.","sources":["https://www.businessincameroon.com/public-management/1203-15887-corruption-and-customs-fees-weigh-on-informal-trade-at-central-africa-s-three-border-hub","https://en.wikipedia.org/wiki/Ky%C3%A9-Ossi","https://www.investiraucameroun.com/gestion-publique/1806-23506-zones-industrielles-la-magzi-projette-plus-de-9-000-hectares-de-nouveaux-sites-a-l-horizon-2035"]},{"id":"cm-abang-minkoo-eboro","name":"Abang Minko'o – Eboro","with_country":"GA","with_country_name":"Gabon","type":"road","location":{"city":"Abang Minko'o (Ambam)","lat":2.16,"lng":11.22},"traffic":"Cross-border market whose main customers are Gabonese; road link Ambam–Bitam–Oyem–Libreville","status":"operational","hours":"n/a","projects":"n/a","notes":"Multiple checkpoints/informal levies reported on the approach; closed with Kye-Ossi during Gabon's Aug-Sep 2016 election.","sources":["https://www.stopblablacam.com/economy-and-politics/2609-62-border-between-gabon-and-cameroon-to-be-closed","https://www.cameroon-tribune.cm/article.html/45006/fr.html/postes-frontieres-la-vigilance-de-mise"]},{"id":"cm-ekok-mfum","name":"Ekok – Mfum (Cross River bridge)","with_country":"NG","with_country_name":"Nigeria (Cross River State)","type":"OSBP (one-stop border post)","location":{"city":"Ekok","lat":5.8,"lng":8.83},"traffic":"Main formal road gateway between Cameroon and Nigeria; volumes n/a; officials acknowledge flows 'less efficient than expected'","status":"operational","hours":"n/a","projects":"402 m two-lane bridge and joint border post (Nigerian side) financed by AfDB/EU under the Bamenda–Enugu programme; Mfum–Ekok Border Modernisation Initiative launched 10 Sep 2026 (joint OSBP operations, real-time data exchange, joint risk management) backed by AfDB, ECOWAS, ECCAS, Afreximbank and AfCFTA Secretariat","notes":"Access road from Mamfe/Bamenda affected by the Anglophone conflict; joint border post built but unified operations still being negotiated.","sources":["https://www.afdb.org/sites/default/files/documents/projects-and-operations/multinational_-_transport_facilitation_program_for_the_bamenda-mamfe-ekokmfum-abakalikienugu_corridor.pdf","https://nairametrics.com/2026/09/10/nigeria-cameroon-launch-border-modernisation-project-to-ease-trade-barriers/","https://gazettengr.com/nigeria-cameroon-move-to-reduce-delays-at-mfum-ekok-border/"]},{"id":"cm-kentzou-gamboula","name":"Kentzou – Gamboula","with_country":"CF","with_country_name":"Central African Republic","type":"road","location":{"city":"Kentzou","lat":4.45,"lng":15.4},"traffic":"Secondary CAR entry point (Berbérati axis); mainly regional/informal trade","status":"operational","hours":"n/a","projects":"n/a","notes":"Was inaccessible in 2014 due to anti-Balaka activity; used as a fallback when Garoua-Boulaï is disrupted.","sources":["https://en.wikipedia.org/wiki/Garoua-Boula%C3%AF","https://www.cameroon-tribune.cm/article.html/45006/fr.html/postes-frontieres-la-vigilance-de-mise"]}]},"EG":{"country":{"code":"EG","name":"Egypt","region":"North Africa","capital":"Cairo","coastline":"Mediterranean and Red Sea (linked by the Suez Canal)","summary":"Egypt sits astride the Suez Canal, the main Asia–Europe sea lane, and is the region's largest transhipment and gateway market: Port Said East (APM Terminals' SCCT, 7m TEU after the 2025 expansion), the new Damietta Alliance terminal (Hapag-Lloyd/Eurogate/Contship, up to 3.3m TEU, opened Feb 2026), Alexandria/El Dekheila (Hutchison, MSC/TIL) on the Mediterranean, and Ain Sokhna (DP World since 2008; Hutchison/CMA/COSCO semi-automated terminal opened Jan 2026) on the Red Sea. The Suez Canal Economic Zone (c.461 km2, six ports, four industrial zones) has attracted about USD 15bn of investment, 70% foreign, and hosts DP World's Sokhna logistics park and AD Ports' KEZAD East Port Said. Headline projects are the Siemens-built 660 km Ain Sokhna–Alamein–Matrouh high-speed/freight line (trial operations from September 2026), the Sokhna–6th of October dry port–Alexandria rail link, Abu Qir's new Hutchison container terminal, AD Ports' Safaga multipurpose terminal and the planned USD 4bn King Salman bridge to Saudi Arabia. Red Sea/Houthi disruption cut Suez Canal revenue by an estimated USD 7bn from late 2023, but traffic and revenue were recovering strongly through Q4 2025 and 2026.","key_operators":["DP World","APM Terminals (Maersk)","Hutchison Ports","AD Ports Group","Hapag-Lloyd / Eurogate / Contship Italia (Damietta Alliance)","CMA CGM / CMA Terminals","COSCO Shipping Ports","MSC / Terminal Investment Ltd","Suez Canal Authority","Suez Canal Economic Zone (SCZONE)"],"sources":["https://www.dailynewsegypt.com/2026/02/24/sczone-attracts-15bn-in-investments-70-foreign-chairperson/","https://www.hellenicshippingnews.com/suez-canal-revenue-climbs-24-5-vessel-traffic-rises-9-in-q4-2025/","https://sczone.eg/","https://www.mts.gov.eg/en/"]},"ports":[{"id":"eg-port-said-east-scct","name":"Port Said East – Suez Canal Container Terminal (SCCT)","type":"container","location":{"city":"Port Said (East)","lat":31.23,"lng":32.33},"operator":"APM Terminals (SCCT S.A.E., a joint venture with COSCO Shipping Ports, Suez Canal Authority and Egyptian partners); Container Terminal 2 concession also with APM Terminals/SCCT","concession":"SCCT concession from Suez Canal Economic Zone Authority; expansion/Container Terminal 2 concession celebrated Aug 2023 (term it from 24 to 10 days (June 2025); DP World in talks with Baghdad for a permanent Europe-Iraq-UAE corridor (2026)","notes":"DP World interest: overland Europe-Iraq then sea across the Gulf to UAE, developed as a Hormuz bypass. Land transport costs 3-4x sea freight per DP World.","sources":["https://www.ttnews.com/articles/dp-world-hormuz-trucking","https://www.iraqinews.com/iraq/iraq-turkey-truck-transit-tir-system/","https://en.wikipedia.org/wiki/Iraq%E2%80%93Europe_Development_Road","https://centralasiacaucasusinstitute.substack.com/p/with-the-strait-of-hormuz-blocked"]},{"id":"iq-syria-baniyas-fuel-corridor","name":"Iraq - Syria (Al-Qaim / Rabia) road corridor and Baniyas fuel export route","modes":["road","pipeline"],"route":"Baghdad → Al-Qaim / Albu Kamal → Deir ez-Zor → Damascus / Homs → Baniyas (Mediterranean); northern branch Mosul → Rabia → Al-Yarubiyah → Hasakah","countries":["IQ","SY"],"length":"Al-Qaim c. 340 km from Baghdad, 450 km from Damascus","operator":"Iraqi Border Ports Authority; Syrian General Authority for Land and Maritime Border Crossings","status":"operational","capacity_or_traffic":"Al-Qaim crossing handled over USD 1bn of goods in 2024; >2m t of Iraqi petroleum products moved via Baniyas since early 2026","projects":"Al-Qaim reopened 14 June 2025; Rabia reopened April 2026; Al-Waleed (Tanf) reopening ordered Feb 2026; MoU July 2026 to study rehabilitating Kirkuk-Baniyas oil pipeline","notes":"Post-Assad normalisation and Hormuz disruption have revived Syria as Iraq's western outlet; security and banking channels remain weak.","sources":["https://www.agbi.com/trade/2025/06/iraq-and-syria-reopen-vital-border-crossing/","https://en.hathalyoum.net/articles/294347","https://english.enabbaladi.net/archives/2026/02/al-waleed-and-rabia-border/"]}],"border_crossings":[{"id":"iq-ibrahim-khalil","name":"Ibrahim Khalil / Habur","with_country":"TR","with_country_name":"Türkiye","type":"road","location":{"city":"Zakho, Duhok (KRI)","lat":37.1447,"lng":42.5656},"traffic":"Iraq's main land trade gateway with Türkiye (bilateral trade c. USD 15bn in 2024); cargo, civilian and military vehicles daily","status":"operational","hours":"24/7 (per Iraqi practice; not confirmed in sources)","projects":"TIR-enabled since 2025; Development Road/Fishkhabur alignment and Syria-routed convoys (May 2026) may divert traffic away from this KRG-run crossing","notes":"Managed by the Kurdistan Regional Government; major KRG revenue source. Congestion and federal-KRG customs disputes are recurring issues.","sources":["https://en.wikipedia.org/wiki/Ibrahim_Khalil_border_crossing","https://www.iraqinews.com/iraq/iraq-turkey-truck-transit-tir-system/","https://www.meforum.org/mef-observer/new-turkey-iraq-trade-route-sidelines-iraqi-kurdistan"]},{"id":"iq-fishkhabur","name":"Fishkhabur (Faysh Khabur) / Development Road border point","with_country":"TR","with_country_name":"Türkiye (and Syria tri-border)","type":"road+rail","location":{"city":"Faysh Khabur, Duhok","lat":37.08,"lng":42.36},"traffic":"Crude oil pipeline transit point (Kirkuk-Ceyhan); planned rail/road terminus of the Development Road","status":"planned","hours":"n/a","projects":"Mosul-Rabia-Fishkhabur rail lot (152 km) of the Development Road; new federal-controlled crossing intended to bypass the KRG-run Ibrahim Khalil","notes":"Politically contested between Baghdad and Erbil; also the ITP pipeline metering point.","sources":["https://en.wikipedia.org/wiki/Iraq%E2%80%93Europe_Development_Road","https://www.iraq-businessnews.com/2025/09/26/kurdistan-oil-exports-resume-after-multi-party-agreement/"]},{"id":"iq-trebil-karameh","name":"Trebil / Al-Karameh","with_country":"JO","with_country_name":"Jordan","type":"road","location":{"city":"Trebil, Rutba District, Anbar","lat":32.747,"lng":39.02},"traffic":"Primary Iraq-Jordan crossing; main route for Aqaba-Baghdad cargo and TIR transit toward Jordan/Saudi","status":"operational","hours":"n/a","projects":"2,200 ha Iraqi-Jordanian Joint Economic City planned at the crossing (developer tender 2023, acceleration agreed May 2025)","notes":"Long desert highway through Anbar; security escorts historically required.","sources":["https://en.wikipedia.org/wiki/Trebil","https://www.iraq-businessnews.com/2023/04/18/details-of-new-economic-city-between-jordan-and-iraq/","https://www.iraqinews.com/iraq/iraq-turkey-truck-transit-tir-system/"]},{"id":"iq-arar","name":"Arar (Jadidat Arar)","with_country":"SA","with_country_name":"Saudi Arabia","type":"road","location":{"city":"Arar / Nukhaib area, Anbar","lat":31.0,"lng":41.0},"traffic":"Reopened to trade November 2020 after c. 30 years; growing Saudi-Iraq commercial and pilgrim traffic; TIR route to Saudi","status":"operational","hours":"n/a","projects":"Iraq voted 24 Sept 2025 to open two further Saudi crossings (Jumaymah in Muthanna, Awayqilah); Jumaymah needs c. IQD 400bn to complete (Dec 2025)","notes":"Opening of Jumaymah has faced opposition from Iran-aligned groups.","sources":["https://www.aljazeera.com/news/2020/11/18/iraq-saudi-reopen-arar-border-crossing-after-30-years","https://www.kurdistan24.net/en/story/881173/iraq-moves-to-open-two-new-crossings-with-saudi-arabia"]},{"id":"iq-al-qaim","name":"Al-Qaim / Albu Kamal","with_country":"SY","with_country_name":"Syria","type":"road","location":{"city":"Al-Qaim, Anbar","lat":34.42,"lng":40.96},"traffic":"Over USD 1bn of goods handled in 2024; passenger and freight both directions","status":"operational","hours":"n/a","projects":"Reopened 14 June 2025 after six-month closure during the fall of the Assad government; adjacent Al-Qaim Free Zone phase 2 planned","notes":"Closed 2011-2019 and again Dec 2024-Jun 2025; security context (militias, border strikes) remains a risk factor.","sources":["https://www.agbi.com/trade/2025/06/iraq-and-syria-reopen-vital-border-crossing/","https://www.meed.com/economic-zones-in-iraq/"]},{"id":"iq-rabia","name":"Rabia / Al-Yarubiyah","with_country":"SY","with_country_name":"Syria","type":"road","location":{"city":"Rabia, Nineveh","lat":36.8,"lng":42.1},"traffic":"Reopened to commercial traffic April 2026 after c. 13 years (humanitarian-only since 2013)","status":"operational","hours":"n/a","projects":"On the Mosul-Rabia-Fishkhabur Development Road rail lot; came under Damascus control after the Jan 2026 SDF-government agreement","notes":"Historic rail crossing point of the Baghdad Railway toward Syria/Türkiye.","sources":["https://en.hathalyoum.net/articles/294347","https://english.enabbaladi.net/archives/2026/02/al-waleed-and-rabia-border/"]},{"id":"iq-shalamcheh","name":"Shalamcheh","with_country":"IR","with_country_name":"Iran","type":"road","location":{"city":"Basra (east of Basra city)","lat":30.5,"lng":48.067},"traffic":"One of the two busiest Iran-Iraq crossings (with Chazabeh); c. 2 million Arbaeen pilgrims via Shalamcheh and Chazabeh (Sept 2022); major import route for Iranian goods to southern Iraq","status":"operational","hours":"n/a","projects":"Basra-Shalamcheh railway under construction (70% reported Sept 2026), plus planned free-trade zone and industrial centre at the crossing","notes":"Will become Iraq's first rail crossing with Iran; US sanctions exposure for operators.","sources":["https://en.wikipedia.org/wiki/Shalamcheh","https://en.hathalyoum.net/articles/294147","https://amwaj.media/en/article/deep-dive-will-iran-iraq-rail-ambitions-turn-into-reality"]},{"id":"iq-safwan-abdali","name":"Safwan / Abdali","with_country":"KW","with_country_name":"Kuwait","type":"road","location":{"city":"Safwan, Basra","lat":30.117,"lng":47.717},"traffic":"Main Iraq-Kuwait land crossing; TIR transit exit toward Kuwait and GCC; 20 km from Basra Logistics City","status":"operational","hours":"n/a","projects":"Named as a TIR corridor node in 2025 Türkiye-Iraq-Gulf transit scheme","notes":"Close to Umm Qasr; Iraq-Kuwait tensions over Khor Abdullah navigation agreement (2023 Iraqi court ruling) affect port and border climate.","sources":["https://en.wikipedia.org/wiki/Safwan,_Iraq","https://www.iraqinews.com/iraq/iraq-turkey-truck-transit-tir-system/","https://www.prnewswire.co.uk/news-releases/kufan-group-and-northern-gulf-partners-launch-transformative-logistics-and-business-investment-in-iraq-156254475.html"]}]},"KE":{"country":{"code":"KE","name":"Kenya","region":"East Africa","capital":"Nairobi","coastline":"Indian Ocean","summary":"Kenya is the principal maritime gateway for the Northern Corridor, serving Uganda, Rwanda, Burundi, South Sudan and eastern DR Congo through the state-run Port of Mombasa, which handled a record 45.45m tonnes and 2.11m TEU in 2025. All seaports (Mombasa, Lamu, Kisumu, Shimoni) are operated directly by Kenya Ports Authority (KPA); a 30-year PPP concession of Mombasa berths 11-14/CT1 and Lamu berths 1-3 plus its SEZ was relaunched in 2025 after a 2022 DP World-focused process stalled. DP World's current footprint is the Mombasa Port Community System (launched Oct 2025) and the 222-ha DP World-GulfCap Mombasa Industrial Park SEZ (shareholders' agreement Sept 2026). Headline projects include the JICA-financed Dongo Kundu SEZ and free port, Mombasa berths 19B/23/24 (+1.4m TEU), the Naivasha ICD/SEZ transit hub, LAPSSET (Lamu-Isiolo-Moyale/Nadapal) and the restructured A8 Nairobi-Mombasa toll-road widening after the Usahihi expressway PPP was abandoned in 2025.","key_operators":["Kenya Ports Authority (KPA)","Kenya Railways Corporation (KRC)","DP World (PCS, Mombasa Industrial Park SEZ)","GulfCap Africa","Rendeavour (Tatu City)","LAPSSET Corridor Development Authority"],"sources":["https://www.porttechnology.org/port-of-mombasa-hits-2-1-million-teus-in-2025/","https://kpa.co.ke/Ports/PortOfMombasa","https://kenyainsights.com/kenya-quietly-relaunches-mombasa-lamu-port-concessions-amid-dp-world-speculation","https://cyprusshippingnews.com/2026/09/14/dp-world-and-gulfcap-africa-advance-mombasa-industrial-park-investment-with-shareholders-agreement/","https://www.porttechnology.org/dp-world-strengthens-africa-trade-with-mombasa-pcs/","https://www.ttcanc.org/"]},"ports":[{"id":"ke-mombasa","name":"Port of Mombasa (Kilindini Harbour)","type":"container","location":{"city":"Mombasa","lat":-4.06,"lng":39.63},"operator":"Kenya Ports Authority (KPA) – state landlord and terminal operator for all berths, including Container Terminal 1 (CT1) and Container Terminal 2 (CT2)","concession":"None in force. A 30-year PPP concession of berths 11-14 and CT1 (with Lamu berths 1-3 and Lamu SEZ) was relaunched in April 2025 (transaction adviser sought March 2025) after a 2022 single-operator process with DP World was suspended in November 2023; Treasury now favours multiple partners.","capacity":"22 berths (conventional and container); two container terminals with combined 2.3m TEU/year; Kipevu Oil Terminal 4 berths/770 m; cruise terminal; bulk grain, soda ash, clinker, coal and titanium facilities","throughput":"45.45m tonnes and 2.11m TEU (2025); transit cargo 15.88m tonnes (2025); 41m tonnes / 2.0m TEU (2024)","status":"operational","opened":"1896 (modern Kilindini deep-water port developed from 1920s)","projects":"Berth 19B (China-financed contract), berths 23 and 24 to add 1.4m TEU and lift container capacity to 3.1m TEU; new terminal operating system (40% complete, early 2026) and gate automation at gates 23/24 (60%); DP World Port Community System live since 27 Oct 2025 (targets 30% faster clearance, c.3,000 users); Dongo Kundu free-port berths (JICA, see zone entry).","notes":"DP World is not a terminal operator here; it supplies the PCS (with EMEA Port Logistics) and is developing the adjacent 222-ha Mombasa Industrial Park SEZ with GulfCap Africa. CT2 was financed by Japan (JICA, USD 264m, 2015). Japan and China have objected to a single-operator concession. Cargo dwell time fell from 7.2 days (2012) to 3.3 days (2021) and truck turnaround from 26 h to 15 h (2019-2023) under TMEA-supported programmes.","sources":["https://kpa.co.ke/Ports/PortOfMombasa","https://www.porttechnology.org/port-of-mombasa-hits-2-1-million-teus-in-2025/","https://kenyainsights.com/kenya-quietly-relaunches-mombasa-lamu-port-concessions-amid-dp-world-speculation","https://www.porttechnology.org/dp-world-strengthens-africa-trade-with-mombasa-pcs/","https://www.trademarkafrica.com/countries/kenya/"]},{"id":"ke-kipevu-oil-terminal","name":"Kipevu Oil Terminal (KOT), Mombasa","type":"oil & gas","location":{"city":"Mombasa","lat":-4.05,"lng":39.63},"operator":"Kenya Ports Authority (KPA); pipeline evacuation by Kenya Pipeline Company","concession":"n/a","capacity":"Offshore island terminal with 4 berths, total quay length 770 m; accommodates 3 tankers simultaneously up to 170,000 DWT; handles crude, LPG and refined products (jet fuel, diesel, petrol) via pipelines to storage","throughput":"n/a (included in Mombasa port totals)","status":"operational","opened":"n/a (new offshore KOT replaced the original 1963 terminal in the 2020s)","projects":"n/a","notes":"Supplemented by Shimanzi and Mbaraki Wharf oil terminals. Petroleum for Uganda, Rwanda and South Sudan is evacuated by Kenya Pipeline Company to Nairobi, Eldoret and Kisumu, where MV Uhuru I/II lake tankers load for Uganda.","sources":["https://kpa.co.ke/Ports/PortOfMombasa","https://www.standardmedia.co.ke/shipping-logistics/article/2001545989/kisumu-port-targets-700000-tonnes-as-expansion-fuels-lake-victoria-trade-boom"]},{"id":"ke-lamu","name":"Port of Lamu (Manda Bay)","type":"container","location":{"city":"Lamu","lat":-2.22,"lng":40.92},"operator":"Kenya Ports Authority (KPA); LAPSSET Corridor Development Authority is project owner","concession":"None yet. Berths 1-3 and the Lamu SEZ are part of the 30-year PPP concession relaunched in April 2025; the 2022 process had earmarked them for DP World. Government has signalled leasing the port to a private operator to develop the remaining 20 berths.","capacity":"3 operational berths of 400 m each (first phase of 23 planned); draft 17.5 m, natural channel depth 17 m; 500 m turning basin; rated 1.2m TEU/year; can take Post-Panamax/Post-Suezmax vessels above 10,000 TEU","throughput":"799,161 tonnes and 55,687 TEU (2025), up from 74,380 tonnes (2024); 34 vessel calls in H1 2025 vs 20 in all of 2024","status":"operational","opened":"2021 (berth 1 commissioned May 2021)","projects":"Phase 2 liquid-bulk and agri-bulk terminals planned; Lamu-Ijara-Garissa access road (KES 17.9bn, 453 km, started April 2021, delayed) and LAPSSET rail/pipeline still to be built. First-phase cost reported at KES 310bn (LAPSSET programme).","notes":"Mainly transshipment (SeaLead, Hapag-Lloyd calls incl. 8,604 TEU Nagoya Express) plus feeder traffic to Mombasa and Dar es Salaam; Ethiopia and South Sudan transit trade not yet material because corridor roads are incomplete. Built by China Communications Construction Co. (2014-2021). Potential DP World target; competitor interest not publicly confirmed.","sources":["https://kpa.co.ke/Ports/PortOfLamu","https://www.lapsset.go.ke/lamu-port/","https://www.porttechnology.org/port-of-mombasa-hits-2-1-million-teus-in-2025/","https://nation.africa/kenya/counties/lamu/lamu-port-records-growth-amidst-transshipment-challenges--5073674","https://maritime-executive.com/article/kenya-s-white-elephant-port-begins-to-receive-large-boxships-at-last","https://www.the-star.co.ke/counties/coast/2025-06-09-lamu-ports-allure-grows-as-more-vessels-dock"]},{"id":"ke-kisumu","name":"Port of Kisumu (Lake Victoria)","type":"river","location":{"city":"Kisumu","lat":-0.1,"lng":34.75},"operator":"Kenya Ports Authority (KPA); Kenya Railways Corporation operates MV Uhuru I and MV Uhuru II wagon/tanker ferries","concession":"n/a","capacity":"4 berths, 400 m quay (extension from 262 m to 392 m under way), 4 m draught; linkspan for wagon ferries; oil jetty; target 700,000 tonnes/year","throughput":"496,516 tonnes (2025, KPA) vs 295,516 tonnes (2024); Jan-Mar 2026 145,753 tonnes (+46% y/y)","status":"operational","opened":"1901 (rehabilitated from 2018, re-launched 2021)","projects":"Quay extension, dredging, new passenger terminal, dedicated access road, new mobile crane and forklifts (2025-26); Nakuru-Kisumu metre-gauge line rehabilitated to feed the port.","notes":"Main cargo is petroleum exported by MV Uhuru II twice weekly to Port Bell/Jinja (Uganda) and coal/dry cargo from Mwanza (Tanzania). Regional Lake Victoria network also includes MV Mpungu (1,000 t) and Ugandan/Tanzanian tankers. No private concession.","sources":["https://www.kpa.co.ke/Ports/PortOfKisumu","https://www.standardmedia.co.ke/shipping-logistics/article/2001545989/kisumu-port-targets-700000-tonnes-as-expansion-fuels-lake-victoria-trade-boom","https://www.porttechnology.org/port-of-mombasa-hits-2-1-million-teus-in-2025/"]},{"id":"ke-shimoni","name":"Shimoni Fishing Port","type":"fishing","location":{"city":"Shimoni, Kwale County","lat":-4.65,"lng":39.38},"operator":"Kenya Ports Authority (KPA) with the State Department for Blue Economy","concession":"n/a","capacity":"Up to 24,000 tonnes of fish/year; 75 m x 30 m jetty on 135 m causeway; 4 km deep-water access channel; fish processing plant, cold storage, reefer stations, ice plant, substation","throughput":"n/a","status":"operational","opened":"2025 (fish hatchery opened July 2025; port facilities commissioned in 2025)","projects":"n/a","notes":"Kenya's first purpose-built fishing port, part of the Blue Economy programme; near the Lunga Lunga/Horohoro border with Tanzania.","sources":["https://www.kpa.co.ke/Ports/PortOfShimoni","https://en.wikipedia.org/wiki/Shimoni"]},{"id":"ke-nairobi-icd","name":"Nairobi Inland Container Depot (ICD Embakasi)","type":"multipurpose","location":{"city":"Nairobi (Embakasi)","lat":-1.32,"lng":36.9},"operator":"Kenya Ports Authority (KPA); rail haulage by Kenya Railways (SGR and metre gauge)","concession":"n/a","capacity":"Over 450,000 TEU/year on 43.5 ha; container yard, 4 warehouses, 3 sheds","throughput":"n/a","status":"operational","opened":"1984 (expanded 2017-2018 for SGR)","notes":"Primary dry port for Nairobi imports moved by SGR 'railtainer' service from Mombasa; policy since 2026 is to route long-haul transit cargo (Uganda, Rwanda, DRC, South Sudan) via Naivasha ICD instead.","projects":"n/a","sources":["https://kpa.co.ke/Ports/InlandContainerDepots"]},{"id":"ke-naivasha-icd","name":"Naivasha Inland Container Depot (Mai Mahiu/Suswa)","type":"multipurpose","location":{"city":"Naivasha (Mai Mahiu)","lat":-0.98,"lng":36.45},"operator":"Kenya Railways Corporation (owner) with Kenya Ports Authority and KRA operations","concession":"n/a","capacity":"3,588 ground slots (KPA); KRC states 45,000 m2 yard, 2m tonnes/year and capacity expanded from 180,000 to 450,000 TEU/year; Star reported 4,000 TEU handling capacity at 19% occupancy (Feb 2026)","throughput":"n/a","status":"operational","opened":"2019 (SGR Phase 2A terminus); fully operationalised as transit hub February 2026","projects":"Designated in Feb 2026 as the priority depot for transit cargo to Uganda, Rwanda, DRC and South Sudan; plots in adjoining Naivasha SEZ allocated to Uganda, Rwanda, Burundi, DRC and South Sudan (10 acres) for national dry-port facilities.","notes":"SGR ends at Suswa/Naivasha; onward movement to Malaba is by road or the rehabilitated Longonot-Malaba metre-gauge link. Africa Global Logistics (AGL) is a licensed Naivasha SEZ tenant – competitor presence.","sources":["https://krc.co.ke/naivasha-inland-container-depot/","https://kpa.co.ke/Ports/InlandContainerDepots","https://www.the-star.co.ke/counties/rift-valley/2026-02-05-naivasha-depot-operationalised-to-decongest-mombasa-port"]}],"zones":[{"id":"ke-mombasa-industrial-park","name":"DP World – GulfCap Africa Mombasa Industrial Park SEZ","type":"special economic zone","location":{"city":"Mombasa","lat":-4.04,"lng":39.66},"authority":"Joint venture of DP World and GulfCap Africa (Suleiman Shahbal); licensed under Kenya's SEZ framework","area":"222 ha (Phase 1: 40 ha)","sectors":["light manufacturing","warehousing","logistics","regional distribution"],"incentives":"Kenya SEZ regime (reduced corporate tax, VAT zero-rating, duty exemptions)","tenants":"60+ local and international companies expressed interest (Sept 2026); 20,000+ direct/indirect jobs targeted","status":"planned","opened":"n/a","projects":"Partnership announced early August 2026 (reported KES 12bn); shareholders' agreement signed in Nairobi Sept 2026 with President Ruto pledging supporting infrastructure. Investment value and construction timeline not disclosed.","notes":"DP World asset. Extends DP World's Kenya presence beyond the Mombasa Port Community System into port-linked industrial real estate; exact site within Mombasa County not disclosed in sources.","sources":["https://cyprusshippingnews.com/2026/09/14/dp-world-and-gulfcap-africa-advance-mombasa-industrial-park-investment-with-shareholders-agreement/","https://www.semafor.com/article/09/14/2026/dp-world-expands-africa-network-with-new-industrial-park-in-kenya","https://www.businessdailyafrica.com/bd/corporate/companies/dp-world-s-mombasa-deal-deepens-kenya-footprint-5546976","https://peopledaily.digital/business/what-is-dp-world-dubai-logistics-giant-behind-ksh12b-mombasa-sez-deal"]},{"id":"ke-dongo-kundu-sez","name":"Dongo Kundu Special Economic Zone (Mombasa SEZ) and Free Port","type":"port-linked zone","location":{"city":"Mombasa (Likoni)","lat":-4.08,"lng":39.62},"authority":"Kenya Ports Authority (transferred from Special Economic Zones Authority, Aug 2024); master plan by JICA","area":"c. 3,000 acres (1,214 ha); land applications for nearly 7,000 acres received","sectors":["free port / port logistics","industrial parks","free trade zone","energy (LPG, refining)","warehousing"],"incentives":"SEZ tax incentives and customs exemptions","tenants":"Taifa Gas LPG terminal and Ruike Energy oil refinery in progress; Afreximbank leased 500 acres (Feb 2025)","status":"under construction","
