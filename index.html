<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Harbourline Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F3F6F9; --surface:#FFFFFF; --surface-2:#EAF0F5; --ink:#16212D; --ink-2:#4A5A6B; --ink-3:#7A8896;
    --line:#D8DFE7; --navy:#0E2A47; --steel:#2F6F9F; --steel-soft:#E4EEF6;
    --dpw:#B4701C; --dpw-soft:#F7ECDB;
    --ok:#1E7A6C; --ok-soft:#DDF1EC; --warn:#9A6B00; --warn-soft:#FBF1D4; --plan:#5B5F8A; --plan-soft:#E7E7F3; --off:#8A4B4B; --off-soft:#F4E1E1;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 10px 30px rgba(14,42,71,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F161E; --surface:#161F2A; --surface-2:#1C2733; --ink:#E7ECF1; --ink-2:#AEBAC6; --ink-3:#7C8A98;
      --line:#2A3542; --navy:#DCE7F3; --steel:#7FB2DA; --steel-soft:#1C2C3C;
      --dpw:#E0A55A; --dpw-soft:#33281A;
      --ok:#5FC3B0; --ok-soft:#173129; --warn:#E3B84A; --warn-soft:#332B12; --plan:#A9ACE0; --plan-soft:#25263A; --off:#E08C8C; --off-soft:#3A2323;
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F161E; --surface:#161F2A; --surface-2:#1C2733; --ink:#E7ECF1; --ink-2:#AEBAC6; --ink-3:#7C8A98;
    --line:#2A3542; --navy:#DCE7F3; --steel:#7FB2DA; --steel-soft:#1C2C3C;
    --dpw:#E0A55A; --dpw-soft:#33281A;
    --ok:#5FC3B0; --ok-soft:#173129; --warn:#E3B84A; --warn-soft:#332B12; --plan:#A9ACE0; --plan-soft:#25263A; --off:#E08C8C; --off-soft:#3A2323;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding-inline:0;padding-block:0;}
  *{box-sizing:border-box;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
  .app{display:grid;grid-template-columns:270px 1fr;height:100%;min-height:100vh;}
  /* sidebar */
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;color:var(--navy);letter-spacing:-.01em;}
  .brand .sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-top:2px;}
  .side .meta{padding:10px 18px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .clist{overflow:auto;padding:8px 10px 16px;flex:1;}
  .clist h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:12px 8px 4px;font-weight:600;}
  .cbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border-radius:6px;gap:8px;}
  .cbtn:hover{background:var(--surface-2);}
  .cbtn.active{background:var(--steel-soft);color:var(--navy);font-weight:600;}
  .cbtn .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .soonlist{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px;}
  .soonlist .chip{font-size:11px;color:var(--ink-3);}
  .mobile-sel{display:none;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);}
  select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;}
  /* main */
  .main{min-width:0;display:flex;flex-direction:column;min-height:0;}
  .chead{padding:22px 28px 0;border-bottom:1px solid var(--line);background:var(--surface);}
  .chead h2{font-family:var(--serif);font-size:28px;font-weight:700;margin:0;color:var(--navy);text-wrap:balance;}
  .chead .region{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--steel);font-weight:600;}
  .chead .summary{color:var(--ink-2);max-width:78ch;margin:8px 0 6px;}
  .ops{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
  .chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);}
  .chip.dpw{background:var(--dpw-soft);color:var(--dpw);font-weight:600;}
  .tabs{display:flex;gap:4px;overflow-x:auto;}
  .tab{padding:10px 14px;border-bottom:3px solid transparent;color:var(--ink-2);white-space:nowrap;font-weight:500;}
  .tab .cnt{margin-left:6px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .tab.active{color:var(--navy);border-bottom-color:var(--steel);font-weight:600;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 28px 0;align-items:center;}
  .tools input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;}
  .tools select{width:auto;}
  .tools .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .list{padding:14px 28px 40px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, box-shadow .15s;}
  .card:hover{border-color:var(--steel);box-shadow:0 2px 10px rgba(14,42,71,.08);}
  .card .t{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.3;color:var(--ink);text-wrap:balance;}
  .card .l{font-size:12.5px;color:var(--ink-3);}
  .card .d{color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .st{font-size:11px;font-weight:600;padding:1px 8px;border-radius:3px;letter-spacing:.02em;}
  .st.operational{background:var(--ok-soft);color:var(--ok);}
  .st.construction{background:var(--warn-soft);color:var(--warn);}
  .st.planned{background:var(--plan-soft);color:var(--plan);}
  .st.suspended,.st.closed{background:var(--off-soft);color:var(--off);}
  .st.dpw{background:var(--dpw-soft);color:var(--dpw);}
  .type{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;}
  .empty{color:var(--ink-3);padding:30px 0;grid-column:1/-1;}
  /* detail */
  .scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);overflow:auto;padding:0 0 40px;padding-top:env(safe-area-inset-top,0px);}
  .dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .dhead h3{font-family:var(--serif);font-size:22px;font-weight:700;margin:4px 0 6px;color:var(--navy);text-wrap:balance;}
  .close{font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--ink-2);}
  .close:hover{background:var(--surface-2);}
  .dbody{padding:16px 22px;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;margin:0;}
  .kv dt{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px;}
  .kv dd{margin:0;color:var(--ink);}
  .kv dd.na{color:var(--ink-3);}
  .dbody h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin:22px 0 8px;}
  .src a{display:block;color:var(--steel);text-decoration:none;font-size:13px;word-break:break-all;padding:3px 0;}
  .src a:hover{text-decoration:underline;}
  .maplink{display:inline-block;margin-top:4px;font-size:13px;color:var(--steel);text-decoration:none;border-bottom:1px solid var(--line);}
  /* gate */
  .gate[hidden]{display:none!important;}
  .gate{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .gate form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .gate h2{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:22px;}
  .gate p{color:var(--ink-2);margin:0 0 16px;font-size:13.5px;}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;letter-spacing:.08em;}
  .gate button{margin-top:12px;width:100%;padding:11px;border-radius:6px;background:var(--navy);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .gate button, .gate button{color:var(--paper);}
  .gate .err{color:var(--off);font-size:13px;margin-top:8px;min-height:1.2em;}
  @media (max-width: 820px){
    .app{grid-template-columns:1fr;}
    .side{display:none;}
    .mobile-sel{display:block;}
    .chead{padding:16px 16px 0;}
    .chead h2{font-size:23px;}
    .tools,.list{padding-inline:16px;}
    .kv{grid-template-columns:1fr;gap:2px 0;}
    .kv dt{margin-top:10px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h2>Harbourline Atlas</h2>
    <p>Enter the access code to open the atlas.</p>
    <input id="code" type="password" autocomplete="off" placeholder="Access code" aria-label="Access code">
    <button type="submit">Open</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><h1>Harbourline Atlas</h1><div class="sub">Ports · Zones · Corridors · Borders</div></div>
    <div class="meta" id="meta"></div>
    <nav class="clist" id="clist" aria-label="Countries"></nav>
  </aside>
  <main class="main">
    <div class="mobile-sel"><select id="msel" aria-label="Country"></select></div>
    <header class="chead" id="chead"></header>
    <div class="tools">
      <input type="search" id="q" placeholder="Search name, operator, city…" aria-label="Search">
      <select id="fstatus" aria-label="Status filter">
        <option value="">All statuses</option>
        <option value="operational">Operational</option>
        <option value="under construction">Under construction</option>
        <option value="planned">Planned</option>
        <option value="suspended">Suspended / closed</option>
      </select>
      <label style="font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center"><input type="checkbox" id="fdpw"> DP World only</label>
      <span class="count" id="count"></span>
    </div>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
</div>

ensitive goods.","sources":["https://en.wikipedia.org/wiki/Dubai_Airport_Freezone"]}],"corridors":[{"id":"ae-etihad-rail-freight-network","name":"Etihad Rail national freight network (Al Ghuweifat – Ruwais – Abu Dhabi – Dubai – Sharjah – Fujairah)","modes":["rail","multimodal"],"route":"Al Ghuweifat (Saudi border) → Ruwais/Habshan/Shah → ICAD & Khalifa Port (Abu Dhabi) → Dubai Industrial City & Jebel Ali → Sharjah/Al Ghayl (RAK) → Fujairah Port (and Khor Fakkan link agreed 2026)","countries":["AE"],"length":"c.900 km (Stage 1 264 km opened 2016; Stage 2 605 km completed Feb 2023)","operator":"Etihad Rail (federal, Government of Abu Dhabi / UAE)","status":"operational","capacity_or_traffic":"2025: >10m t aggregates, 6.5m t sulphur, 148,000 containers; aggregate line at 100% capacity (up to 60,000 t/day); target 60m t/year by 2030; each train replaces c.300 trucks","projects":"Aggregate-line capacity expansion (2025); bonded rail corridor Khalifa Port–Fujairah (pilot late 2025); Khor Fakkan connection agreement with Gulftainer (2026); passenger service launched 30 June 2026 (Abu Dhabi–Fujairah); 38 additional locomotives ordered","notes":"Seven freight terminals (Ruwais, ICAD, Khalifa Port, Dubai Industrial City, Jebel Ali Port, Al Ghayl, Fujairah). Became the domestic Hormuz-bypass landbridge in 2026, including the first vehicle train (Nissan cars Fujairah→Abu Dhabi). Serves both DP World (Jebel Ali) and AD Ports (Khalifa) terminals.","sources":["https://gulfnews.com/uae/etihad-rail-progress-report-on-track-for-a-2026-launch-1.500425732","https://www.thenationalnews.com/news/uae/2025/10/01/uae-expanding-etihad-rails-freight-capacity-as-business-grows/","https://en.wikipedia.org/wiki/Etihad_Rail","https://www.businesstoday.in/world/story/how-the-gulf-is-redrawing-its-logistics-network-to-bypass-hormuz-531417-2026-05-14"]},{"id":"ae-dp-world-fujairah-jebel-ali-landbridge","name":"DP World east-coast landbridge: Fujairah (Al Rugaylat/Dibba) – Jebel Ali/Jafza","modes":["road","rail","multimodal"],"route":"Al Rugaylat & Dibba terminals (Gulf of Oman) → E89/E99 east-coast highways and Etihad Rail Fujairah terminal → Sharjah/Dubai → Jebel Ali Port & Jafza","countries":["AE"],"length":"c.130–150 km road (Fujairah–Jebel Ali)","operator":"DP World (inland logistics network) with Etihad Rail","status":"under construction","capacity_or_traffic":"Planned: 2.5m TEU, 1.7m t general cargo, 190,000 CEU at Al Rugaylat; 3.6m t at Dibba; lifts DP World UAE capacity from 19.4m to c.22m TEU","projects":"50-year concession signed 22 July 2026 with Fujairah Ports Authority; construction 24–30 months (commercial availability c.2028); part of DP World's ~US$3bn 2026 capex","notes":"DP WORLD PROJECT. Strategic response to the 2026 Hormuz closure that cut Jebel Ali volumes 90% in Q2 2026; designed for ULCVs so mainline calls can stay outside Hormuz with cargo trucked/railed to Dubai.","sources":["https://www.dpworld.com/en/news/dp-world-to-expand-uae-gateway-network-with-new-fujairah-terminals","https://maritime-executive.com/article/dubai-and-dp-world-confirm-plans-to-expand-fujairah-port-to-bypass-hormuz","https://blog.gettransport.com/trends-in-logistic/strait-of-hormuz-bypass-2026-uae-shipper-guide/"]},{"id":"ae-khor-fakkan-sharjah-inland-corridor","name":"Khor Fakkan – Al Dhaid – Sajaa – Sharjah/Dubai road & rail corridor (Gulftainer)","modes":["road","rail","multimodal"],"route":"Khor Fakkan Container Terminal → Sharjah–Khor Fakkan highway (E89 via Al Dhaid) → Al Dhaid dry port → Sajaa dry port → Sharjah/Dubai consumption centres and Jebel Ali","countries":["AE"],"length":"c.120 km road (Khor Fakkan–Sharjah)","operator":"Gulftainer (terminals, dry ports, GT Maritime feeders); Etihad Rail for rail leg","status":"operational","capacity_or_traffic":"Truck traffic 7,000/day (2026) vs 100 pre-crisis; 65,000 TEU/week through Khor Fakkan (July 2026); planned 2.3m TEU/year inland capacity (Al Dhaid 1.5m TEU + Sajaa)","projects":"US$2bn Gulftainer masterplan (July 2026): Al Dhaid dry port phase 1 (500,000 TEU within 45 days, 1.5m TEU in 6 months), new truck marshalling yard, Khor Fakkan–Etihad Rail connection agreement","notes":"COMPETITOR corridor to DP World's Fujairah landbridge; absorbed the bulk of UAE imports during the Hormuz closure.","sources":["https://www.thenationalnews.com/business/energy/2026/07/07/khor-fakkan-port-terminal-capacity-to-be-doubled-amid-hormuz-disruption/","https://www.agbi.com/logistics/2026/07/gulftainer-accelerates-expansion-of-sharjahs-khor-fakkan-port/","https://www.businesstoday.in/world/story/how-the-gulf-is-redrawing-its-logistics-network-to-bypass-hormuz-531417-2026-05-14"]},{"id":"ae-habshan-fujairah-pipeline","name":"Habshan – Fujairah crude oil pipeline (ADCOP)","modes":["pipeline"],"route":"Habshan (Bab field, Al Dhafra, Abu Dhabi) → Hajar mountains → Fujairah oil terminal / FOIZ","countries":["AE"],"length":"360 km","operator":"ADNOC Onshore (owned by IPIC/ADNOC group)","status":"operational","capacity_or_traffic":"1.5m bpd design capacity; carried the bulk of UAE crude exports (>1.7m bpd crude and products loaded at Fujairah) during the 2026 Hormuz closure","projects":"ADNOC underground crude storage caverns at Fujairah (three crude grades) under construction","notes":"Built 2012 at c.US$4.2bn specifically to bypass Hormuz; Fujairah loadings disrupted by drone strikes 14–15 March 2026.","sources":["https://www.gem.wiki/Habshan%E2%80%93Fujairah_Oil_Pipeline","https://www.malaymail.com/news/money/2026/03/18/drone-strikes-expose-reliance-on-uaes-fujairah-port-as-a-critical-middle-east-oil-bypass/213052","https://fujairahport.ae/business-activities/oil/"]},{"id":"ae-hafeet-rail-oman","name":"Hafeet Rail (Etihad Rail – Oman link, Abu Dhabi/Al Ain – Sohar)","modes":["rail"],"route":"Etihad Rail network at Abu Dhabi → Al Ain → Hafeet/Buraimi border → Sohar Port (Oman)","countries":["AE","OM"],"length":"238 km new line (c.300 km including UAE links)","operator":"Hafeet Rail (JV of Etihad Rail, Oman Rail/Asyad Group and Mubadala)","status":"under construction","capacity_or_traffic":"Planned freight trains >15,000 t (c.270 containers) per journey; passenger up to 200 km/h","projects":"AED 5.5bn (US$1.5bn) civil-works contracts awarded April 2024; construction 50–70% complete (Oct 2025); testing/commissioning from early 2026; first cross-border link of the GCC Railway","notes":"Would give Abu Dhabi/KEZAD and Dubai a rail outlet to Sohar outside Hormuz, complementing the Fujairah/Khor Fakkan routes; Sohar was named primary gateway of the Dubai–Oman green corridor (Mar 2026).","sources":["https://www.gccrailway.com/uae-oman-238-kms-hafeet-rail-project-nears-completion-connecting-sohar-port-and-abu-dhabi-world-news/","https://en.wikipedia.org/wiki/Etihad_Rail","https://www.agbi.com/transport/2026/03/etihad-rail-freight-going-the-distance-through-iran-strikes/"]},{"id":"ae-dubai-oman-green-corridor-hatta","name":"Dubai – Oman 'Green Corridor' road route (Sohar – Al Wajajah/Hatta – Dubai)","modes":["road","multimodal"],"route":"Sohar Port (also Salalah, Duqm) → Oman Route 7 → Al Wajajah (OM) / Hatta (AE) → E44 Hatta–Dubai road → Jebel Ali, Dubai airports, local market","countries":["AE","OM"],"length":"c.240 km Sohar–Dubai by road","operator":"Dubai Customs and Oman customs (Dubai Customs Notice 04/2026); commercial truckers","status":"operational","capacity_or_traffic":"Transit planning: Oman clearance same day–48 h, road leg several hours, Hatta to final destination same day; Hatta crossing 3,500–4,500 crossings/day (all traffic); Hatta trade 'rises sharply' in 2026 (AGBI, Sep 2026)","projects":"Green corridor launched 13–14 March 2026 for sealed containers bound for Jebel Ali/Dubai and re-exports via Omani ports; bidirectional","notes":"Created within weeks of the Hormuz closure; carriers (e.g. ONE) redirected empties to Sohar. Alternative road corridors via Khatmat Malaha (Sohar–Fujairah/Kalba) and Mezyad (Al Ain).","sources":["https://theloadstar.com/dubai-and-oman-open-green-corridor-for-smoother-cargo-flows/","https://blog.gettransport.com/trends-in-logistic/strait-of-hormuz-bypass-2026-uae-shipper-guide/","https://www.agbi.com/trade/2026/09/uae-and-oman-trade-through-hatta-gateway-rises-sharply/"]},{"id":"ae-uae-saudi-road-corridor-ghuweifat","name":"UAE – Saudi Arabia road corridor (Abu Dhabi – Al Ghuweifat/Al Batha – Riyadh/Dammam)","modes":["road"],"route":"Jebel Ali/Dubai → E11 Sheikh Zayed Rd → Abu Dhabi → E11 Al Dhafra → Al Ghuweifat (AE) / Al Batha (SA) → Saudi Highway 95/10 → Riyadh, Dammam, Jeddah","countries":["AE","SA"],"length":"c.370 km Dubai–Ghuweifat; c.900 km Dubai–Riyadh","operator":"Federal/Emirate road authorities; Etihad Rail line to Ghuweifat parallels it (future GCC Railway link to Saudi)","status":"operational","capacity_or_traffic":"Bilateral trade >US$20bn/year; truck volumes elevated in 2026 as Hormuz closure pushed cargo to road; delays of hours to more than a week reported June–Aug 2026","projects":"GCC Railway Saudi–UAE link via Ghuweifat (Etihad Rail track already reaches the border; Saudi side not built)","notes":"Land route used for Europe–Gulf overland trucking during the crisis (e.g. Spinneys 16-day Kent–Dubai run). Saudi–UAE political tensions in 2026 added unexplained holds at Al Batha.","sources":["https://www.semafor.com/article/07/09/2026/saudi-uae-border-trade-slows-amid-tensions","https://khaleejcargo.com/uae-saudi-border-delays/","https://www.businesstoday.in/world/story/how-the-gulf-is-redrawing-its-logistics-network-to-bypass-hormuz-531417-2026-05-14"]}],"border_crossings":[{"id":"ae-al-ghuweifat","name":"Al Ghuweifat (UAE) / Al Batha (Saudi Arabia)","with_country":"SA","with_country_name":"Saudi Arabia","type":"road","location":{"city":"Al Ghuweifat, Al Dhafra (Abu Dhabi)","lat":24.11,"lng":51.62},"traffic":"The UAE's only land crossing with Saudi Arabia and the main truck gateway for Gulf land trade (>US$20bn bilateral trade/year); truck queues historically up to 22 km; volumes elevated summer 2026","status":"operational","hours":"24/7","projects":"Etihad Rail freight line terminates at Ghuweifat awaiting Saudi-side GCC Railway connection; past clearance-acceleration measures at Al Ghuwaifat post","notes":"June–Aug 2026: waits from hours to more than a week, goods 'held up without explanation' amid Saudi–UAE tensions and Hormuz-driven road surge; Saudi customs deny systematic delays.","sources":["https://www.semafor.com/article/07/09/2026/saudi-uae-border-trade-slows-amid-tensions","https://khaleejcargo.com/uae-saudi-border-delays/","https://gulfnews.com/uae/transport/al-ghuwaifat-border-post-speeds-up-clearance-for-trucks-1.1479637"]},{"id":"ae-hatta-al-wajajah","name":"Hatta (UAE) / Al Wajajah (Oman)","with_country":"OM","with_country_name":"Oman","type":"road","location":{"city":"Hatta (Dubai)","lat":24.807,"lng":56.205},"traffic":"3,500–4,500 crossings/day (all traffic); primary Dubai–Muscat/Sohar truck route; trade through Hatta 'rises sharply' in 2026","status":"operational","hours":"24/7","projects":"Dubai–Oman green corridor for sealed containers (Dubai Customs Notice 04/2026, March 2026)","notes":"Typical wait 30–60 min, 3–4 h at peaks; became the key Hormuz-bypass road gateway from Sohar into Dubai in 2026.","sources":["https://bordercrossinghub.com/hatta-al-wajajah-hatta-al-wajajah-oman-border-crossing/","https://theloadstar.com/dubai-and-oman-open-green-corridor-for-smoother-cargo-flows/","https://www.agbi.com/trade/2026/09/uae-and-oman-trade-through-hatta-gateway-rises-sharply/"]},{"id":"ae-khatmat-malaha","name":"Khatmat Malaha (Oman) / Kalba–Wadi Al Helo (UAE)","with_country":"OM","with_country_name":"Oman","type":"road","location":{"city":"Kalba (Sharjah), east coast","lat":24.93,"lng":56.34},"traffic":"Handles vehicles and commercial trucks; shortest link between Sohar and Fujairah/Khor Fakkan/Kalba; volumes n/a","status":"operational","hours":"n/a","projects":"n/a","notes":"East-coast alternative to Hatta for Sohar–Fujairah traffic; c.25 km from the Hatta crossing per border guides.","sources":["https://bordercrossinghub.com/hatta-al-wajajah-hatta-al-wajajah-oman-border-crossing/"]},{"id":"ae-mezyad-hafeet","name":"Mezyad (UAE) / Hafeet (Oman)","with_country":"OM","with_country_name":"Oman","type":"road","location":{"city":"Al Ain (Abu Dhabi)","lat":24.03,"lng":55.84},"traffic":"Main Abu Dhabi/Al Ain–Buraimi–Ibri–Nizwa/Muscat road crossing; volumes n/a","status":"operational","hours":"n/a","projects":"Hafeet Rail (238 km Abu Dhabi–Al Ain–Sohar) crosses the border near here; construction 50–70% complete Oct 2025, commissioning from 2026","notes":"Historic Buraimi oasis crossing; passport controls imposed since Nov 2006. Future road+rail gateway once Hafeet Rail opens.","sources":["https://en.wikipedia.org/wiki/Al_Ain","https://www.gccrailway.com/uae-oman-238-kms-hafeet-rail-project-nears-completion-connecting-sohar-port-and-abu-dhabi-world-news/"]},{"id":"ae-al-dara-musandam","name":"Al Dara (Ras Al Khaimah) / Tibat (Oman, Musandam)","with_country":"OM","with_country_name":"Oman (Musandam exclave)","type":"road","location":{"city":"Sha'am, Ras Al Khaimah","lat":26.05,"lng":56.08},"traffic":"Only road access to Musandam (Khasab); light commercial and passenger traffic; volumes n/a","status":"operational","hours":"n/a","projects":"n/a","notes":"Minor freight relevance; Musandam is supplied largely via this crossing and by sea from Khasab. Detail not confirmed in accessed sources beyond general border guides.","sources":["https://bordercrossinghub.com/hatta-al-wajajah-hatta-al-wajajah-oman-border-crossing/"]},{"id":"ae-dibba","name":"Dibba Al Fujairah / Dibba Al Hisn (UAE) – Dibba Al Baya (Oman, Musandam)","with_country":"OM","with_country_name":"Oman (Musandam exclave)","type":"road","location":{"city":"Dibba (Fujairah/Sharjah)","lat":25.62,"lng":56.27},"traffic":"Local passenger and light goods traffic to Dibba Al Baya; not a trucking gateway; volumes n/a","status":"operational","hours":"n/a","projects":"DP World Dibba general-cargo terminal (3.6m t/year) under 50-year concession signed July 2026, adjacent to the border town","notes":"Freight relevance is the new DP World Dibba terminal rather than the crossing itself.","sources":["https://www.dpworld.com/en/news/dp-world-to-expand-uae-gateway-network-with-new-fujairah-terminals","https://bordercrossinghub.com/hatta-al-wajajah-hatta-al-wajajah-oman-border-crossing/"]}]},"AO":{"country":{"code":"AO","name":"Angola","region":"Southern Africa","capital":"Luanda","coastline":"Atlantic (approx. 1,600 km, including the Cabinda exclave)","summary":"Angola is Sub-Saharan Africa's second-largest oil producer and is repositioning itself as the Atlantic gateway for the DRC and Zambian Copperbelt via the Lobito Corridor. Luanda handles the bulk of national imports (about 12.5–12.7 million tonnes in Jan–Sep of both 2024 and 2025, roughly 340,000 containers in Jan–Sep 2024) through three main terminals run by Sogester (APM Terminals/Maersk), DP World and an AD Ports Group–Unicargas–Multiparques joint venture. Lobito is the growth story: the Benguela railway is now operated by the Trafigura–Mota-Engil–Vecturis Lobito Atlantic Railway concession (2023, 30 years, USD 753m DFC/DBSA financing closed Dec 2025), AGL/MSC operates the container terminal and a greenfield Zambia–Lobito rail line (about 830 km, USD 5bn) is being structured by AFC with AfDB, DFC, EU and Italian backing. Other headline projects are the Japanese-financed Namibe/Sacomar port expansion completed in Oct 2025, the USD 831m Caio deep-water port in Cabinda (about 79% complete, Sept 2026) and the USD 900m private Barra do Dande port and free zone north of Luanda (2026).","key_operators":["DP World","AD Ports Group (Noatum)","APM Terminals / Maersk (Sogester)","AGL / MSC","Lobito Atlantic Railway (Trafigura, Mota-Engil, Vecturis)","Unicargas","Multiparques","CITIC / Shandong Port Group","Porto de Luanda EP","Porto do Lobito EP"],"sources":["https://www.portoluanda.co.ao/porto-de-luanda-cresce-23-no-trafego-de-navios-e-reforca-movimentacao-de-cargas-ate-setembro-de-2025/","https://www.dpworld.com/news/releases/dp-world-signs-20-year-concession-agreement-with-angola/","https://www.trafigura.com/news-and-insights/press-releases/2023/concession-for-railway-services-transferred-to-lobito-atlantic-railway-in-angola/","https://www.railway.supply/lobito-atlantic-railway-upgrade-financing-closes-at-753m/","https://furtherafrica.com/2026/04/30/lobito-rail-corridor-gets-afc-afdb-backing/","https://www.toa-const.co.jp/eng/corp_overview/release/2025/251014.html","https://allafrica.com/stories/202609090719.html","https://furtherafrica.com/2026/07/22/angola-secures-900m-barra-do-dande-port-and-free-zone-investment/"]},"ports":[{"id":"ao-luanda","name":"Port of Luanda","type":"multipurpose","location":{"city":"Luanda","lat":-8.795,"lng":13.235},"operator":"Porto de Luanda EP (port authority); terminals: Sogester (APM Terminals 51% / Gestor de Fundos Angola) container terminal; DP World Luanda multipurpose terminal; AD Ports Group–Unicargas–Multiparques multipurpose terminal (operated by Noatum); Angola LNG and PetroAngola liquid terminals","concession":"DP World: 20-year concession for the Multipurpose Terminal signed 25 Jan 2021 (USD 190m investment commitment). AD Ports Group: 20-year concession (+10-year option) for the second multipurpose terminal signed 23 Apr 2024, 81% JV with Unicargas and Multiparques, operations started Jan 2025. Sogester container terminal: APM Terminals-led JV (concession since 2005).","capacity":"12+ principal berths; drafts 12.5 m (containers), 13.5 m (bulk), 19.3 m (tanker berth). DP World MPT: 610 m quay, 12.5 m depth, 23 ha, target c. 700,000 TEU/yr. Sogester terminal: c. 800,000 TEU/yr. AD Ports terminal: 192,000 m2, draft to be deepened 9.5 to 16 m, capacity to rise from 25,000 to 350,000 TEU plus 40,000 vehicles by Q3 2026.","throughput":"12.7 million tonnes and 293,949 containers in Jan–Sep 2025 (vs 12.5 million tonnes and 341,886 containers in Jan–Sep 2024; containers -14%); 4,059 vessel calls Jan–Sep 2025 (+23%). Full-year 2023: c. 625,000 TEU.","status":"operational","opened":"1576 (modern port developed from 1940s)","projects":"AD Ports Group USD 251m (2024–2026, up to USD 379m over the concession) redevelopment of the ex-Unicargas/Multiparques multipurpose terminal, completion targeted Q3 2026; DP World USD 190m rehabilitation and equipment programme under its 2021 concession (new tractor fleet, terminal operating system live 2022); Sogester Luanda quay and yard upgrades (2020–2022).","notes":"DP WORLD ASSET: DP World Luanda MPT (first DP World seaport on Africa's south-west coast). Direct competitors on the same port: AD Ports Group (Abu Dhabi) since 2024/25 and APM Terminals/Maersk (Sogester). Container volumes fell in 2025 partly because AD Ports' terminal is under reconstruction with boxes diverted to Viana ICD. Rail link via CFL to Malanje; road congestion on the Luanda ring is a known constraint.","sources":["https://www.portoluanda.co.ao/porto-de-luanda-cresce-23-no-trafego-de-navios-e-reforca-movimentacao-de-cargas-ate-setembro-de-2025/","https://www.dpworld.com/news/releases/dp-world-signs-20-year-concession-agreement-with-angola/","https://www.adportsgroup.com/en/news-and-media/2024/04/23/ad-ports-group-agreement-to-operate-and-upgrade-the-multipurpose-port-terminal-in-angola","https://www.adportsgroup.com/en/news-and-media/2025/01/30/ad-ports-group-starts-port-and-logistics-operations-in-luanda-angola","https://www.apmterminals.com/en/news/news-releases/2022/220215-luanda","https://africaports.co.za/luanda/"]},{"id":"ao-lobito","name":"Port of Lobito","type":"multipurpose","location":{"city":"Lobito","lat":-12.345,"lng":13.545},"operator":"Porto do Lobito EP (port authority); AGL (Africa Global Logistics, MSC group) container and multipurpose terminal; mineral/bulk terminal linked to Lobito Atlantic Railway","concession":"AGL: concession for the container and multipurpose terminal signed 11 Dec 2023 after international tender (bids also from CITIC/Shandong Port Group consortium and ICTSI), investment of nearly EUR 100m, operations from Q1 2024. Term not disclosed in sources.","capacity":"Container/multipurpose terminal: 1,200 m quay, 14 m depth, 12,000 TEU storage. Tender documentation (2022) targeted 2.78 million t/yr and 100,000 TEU/yr for the terminal.","throughput":"Lobito Corridor rail traffic c. 125,000 t in 2024 (40,000 t copper); c. 200,000 t international plus 65,000 t domestic rail cargo in 2025. Port-level annual tonnage n/a.","status":"operational","opened":"1928 (rail-port terminus of the Benguela railway)","projects":"AGL EUR 100m terminal upgrade (2024–); first low-carbon refined copper cargo from Kamoa (DRC) shipped via Lobito in Feb 2026 (Trafigura/Aurubis); mineral terminal and rail yard upgrades tied to the USD 753m LAR financing (Dec 2025); Lobito refinery (200,000 bpd, Sonangol, targeted 2027) will add liquid-bulk flows.","notes":"Competitor concession: AGL/MSC. Atlantic outlet of the Lobito Corridor for DRC/Zambian copper and cobalt; deep-water, congestion-free alternative to Durban/Dar es Salaam for the Copperbelt. Dry port and free-zone development announced by the port authority.","sources":["https://maritimafrica.com/en/agl-signs-concession-contract-for-multipurpose-and-container-terminal-at-port-of-lobito-angola/","https://macaonews.org/news/lusofonia/citic-and-shandong-port-group-to-manage-cargo-terminal-at-angolas-lobito-port/","https://www.lobitoatlantic.com/about-the-project/","https://www.trafigura.com/news-and-insights/press-releases/2026/trafigura-aurubis-and-kamoa-copper-complete-first-sale-of-low-carbon-refined-copper-via-the-lobito-atlantic-railway/","https://africadosul.mirex.gov.ao/web/noticias/mais-de-125-mil-toneladas-transportadas-atraves-do-corredor-do-lobito-em-2024"]},{"id":"ao-namibe","name":"Port of Namibe (Moçâmedes)","type":"container","location":{"city":"Moçâmedes (Namibe)","lat":-15.19,"lng":12.15},"operator":"Empresa Portuária do Namibe EP (port authority); container terminal operated by Sogester (APM Terminals/Maersk JV)","concession":"Sogester operates the Namibe container terminal alongside Luanda (upgrades 2020–2022). Term n/a.","capacity":"After the 2022–2025 expansion the container terminal can receive vessels up to 50,000 DWT / 3,000 TEU (previously restricted by shallow quay depth).","throughput":"n/a","status":"operational","opened":"1840s (colonial port); container terminal expanded 2025","projects":"Namibe Bay Comprehensive Development Project (Toyota Tsusho / TOA Corporation, contract Jan 2019, works Sept 2022 – completed 10 Oct 2025): container-terminal expansion and dredging at Namibe plus rehabilitation of Sacomar; total c. USD 600m financed by JBIC/SMBC export credit with NEXI cover and USD 100m from DBSA.","notes":"Competitor presence: APM Terminals/Maersk (Sogester). Southern gateway intended to reduce reliance on Walvis Bay (Namibia) and to serve the Moçâmedes railway hinterland (Lubango, Menongue).","sources":["https://www.toa-const.co.jp/eng/corp_overview/release/2025/251014.html","https://www.toyota-tsusho.com/english/press/detail/251014_006705.html","https://www.dbsa.org/projects/port-namibe-project","https://www.apmterminals.com/en/news/news-releases/2020/200205-sogester-luanda-and-namibe-infrastructure-upgrades-continue"]},{"id":"ao-sacomar","name":"Sacomar mineral terminal (Namibe Bay)","type":"bulk","location":{"city":"Moçâmedes (Namibe)","lat":-15.21,"lng":12.13},"operator":"Empresa Portuária do Namibe EP; iron-ore export terminal for the Cassinga (Jamba) mines","concession":"n/a","capacity":"New jetty of approximately 520 m total length for iron-ore export (completed 2025).","throughput":"n/a (no exports recorded before rehabilitation)","status":"operational","opened":"1967 (rebuilt 2022–2025)","projects":"Rehabilitated 2022–2025 under the Toyota Tsusho/TOA Namibe Bay project (JBIC/NEXI/DBSA financing); designed to restart iron-ore exports from Cassinga via the Moçâmedes railway.","notes":"Dedicated mineral terminal; commercial viability depends on relaunch of Cassinga iron-ore mining.","sources":["https://www.toa-const.co.jp/eng/corp_overview/release/2025/251014.html","https://www.nexi.go.jp/en/topics/newsrelease/2019032901.html"]},{"id":"ao-cabinda-caio","name":"Port of Cabinda / Caio deep-water terminal","type":"multipurpose","location":{"city":"Cabinda (Caio, Liambo)","lat":-5.35,"lng":12.17},"operator":"Porto de Cabinda EP (port authority); Caio project company Caioporto SA","concession":"Caioporto SA (public-private project company) develops the Caio terminal; existing Cabinda port is a lighterage/offshore-supply facility. Terms n/a.","capacity":"Caio design capacity: 200,000 containers/yr, 6,000 vehicles, 800,000 t phosphate rock, 366,000 t urea and 60,000 t timber per year; 500 m access bridge; intelligent gate system rated 60 containers/hour.","throughput":"n/a","status":"under construction","opened":"n/a (Caio inauguration expected late 2026)","projects":"Caio deep-water port: project value over USD 831m, financed with a USD 758.7m China Eximbank buyer's credit; 79.08% physical completion in Sept 2026 (quay 96.6% complete); adjoining Caio free zone at 41.6%.","notes":"Cabinda exclave currently depends on lighterage and on road imports via Pointe-Noire (Congo); Caio will be the first deep-water berth in the province and is paired with a free zone. Fertiliser (phosphate/urea) exports from the planned Cabinda phosphate project are a design driver.","sources":["https://allafrica.com/stories/202609090719.html","https://china.aiddata.org/projects/68708/","https://cabinda.gov.ao/web/noticias/cabinda-porto-de-caio-zona-franca-vai-impulsionar-comercio-e-investimentos-criando-oportunidades-de-emprego"]},{"id":"ao-soyo","name":"Port of Soyo (Kwanda base and Angola LNG terminal)","type":"oil & gas","location":{"city":"Soyo","lat":-6.13,"lng":12.37},"operator":"Porto do Soyo EP (port authority); Kwanda Lda (Kwanda Island logistics base concessionaire, c. 50 companies); Angola LNG (Chevron-led) export terminal; Quinfuquena crude terminal","concession":"Kwanda Island base under concession to Kwanda Lda (established 1983); 2017 concession for a 19,100 m2 facility with a 200 m quay; Angola LNG terminal separated from the port by presidential decree in 2012.","capacity":"200 m operational quay (2017 concession); Angola LNG plant 5.2 mtpa; river/cabotage terminals on the Congo estuary.","throughput":"n/a","status":"operational","opened":"1979 (port entity); Kwanda base 1983; Angola LNG 2013","projects":"Oil & gas logistics expansion linked to the 2025 licensing round and Kwanda base upgrades; Soyo industrial zone.","notes":"Primarily an offshore-oil supply and LNG export hub for the Congo Basin blocks; not a commercial container gateway.","sources":["https://www.portodosoyo.co.ao/portodoSoyo.html","https://www.angolalng.com/operations/plant","https://energycapitalandpower.africa-newsroom.com/press/angolas-infrastructure-supports-new-concessions-ahead-of-2025-bid-round?lang=en"]},{"id":"ao-porto-amboim","name":"Porto Amboim","type":"multipurpose","location":{"city":"Porto Amboim","lat":-10.72,"lng":13.76},"operator":"Porto Amboim EP (port company); PAENAL offshore fabrication yard (Sonangol/SBM/DSME) adjacent","concession":"2017 project for a commercial port on 80 ha plus 30 ha dry port by Sonangol Holding and Sogester (70%) with private capital (30%); not implemented.","capacity":"Two 115 m quays (1927 and 1956); PAENAL yard with heavy-lift quay for FPSO integration.","throughput":"n/a (no commercial port activity as of 2022–2023)","status":"operational","opened":"1927","projects":"Dredging of the docks (2023 priority) to restart cabotage; government plans for a shipyard with PAENAL/Sonangol; 2017 commercial-port plan (2 to 7 berths) remains unfunded.","notes":"Mainly relevant as an oil & gas fabrication site (PAENAL) and potential cabotage node for Cuanza Sul; minimal commercial cargo.","sources":["https://furtherafrica.com/2022/12/30/angolas-amboim-port-boost-commercial-domestic-activities/","https://sheetpiling.arcelormittal.com/download-center/porto-amboim-angola-paenal-fabrication-yard"]},{"id":"ao-barra-do-dande","name":"Barra do Dande port and ocean fuel terminal","type":"bulk","location":{"city":"Barra do Dande (Bengo)","lat":-8.47,"lng":13.37},"operator":"Sociedade de Desenvolvimento da Barra do Dande (SDBD); Barra do Dande Ocean Terminal (PTOBD, fuel storage); commercial port sub-concession to Huatong Angola Industry and Berkshire Waterhouse Infrastructure Development","concession":"25-year renewable sub-concession (July 2026) for construction and operation of the commercial port terminal by Huatong Angola / Berkshire Waterhouse: USD 450m for the terminal plus USD 450m supporting infrastructure.","capacity":"Fuel terminal phase 1: 16 tanks, 580,000 m3 (petrol, diesel, LPG), 1,700 m jetty; phase 2 to 728,500 m3. Commercial port designed for vessels up to 80,000 t, bulk and containers.","throughput":"n/a","status":"under construction","opened":"2025 (fuel terminal phase 1, inaugurated 10 Feb 2025)","projects":"Commercial deep-water port: three phases, first operations c. 24 months after start, full operation 2029–2030 (USD 900m private investment, 2026). Fuel terminal phase 2. Earlier international tender for the new port launched by the Ministry of Transport.","notes":"Intended to decongest Luanda (40 km south) as a bulk and strategic-reserve gateway; Chinese-led investment. Watch for competing container capacity with Luanda terminals including DP World.","sources":["https://furtherafrica.com/2026/07/22/angola-secures-900m-barra-do-dande-port-and-free-zone-investment/","https://theenergyyear.com/news/first-phase-of-barra-do-dande-terminal-inaugurated-in-angola/","https://dandefreezone.co.ao/~dandefreezone/index.php?lang=en","https://www.emb-baciadocongo.org/en/new-port-of-barra-do-dande-angola-focus-of-international-public-tender/"]}],"zones":[{"id":"ao-luanda-bengo-zee","name":"Luanda-Bengo Special Economic Zone (ZEE)","type":"special economic zone","location":{"city":"Viana (Luanda)","lat":-8.93,"lng":13.4},"authority":"ZEE Luanda-Bengo EP (state company under the Ministry of Industry and Commerce); restructured by Presidential Decree 81/21 (April 2021)","area":"4,718 ha core (Viana reserve) within a wider 8,300 ha designated area across Luanda and Bengo provinces","sectors":["agro-processing","manufacturing","building materials","pharmaceuticals","logistics","renewables"],"incentives":"Reduced corporate income tax (reported 15%, lower for exporters), duty-free import of equipment and raw materials, one-stop investor office, 100% foreign ownership and profit repatriation under the Private Investment Law.","tenants":"Over 200 companies; 166 industrial and commercial projects in the Viana reserve (2025)","status":"operational","opened":"2009","projects":"Ongoing privatisation of state-built factories in the zone (PROPRIV); new plots and logistics platforms under the 2021 restructuring.","notes":"Largest industrial hub in Angola, c. 30 km from the Port of Luanda and adjacent to the Viana inland container depot used by Luanda terminal operators.","sources":["https://investhere.ipim.gov.mo/en/port/angola/angola_keycities/luanda/luandaindustrialandeconomic/","https://www.angolaexpert.com/en/angola-the-luanda-bengo-special-economic-zone-zee/","https://luanda.gov.ao/web/noticias/zona-econ%C3%B3mica-especial-zee-luanda-bengo"]},{"id":"ao-viana-industrial","name":"Viana Industrial Development Hub (PDIV)","type":"industrial zone","location":{"city":"Viana (Luanda)","lat":-8.9,"lng":13.37},"authority":"Luanda Provincial Government / Ministry of Industry (created by Resolutions 1/98 and 4/98, March 1998)","area":"2,350 ha in three zones (A, B, C), 846 lots","sectors":["manufacturing","logistics","commerce","services"],"incentives":"Tax incentives and subsidies for companies installing on serviced industrial land.","tenants":"Over 500 companies","status":"operational","opened":"1998","projects":"Viana inland container depot (ICD) used by AD Ports Group/Noatum during the Luanda terminal rebuild (2024–2026); rail link via CFL Viana station.","notes":"Zone C is designated for commercial, service and residential projects; the hub is the main dry-port and warehousing cluster serving the Port of Luanda.","sources":["https://investhere.ipim.gov.mo/en/port/angola/angola_keycities/luanda/luandaindustrialandeconomic/","https://www.adportsgroup.com/en/news-and-media/2024/04/23/ad-ports-group-agreement-to-operate-and-upgrade-the-multipurpose-port-terminal-in-angola"]},{"id":"ao-barra-do-dande-free-zone","name":"Barra do Dande Free Zone / Integrated Development Platform (DIP Angola)","type":"free zone","location":{"city":"Barra do Dande (Bengo)","lat":-8.5,"lng":13.4},"authority":"Sociedade de Desenvolvimento da Barra do Dande (SDBD), under the Ministry of Transport","area":"n/a","sectors":["fuel and strategic reserves","aluminium","manufacturing","food storage","logistics"],"incentives":"Free-zone regime under Angola's Free Zones Law (Law 35/20); details per SDBD investment guide.","tenants":"Aluminium industrial park (operational, c. 2,000 jobs), Sino-Ord integrated industrial park (10+ plants), edible-oil refinery (target mid-2028); nine contracts for 34 plots signed May 2026","status":"under construction","opened":"2025 (first industrial units)","projects":"USD 900m Huatong Angola / Berkshire Waterhouse port and infrastructure package (July 2026); first-phase target of 21,000 jobs; full port operations 2029–2030.","notes":"Port-linked zone built around the PTOBD fuel terminal and the planned deep-water commercial port; Chinese-led industrial anchor tenants.","sources":["https://dandefreezone.co.ao/~dandefreezone/index.php?lang=en","https://furtherafrica.com/2026/07/22/angola-secures-900m-barra-do-dande-port-and-free-zone-investment/","https://www.verangola.net/va/en/052026/Construction/48941/DIP-Angola-moves-forward-nine-contracts-signed-to-install-industries-residences-and-businesses-on-34-plots-in-Barra-do-Dande.htm","https://conselhoconsultivomintrans.ao/docs/CC_15/Painel2/Adilson_Catala_DANDE_FREE_ZONE_Proposta_07062024.pdf"]},{"id":"ao-lobito-free-zone","name":"Lobito port and corridor free zone / dry port","type":"port-linked zone","location":{"city":"Lobito","lat":-12.37,"lng":13.55},"authority":"Porto do Lobito EP with the Ministry of Transport; Lobito Corridor Transit Facilitation Agency (Angola, DRC, Zambia)","area":"n/a","sectors":["logistics","mineral handling","refining","manufacturing"],"incentives":"Free-zone regime under Law 35/20 being applied to corridor logistics platforms; transit facilitation under the tri-national corridor agreement.","tenants":"n/a","status":"planned","opened":"n/a","projects":"Dry port and logistics platform tied to the AGL terminal and LAR rail yard; Lobito refinery (200,000 bpd, Sonangol) nearby; EU Global Gateway and US DFC trade-facilitation programmes along the corridor.","notes":"Zone status remains at planning/announcement stage; Lobito Corridor Transit Facilitation Agency headquartered in Lobito.","sources":["https://international-partnerships.ec.europa.eu/policies/global-gateway/connecting-democratic-republic-congo-zambia-and-angola-global-markets-through-lobito-corridor_en","https://conselhoconsultivomintrans.ao/media/attachments/2025/09/12/tema-3_ottoniel_manuel.pdf","https://lobitorefinery.com/project/project-overview/"]},{"id":"ao-cabinda-caio-free-zone","name":"Caio Free Zone (Cabinda)","type":"port-linked zone","location":{"city":"Cabinda (Caio)","lat":-5.35,"lng":12.17},"authority":"Porto de Cabinda EP / Caioporto SA with the Cabinda Provincial Government","area":"n/a","sectors":["logistics","fertilisers","timber","oil & gas services","commerce"],"incentives":"Free-zone regime under Law 35/20; presented to the provincial government in April 2025.","tenants":"n/a","status":"under construction","opened":"n/a","projects":"Headland complex and free-zone works 41.6% complete (Sept 2026) as part of the USD 831m Caio port project.","notes":"Only free zone in the exclave; commercial success hinges on the Caio port opening (expected late 2026) and on cross-border trade with the two Congos.","sources":["https://cabinda.gov.ao/web/noticias/cabinda-porto-de-caio-zona-franca-vai-impulsionar-comercio-e-investimentos-criando-oportunidades-de-emprego","https://allafrica.com/stories/202609090719.html"]}],"corridors":[{"id":"ao-lobito-corridor","name":"Lobito Corridor (Benguela railway: Lobito – Huambo – Luau – Dilolo – Kolwezi)","modes":["rail","multimodal"],"route":"Port of Lobito → Benguela → Huambo → Cuito → Luena → Luau/Dilolo (DRC border) → Kolwezi (DRC Copperbelt)","countries":["AO","CD","ZM"],"length":"c. 1,289–1,300 km in Angola plus c. 400 km in DRC to Kolwezi","operator":"Lobito Atlantic Railway (Trafigura, Mota-Engil, Vecturis) under a 30-year concession from 4 July 2023","status":"operational","capacity_or_traffic":"c. 125,000 t in 2024 (40,000 t copper); c. 200,000 t international plus 65,000 t domestic in 2025; planned 1,555 wagons and 35 locomotives; upgrade targets 4.6 million t/yr (tenfold increase).","projects":"USD 753m financing signed 24 Dec 2025 (US DFC USD 553m, DBSA USD 200m) for track, signalling and rolling stock; initial LAR commitment USD 455m in Angola plus up to USD 100m in DRC (2023); Mota-Engil USD 1.26bn DRC-segment (Kolwezi–Dilolo) concession; EU Global Gateway MoU (Oct 2023) with US, Italy, AfDB, AFC.","notes":"Flagship US/EU-backed critical-minerals corridor; cuts Copperbelt-to-port time versus Durban/Dar es Salaam. Angolan section formerly the CFB state railway.","sources":["https://www.trafigura.com/news-and-insights/press-releases/2023/concession-for-railway-services-transferred-to-lobito-atlantic-railway-in-angola/","https://www.railway.supply/lobito-atlantic-railway-upgrade-financing-closes-at-753m/","https://www.lobitoatlantic.com/about-the-project/","https://africadosul.mirex.gov.ao/web/noticias/mais-de-125-mil-toneladas-transportadas-atraves-do-corredor-do-lobito-em-2024","https://www.railwaysafrica.com/news/mota-engil-announces-the-signing-of-a-concession-agreement-in-the-democratic-republic-of-the-congo"]},{"id":"ao-zambia-lobito-rail","name":"Zambia–Lobito greenfield railway (Luacano – Jimbe – Chingola)","modes":["rail"],"route":"Luacano (Moxico, on the Benguela line) → Jimbe (Zambia border) → North-Western Province → Chingola (Zambian Copperbelt)","countries":["AO","ZM"],"length":"c. 830 km (including c. 260 km in Angola)","operator":"Africa Finance Corporation (lead developer) with Angola and Zambia governments","status":"planned","capacity_or_traffic":"Initial offtake commitments c. 1 million t/yr; up to 5 million t/yr projected by 2030.","projects":"Total project cost c. USD 5bn; commitments above USD 4bn including AFC USD 500m, AfDB USD 200m, Italy/CDP EUR 300m, plus US DFC and EU; financial close expected Q1 2027, groundbreaking late 2026/early 2027, initial completion 2027–2028.","notes":"Extends the Lobito Corridor directly into Zambia, bypassing the DRC; feasibility and design studies funded by AFC/DFC/EU since 2023.","sources":["https://furtherafrica.com/2026/04/30/lobito-rail-corridor-gets-afc-afdb-backing/","https://www.africafc.org/news-and-insights/news/africa-finance-corporation-to-lead-us-backed-development-of-the-lobito-corridor-and-zambia-lobito-rail-line","https://international-partnerships.ec.europa.eu/policies/global-gateway/connecting-democratic-republic-congo-zambia-and-angola-global-markets-through-lobito-corridor_en"]},{"id":"ao-luanda-railway-cfl","name":"Luanda railway corridor (CFL: Luanda – Viana – N'Dalatando – Malanje)","modes":["rail","road"],"route":"Port of Luanda → Viana (ZEE/ICD) → Dondo/Baia branch → N'Dalatando → Malanje","countries":["AO"],"length":"c. 424 km main line (Luanda–Malanje)","operator":"Caminho de Ferro de Luanda EP (CFL, state company)","status":"operational","capacity_or_traffic":"Mixed passenger and general freight (fuel, cement, containers to Viana); volumes n/a.","projects":"Track (rail) replacement programme starting 2025; activation of an 8 km spur for fuel transport; government studies for extending the line towards the DRC border (Malanje–Cuango).","notes":"Rehabilitated 2005–2010 with Chinese financing; serves the Luanda-Bengo SEZ and Viana dry port. Passenger-heavy; freight share small.","sources":["https://cflep.co.ao/","https://www.angop.ao/noticias/transporte/cfl-comeca-substituicao-de-carris-no-primeiro-semestre-deste-ano/","https://www.sapo.pt/noticias/economia/caminho-de-ferro-de-luanda-vai-ativar-oito_5c671dbb4404a905d374a8a6","http://www.embaixadadeangola.pt/caminho-de-ferro-de-luanda-tera-ligacao-com-rdc/"]},{"id":"ao-mocamedes-railway-cfm","name":"Moçâmedes railway corridor (CFM: Namibe – Lubango – Menongue)","modes":["rail","road"],"route":"Port of Namibe/Sacomar → Lubango → Matala → Cuvango → Menongue (branch to Cassinga/Jamba iron-ore mines)","countries":["AO"],"length":"c. 860 km line (1,003 km track)","operator":"Caminho de Ferro de Moçâmedes EP (CFM, state company)","status":"operational","capacity_or_traffic":"Designed for Cassinga iron-ore exports through Sacomar; current freight volumes n/a.","projects":"Rebuilt 2006–2015 by China Hyway Group (Cape gauge); Sacomar and Namibe port upgrades completed Oct 2025 create export capacity; long-term proposals to extend towards Namibia (Trans-Cunene) and Zambia.","notes":"Southern corridor competing with Walvis Bay (Namibia) for the Huíla/Cunene hinterland.","sources":["https://en.wikipedia.org/wiki/Mo%C3%A7%C3%A2medes_Railway","https://www.toa-const.co.jp/eng/corp_overview/release/2025/251014.html"]},{"id":"ao-luanda-dande-corridor","name":"Luanda – Barra do Dande – Caxito road/pipeline corridor","modes":["road","pipeline"],"route":"Port of Luanda / Cacuaco refinery → EN-100 coastal road → Barra do Dande fuel terminal and free zone → Caxito","countries":["AO"],"length":"c. 50 km","operator":"Instituto Nacional de Estradas de Angola (INEA); PTOBD/SDBD for terminal pipelines","status":"under construction","capacity_or_traffic":"Fuel terminal 580,000 m3 phase 1 (2025); commercial port for 80,000 t vessels planned 2029–2030.","projects":"USD 450m supporting infrastructure (roads, utilities) under the July 2026 Huatong/Berkshire package; earlier USD 642m PTOBD terminal (2025).","notes":"Positions Barra do Dande as Luanda's overflow and strategic-reserve hub; road capacity on EN-100 north of Luanda is a bottleneck.","sources":["https://furtherafrica.com/2026/07/22/angola-secures-900m-barra-do-dande-port-and-free-zone-investment/","https://theenergyyear.com/news/first-phase-of-barra-do-dande-terminal-inaugurated-in-angola/"]},{"id":"ao-cabinda-corridor","name":"Cabinda – Pointe-Noire / Cabinda – DRC road corridor","modes":["road"],"route":"Cabinda city / Caio port → Massabi (Congo border) → Pointe-Noire; Cabinda → Yema (DRC border) → Muanda/Boma","countries":["AO","CG","CD"],"length":"c. 90 km Cabinda–Massabi; c. 60 km Cabinda–Yema","operator":"INEA (roads); Angolan customs (AGT)","status":"operational","capacity_or_traffic":"Informal and small-scale formal trade; Cabinda imports consumer goods via Pointe-Noire. Volumes n/a.","projects":"Caio deep-water port and free zone (2026) intended to reverse dependence on Pointe-Noire.","notes":"Exclave logistics rely on road links through two foreign countries; customs friction reported at Massabi (2022).","sources":["https://www.africanews.com/2022/10/21/residents-of-angola-congo-border-complain-of-custom-duties/","https://allafrica.com/stories/202609090719.html"]}],"border_crossings":[{"id":"ao-luau-dilolo","name":"Luau / Dilolo","with_country":"CD","with_country_name":"Democratic Republic of the Congo","type":"road+rail","location":{"city":"Luau (Moxico Leste)","lat":-10.7,"lng":22.23},"traffic":"Rail gateway of the Lobito Corridor: c. 125,000 t (2024) and c. 200,000 t international cargo (2025) on the LAR line; road freight limited.","status":"operational","hours":"n/a","projects":"Rail border procedures being streamlined under the Lobito Corridor Transit Facilitation Agency; DRC-side Dilolo–Kolwezi rehabilitation (Mota-Engil, USD 1.26bn).","notes":"Key chokepoint for copper/cobalt exports; customs interoperability between Angola and DRC is a stated corridor priority.","sources":["https://www.lobitoatlantic.com/about-the-project/","https://africadosul.mirex.gov.ao/web/noticias/mais-de-125-mil-toneladas-transportadas-atraves-do-corredor-do-lobito-em-2024","https://www.railwaysafrica.com/news/mota-engil-announces-the-signing-of-a-concession-agreement-in-the-democratic-republic-of-the-congo"]},{"id":"ao-santa-clara-oshikango","name":"Santa Clara / Oshikango","with_country":"NA","with_country_name":"Namibia","type":"road","location":{"city":"Santa Clara (Cunene)","lat":-17.38,"lng":15.84},"traffic":"Main Angola–Namibia trade gateway (fuel, consumer goods, Walvis Bay transit cargo); volumes n/a.","status":"operational","hours":"24/7 since 13 June 2024","projects":"24-hour operations launched jointly by Namibia and Angola (June 2024); Trans-Cunene corridor road upgrades.","notes":"Heavy informal trade and fuel arbitrage; Namibian side (Oshikango) has bonded warehouses serving southern Angola.","sources":["https://www.namibian.com.na/oshikango-santa-clara-border-post-launches-24-hour-operations/","https://nbcnews.na/node/105959"]},{"id":"ao-luvo-lufu","name":"Luvo / Lufu","with_country":"CD","with_country_name":"Democratic Republic of the Congo","type":"OSBP (one-stop border post)","location":{"city":"Luvo (Zaire province)","lat":-5.84,"lng":14.45},"traffic":"c. 50 cargo trucks/day (2026); busiest formal road crossing towards Kinshasa/Matadi.","status":"operational","hours":"n/a","projects":"New integrated border complex (38 buildings housing customs, police, immigration and phytosanitary services) opened March 2026 at a cost of AOA 583bn (c. USD 636m); planned logistics/light-processing hub.","notes":"Government has sought since 2021 to formalise large informal cross-border trade at Luvo.","sources":["https://www.ecofinagency.com/news-infrastructures/0103-53352-angola-opens-635-million-border-complex-to-facilitate-trade-with-drc","https://allafrica.com/stories/202104280798.html"]},{"id":"ao-noqui-matadi","name":"Noqui / Matadi","with_country":"CD","with_country_name":"Democratic Republic of the Congo","type":"road","location":{"city":"Noqui (Zaire province)","lat":-5.85,"lng":13.43},"traffic":"Secondary crossing opposite the DRC port of Matadi on the Congo River; mainly local and river-linked trade. Volumes n/a.","status":"operational","hours":"n/a","projects":"n/a","notes":"Gives northern Angola road access to Matadi port and the Matadi–Kinshasa corridor.","sources":["https://lca.logcluster.org/233-angola-noqui-border-crossing","https://bordercrossinghub.com/border-crossings-between-angola-and-democratic-republic-of-the-congo/"]},{"id":"ao-massabi","name":"Massabi (Cabinda – Republic of the Congo)","with_country":"CG","with_country_name":"Republic of the Congo","type":"road","location":{"city":"Massabi (Cabinda)","lat":-5.03,"lng":12.1},"traffic":"Main supply route for the Cabinda exclave from Pointe-Noire; daily small-trader traffic. Volumes n/a.","status":"operational","hours":"n/a","projects":"n/a","notes":"Residents within 10 km enjoy differentiated (duty-free non-commercial) treatment; complaints about high tariffs (2022).","sources":["https://www.africanews.com/2022/10/21/residents-of-angola-congo-border-complain-of-custom-duties/","https://ioverlander.com/places/31407-congo-cabinda-border-police-inmigration-and-customs"]},{"id":"ao-yema","name":"Yema (Cabinda – DRC)","with_country":"CD","with_country_name":"Democratic Republic of the Congo","type":"road","locat
