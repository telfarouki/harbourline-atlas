<title>Harbourline Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F3F6F9; --surface:#FFFFFF; --surface-2:#EAF0F5; --ink:#16212D; --ink-2:#4A5A6B; --ink-3:#7A8896;
    --line:#D8DFE7; --navy:#0E2A47; --steel:#2F6F9F; --steel-soft:#E4EEF6;
    --dpw:#B4701C; --dpw-soft:#F7ECDB;
    --ok:#1E7A6C; --ok-soft:#DDF1EC; --warn:#9A6B00; --warn-soft:#FBF1D4; --plan:#5B5F8A; --plan-soft:#E7E7F3; --off:#8A4B4B; --off-soft:#F4E1E1;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 10px 30px rgba(14,42,71,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F161E; --surface:#161F2A; --surface-2:#1C2733; --ink:#E7ECF1; --ink-2:#AEBAC6; --ink-3:#7C8A98;
      --line:#2A3542; --navy:#DCE7F3; --steel:#7FB2DA; --steel-soft:#1C2C3C;
      --dpw:#E0A55A; --dpw-soft:#33281A;
      --ok:#5FC3B0; --ok-soft:#173129; --warn:#E3B84A; --warn-soft:#332B12; --plan:#A9ACE0; --plan-soft:#25263A; --off:#E08C8C; --off-soft:#3A2323;
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F161E; --surface:#161F2A; --surface-2:#1C2733; --ink:#E7ECF1; --ink-2:#AEBAC6; --ink-3:#7C8A98;
    --line:#2A3542; --navy:#DCE7F3; --steel:#7FB2DA; --steel-soft:#1C2C3C;
    --dpw:#E0A55A; --dpw-soft:#33281A;
    --ok:#5FC3B0; --ok-soft:#173129; --warn:#E3B84A; --warn-soft:#332B12; --plan:#A9ACE0; --plan-soft:#25263A; --off:#E08C8C; --off-soft:#3A2323;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding-inline:0;padding-block:0;}
  *{box-sizing:border-box;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
  .app{display:grid;grid-template-columns:270px 1fr;height:100%;min-height:100vh;}
  /* sidebar */
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;color:var(--navy);letter-spacing:-.01em;}
  .brand .sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-top:2px;}
  .side .meta{padding:10px 18px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .clist{overflow:auto;padding:8px 10px 16px;flex:1;}
  .clist h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:12px 8px 4px;font-weight:600;}
  .cbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border-radius:6px;gap:8px;}
  .cbtn:hover{background:var(--surface-2);}
  .cbtn.active{background:var(--steel-soft);color:var(--navy);font-weight:600;}
  .cbtn .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .soonlist{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px;}
  .soonlist .chip{font-size:11px;color:var(--ink-3);}
  .mobile-sel{display:none;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);}
  select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;}
  /* main */
  .main{min-width:0;display:flex;flex-direction:column;min-height:0;}
  .chead{padding:22px 28px 0;border-bottom:1px solid var(--line);background:var(--surface);}
  .chead h2{font-family:var(--serif);font-size:28px;font-weight:700;margin:0;color:var(--navy);text-wrap:balance;}
  .chead .region{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--steel);font-weight:600;}
  .chead .summary{color:var(--ink-2);max-width:78ch;margin:8px 0 6px;}
  .ops{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
  .chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);}
  .chip.dpw{background:var(--dpw-soft);color:var(--dpw);font-weight:600;}
  .tabs{display:flex;gap:4px;overflow-x:auto;}
  .tab{padding:10px 14px;border-bottom:3px solid transparent;color:var(--ink-2);white-space:nowrap;font-weight:500;}
  .tab .cnt{margin-left:6px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .tab.active{color:var(--navy);border-bottom-color:var(--steel);font-weight:600;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 28px 0;align-items:center;}
  .tools input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;}
  .tools select{width:auto;}
  .tools .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .list{padding:14px 28px 40px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, box-shadow .15s;}
  .card:hover{border-color:var(--steel);box-shadow:0 2px 10px rgba(14,42,71,.08);}
  .card .t{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.3;color:var(--ink);text-wrap:balance;}
  .card .l{font-size:12.5px;color:var(--ink-3);}
  .card .d{color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .st{font-size:11px;font-weight:600;padding:1px 8px;border-radius:3px;letter-spacing:.02em;}
  .st.operational{background:var(--ok-soft);color:var(--ok);}
  .st.construction{background:var(--warn-soft);color:var(--warn);}
  .st.planned{background:var(--plan-soft);color:var(--plan);}
  .st.suspended,.st.closed{background:var(--off-soft);color:var(--off);}
  .st.dpw{background:var(--dpw-soft);color:var(--dpw);}
  .type{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;}
  .empty{color:var(--ink-3);padding:30px 0;grid-column:1/-1;}
  /* detail */
  .scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);overflow:auto;padding:0 0 40px;padding-top:env(safe-area-inset-top,0px);}
  .dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .dhead h3{font-family:var(--serif);font-size:22px;font-weight:700;margin:4px 0 6px;color:var(--navy);text-wrap:balance;}
  .close{font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--ink-2);}
  .close:hover{background:var(--surface-2);}
  .dbody{padding:16px 22px;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;margin:0;}
  .kv dt{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px;}
  .kv dd{margin:0;color:var(--ink);}
  .kv dd.na{color:var(--ink-3);}
  .dbody h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin:22px 0 8px;}
  .src a{display:block;color:var(--steel);text-decoration:none;font-size:13px;word-break:break-all;padding:3px 0;}
  .src a:hover{text-decoration:underline;}
  .maplink{display:inline-block;margin-top:4px;font-size:13px;color:var(--steel);text-decoration:none;border-bottom:1px solid var(--line);}
  /* gate */
  .gate[hidden]{display:none!important;}
  .gate{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .gate form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .gate h2{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:22px;}
  .gate p{color:var(--ink-2);margin:0 0 16px;font-size:13.5px;}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;letter-spacing:.08em;}
  .gate button{margin-top:12px;width:100%;padding:11px;border-radius:6px;background:var(--navy);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .gate button, .gate button{color:var(--paper);}
  .gate .err{color:var(--off);font-size:13px;margin-top:8px;min-height:1.2em;}
  @media (max-width: 820px){
    .app{grid-template-columns:1fr;}
    .side{display:none;}
    .mobile-sel{display:block;}
    .chead{padding:16px 16px 0;}
    .chead h2{font-size:23px;}
    .tools,.list{padding-inline:16px;}
    .kv{grid-template-columns:1fr;gap:2px 0;}
    .kv dt{margin-top:10px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h2>Harbourline Atlas</h2>
    <p>Enter the access code to open the atlas.</p>
    <input id="code" type="password" autocomplete="off" placeholder="Access code" aria-label="Access code">
    <button type="submit">Open</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><h1>Harbourline Atlas</h1><div class="sub">Ports · Zones · Corridors · Borders</div></div>
    <div class="meta" id="meta"></div>
    <nav class="clist" id="clist" aria-label="Countries"></nav>
  </aside>
  <main class="main">
    <div class="mobile-sel"><select id="msel" aria-label="Country"></select></div>
    <header class="chead" id="chead"></header>
    <div class="tools">
      <input type="search" id="q" placeholder="Search name, operator, city…" aria-label="Search">
      <select id="fstatus" aria-label="Status filter">
        <option value="">All statuses</option>
        <option value="operational">Operational</option>
        <option value="under construction">Under construction</option>
        <option value="planned">Planned</option>
        <option value="suspended">Suspended / closed</option>
      </select>
      <label style="font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center"><input type="checkbox" id="fdpw"> DP World only</label>
      <span class="count" id="count"></span>
    </div>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
</div>

<script id="atlas-data" type="application/json">__DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
  const CODE_HASH = "__CODEHASH__";
  const CATS = [
    {key:'ports', label:'Ports'},
    {key:'zones', label:'Free & industrial zones'},
    {key:'corridors', label:'Logistics corridors'},
    {key:'border_crossings', label:'Border crossings'}
  ];
  const REGION_ORDER = ['North Africa','West Africa','Central Africa','East Africa','Southern Africa','Gulf','Levant'];
  // Countries in scope but not yet researched (greyed out) — extended in later waves
  const SOON = {"North Africa":["Algeria","Tunisia","Libya","Mauritania","Sudan"],"West Africa":["Nigeria","Ghana","Côte d'Ivoire","Senegal","Togo","Benin","Guinea","Sierra Leone","Liberia","Mali","Burkina Faso","Niger","Gambia","Guinea-Bissau","Cabo Verde"],"Central Africa":["Gabon","Republic of the Congo","Chad","Central African Republic","Equatorial Guinea","São Tomé and Príncipe"],"East Africa":["Tanzania","Ethiopia","Djibouti","Somalia","Uganda","Rwanda","Burundi","South Sudan","Eritrea"],"Southern Africa":["South Africa","Mozambique","Namibia","Zambia","Zimbabwe","Botswana","Madagascar","Mauritius","Malawi","Eswatini","Lesotho","Comoros","Seychelles"],"Gulf":["Qatar","Kuwait","Bahrain","Oman","Yemen","Iran"],"Levant":["Jordan","Lebanon","Israel","Palestine","Türkiye"]};

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isNA = v => v==null || String(v).trim()==='' || /^n\/a\b/i.test(String(v).trim());
  const stClass = s => ({'operational':'operational','under construction':'construction','planned':'planned','suspended':'suspended','closed':'closed'}[s]||'planned');
  const isDPW = r => {
    if(/dp world/i.test(r.operator||'')) return true;
    const c=[r.concession,r.authority].filter(Boolean).join(' ');
    return /dp world/i.test(c) && !/\b(no|not|without|competitor|rival|suspended|earmarked|terminated|former|withdr\w*|cancel\w*)\b/i.test(c);
  };

  let state = {code: null, cat: 'ports', q: '', status: '', dpw: false};

  // ---- gate ----
  async function sha256(s){
    const b = new TextEncoder().encode(s);
    if(window.crypto && crypto.subtle){ const h = await crypto.subtle.digest('SHA-256', b); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    return sha256js(b);
  }
  // Compact SHA-256 fallback for non-secure contexts (previews); the published page uses crypto.subtle.
  function sha256js(msg){
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l=msg.length, ml=l*8, pad=((l+9+63)>>6)<<6, m=new Uint8Array(pad); m.set(msg); m[l]=0x80;
    const dv=new DataView(m.buffer); dv.setUint32(pad-4, ml>>>0); dv.setUint32(pad-8, Math.floor(ml/4294967296));
    const w=new Uint32Array(64), rotr=(x,n)=>(x>>>n)|(x<<(32-n));
    for(let i=0;i<pad;i+=64){
      for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
      for(let t=16;t<64;t++){ const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3), s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0; }
      let [a,b,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){ const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])>>>0, S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0; h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0; }
      H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
    }
    return H.map(x=>x.toString(16).padStart(8,'0')).join('');
  }
  function unlocked(){ try { return sessionStorage.getItem('hl-atlas-ok')==='1'; } catch(e){ return false; } }
  function openGate(){
    const g = $('#gate'); g.hidden = false; $('#app').setAttribute('aria-hidden','true');
    $('#gateForm').addEventListener('submit', async e => {
      e.preventDefault();
      const v = $('#code').value.trim();
      const ok = (await sha256(v)) === CODE_HASH;
      if(ok){ try{ sessionStorage.setItem('hl-atlas-ok','1'); }catch(e){} g.hidden = true; $('#app').removeAttribute('aria-hidden'); }
      else { $('#gateErr').textContent = 'Incorrect code.'; $('#code').select(); }
    });
    setTimeout(()=>$('#code').focus(), 50);
  }

  // ---- sidebar ----
  function buildSidebar(){
    const byRegion = {};
    Object.values(DATA).forEach(d => { (byRegion[d.country.region] = byRegion[d.country.region]||[]).push(d.country); });
    let html = ''; let opts = ''; let total = 0;
    REGION_ORDER.forEach(r => {
      const have = (byRegion[r]||[]).sort((a,b)=>a.name.localeCompare(b.name));
      if(!have.length) return;
      html += `<h3>${esc(r)}</h3>`;
      have.forEach(c => {
        const n = CATS.reduce((s,k)=>s+DATA[c.code][k.key].length,0); total += n;
        html += `<button class="cbtn" data-code="${c.code}"><span>${esc(c.name)}</span><span class="n">${n}</span></button>`;
        opts += `<option value="${c.code}">${esc(c.name)}</option>`;
      });
    });
    const soonAll = REGION_ORDER.flatMap(r => (SOON[r]||[]).filter(n => !(byRegion[r]||[]).some(c=>c.name===n)));
    html += `<h3>Coming in later waves · ${soonAll.length}</h3><div class="soonlist">${soonAll.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div>`;
    $('#clist').innerHTML = html;
    $('#msel').innerHTML = opts;
    $('#meta').textContent = `${Object.keys(DATA).length} countries · ${total} infrastructures · updated Sep 2026`;
    $('#clist').addEventListener('click', e => { const b = e.target.closest('.cbtn[data-code]'); if(b) selectCountry(b.dataset.code); });
    $('#msel').addEventListener('change', e => selectCountry(e.target.value));
  }

  function selectCountry(code){
    state.code = code; state.q=''; $('#q').value='';
    document.querySelectorAll('.cbtn').forEach(b => b.classList.toggle('active', b.dataset.code===code));
    $('#msel').value = code;
    renderHead(); renderList();
    try{ localStorage.setItem('hl-atlas-country', code); }catch(e){}
  }

  function renderHead(){
    const c = DATA[state.code].country;
    const ops = (c.key_operators||[]).map(o => `<span class="chip${/dp world/i.test(o)?' dpw':''}">${esc(o)}</span>`).join('');
    const tabs = CATS.map(k => `<button class="tab${state.cat===k.key?' active':''}" data-cat="${k.key}">${k.label}<span class="cnt">${DATA[state.code][k.key].length}</span></button>`).join('');
    $('#chead').innerHTML = `<div class="region">${esc(c.region)} · ${esc(c.capital||'')}${c.coastline?' · '+esc(c.coastline):''}</div>
      <h2>${esc(c.name)}</h2><p class="summary">${esc(c.summary||'')}</p><div class="ops">${ops}</div><div class="tabs">${tabs}</div>`;
    $('#chead .tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if(!t) return; state.cat = t.dataset.cat; renderHead(); renderList(); });
  }

  function subtitle(r){
    switch(state.cat){
      case 'ports': return [r.type, r.location&&r.location.city, r.operator].filter(x=>!isNA(x)).join(' · ');
      case 'zones': return [r.type, r.location&&r.location.city, r.area].filter(x=>!isNA(x)).join(' · ');
      case 'corridors': return [(r.modes||[]).join('/'), r.length, r.operator].filter(x=>!isNA(x)).join(' · ');
      case 'border_crossings': return ['with '+(r.with_country_name||r.with_country||''), r.type, r.location&&r.location.city].filter(x=>!isNA(x)).join(' · ');
    }
  }
  function blurb(r){
    switch(state.cat){
      case 'ports': return [r.throughput, r.capacity].filter(x=>!isNA(x))[0] || r.projects || r.notes || '';
      case 'zones': return (r.sectors&&r.sectors.length? r.sectors.join(', ')+'. ' : '') + (isNA(r.tenants)?'':r.tenants);
      case 'corridors': return r.route || r.projects || '';
      case 'border_crossings': return r.traffic || r.projects || r.notes || '';
    }
  }

  function renderList(){
    const rows = DATA[state.code][state.cat];
    const q = state.q.toLowerCase();
    const out = rows.filter(r => {
      if(state.status){ if(state.status==='suspended' ? !(r.status==='suspended'||r.status==='closed') : r.status!==state.status) return false; }
      if(state.dpw && !isDPW(r)) return false;
      if(q){ const hay = JSON.stringify(r).toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
    $('#count').textContent = `${out.length} of ${rows.length}`;
    if(!out.length){ $('#list').innerHTML = `<div class="empty">No ${CATS.find(k=>k.key===state.cat).label.toLowerCase()} match.</div>`; return; }
    $('#list').innerHTML = out.map(r => `
      <button class="card" data-id="${esc(r.id)}">
        <div class="row"><span class="st ${stClass(r.status)}">${esc(r.status)}</span>${isDPW(r)?'<span class="st dpw">▲ DP World</span>':''}</div>
        <div class="t">${esc(r.name)}</div>
        <div class="l">${esc(subtitle(r))}</div>
        <div class="d">${esc(blurb(r))}</div>
      </button>`).join('');
  }
  $('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if(c) openDetail(c.dataset.id); });
  $('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
  $('#fstatus').addEventListener('change', e => { state.status = e.target.value; renderList(); });
  $('#fdpw').addEventListener('change', e => { state.dpw = e.target.checked; renderList(); });

  // ---- detail ----
  const LABELS = {type:'Type',operator:'Operator',concession:'Concession',capacity:'Capacity',throughput:'Throughput',opened:'Opened',projects:'Projects',notes:'Notes',authority:'Authority / developer',area:'Area',sectors:'Sectors',incentives:'Incentives',tenants:'Tenants',modes:'Modes',route:'Route',countries:'Countries',length:'Length',capacity_or_traffic:'Capacity / traffic',with_country_name:'Neighbour',traffic:'Traffic',hours:'Hours'};
  const ORDER = {ports:['type','operator','concession','capacity','throughput','opened','projects','notes'],zones:['type','authority','area','sectors','incentives','tenants','opened','projects','notes'],corridors:['modes','route','countries','length','operator','capacity_or_traffic','projects','notes'],border_crossings:['with_country_name','type','traffic','hours','projects','notes']};
  function openDetail(id){
    const r = DATA[state.code][state.cat].find(x=>x.id===id); if(!r) return;
    const loc = r.location||{};
    const rows = ORDER[state.cat].map(k => { let v = r[k]; if(Array.isArray(v)) v = v.join(', '); const na = isNA(v); return `<dt>${LABELS[k]||k}</dt><dd class="${na?'na':''}">${na?'n/a':esc(v)}</dd>`; }).join('');
    const map = (typeof loc.lat==='number') ? `<a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}">Open in Google Maps (${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)})</a>` : '';
    const src = (r.sources||[]).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,''))}</a>`).join('');
    const el = document.createElement('div'); el.id='dwrap';
    el.innerHTML = `<div class="scrim" data-close></div>
      <aside class="detail" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
        <div class="dhead"><div>
          <div class="row"><span class="st ${stClass(r.status)}">${esc(r.status)}</span>${isDPW(r)?'<span class="st dpw">▲ DP World</span>':''}<span class="type">${esc(CATS.find(k=>k.key===state.cat).label)} · ${esc(DATA[state.code].country.name)}</span></div>
          <h3>${esc(r.name)}</h3>
          <div class="l" style="color:var(--ink-3);font-size:13px">${esc([loc.city].filter(x=>!isNA(x)).join(''))}</div>${map}
        </div><button class="close" data-close aria-label="Close">×</button></div>
        <div class="dbody"><dl class="kv">${rows}</dl><h4>Sources</h4><div class="src">${src||'<span style="color:var(--ink-3)">none recorded</span>'}</div></div>
      </aside>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeDetail(); });
    document.addEventListener('keydown', escClose);
    el.querySelector('.close').focus();
  }
  function escClose(e){ if(e.key==='Escape') closeDetail(); }
  function closeDetail(){ const el = document.getElementById('dwrap'); if(el) el.remove(); document.removeEventListener('keydown', escClose); }

  // ---- boot ----
  buildSidebar();
  let first = Object.keys(DATA).sort()[0];
  try{ const s = localStorage.getItem('hl-atlas-country'); if(s && DATA[s]) first = s; }catch(e){}
  selectCountry(first);
  if(CODE_HASH && !unlocked()) openGate();
})();
</script>
